  diagnostics:
    - diagnostic_id: D-ADJ-ORIGIN-MATERIAL
      pages: [1, 2]
      trigger: "Child confuses where-from with made-of."
      probe: "Does this word tell where it is from, or what it is made of?"
      likely_error: GRAMMAR_RULE_ERROR
      repair: "Contrast an origin word with a material word using the two recognition questions."
      fresh_retry: "Classify a new origin/material pair."

    - diagnostic_id: D-ADJ-SIZE-SHAPE
      pages: [1, 2]
      trigger: "Child confuses how big/wide with what shape."
      probe: "Does the word tell how big/wide, or what shape?"
      likely_error: APPLICATION_ERROR
      repair: "Contrast wide with round."
      fresh_retry: "Classify tiny without help."

    - diagnostic_id: D-ADJ-BOUNDARY-INVENTION
      page: 5
      trigger: "Learner or author forces an unresolved adjective into a new category."
      probe: "Which of the seven source questions does this word answer cleanly?"
      likely_error: SOURCE_MODEL_BOUNDARY
      repair: "Keep the word outside the seven boxes unless source evidence establishes a category."
      fresh_retry: "Classify only source-supported adjectives in a new phrase."

    - diagnostic_id: D-WRITING-ADJECTIVE-STUFFING
      pages: [8, 10]
      trigger: "Description becomes a long adjective pile."
      probe: "Can one detail move into its own sentence?"
      likely_error: SENTENCE_CONTROL_ERROR
      repair: "Spread details across sentences and preserve a clear noun."
      fresh_retry: "Rewrite one sentence with fewer stacked adjectives."

    - diagnostic_id: D-INFERENCE-UNSUPPORTED
      pages: [15, 16]
      trigger: "Answer is plausible but has no text clue."
      probe: "Which words in the text helped you think that?"
      likely_error: EVIDENCE_ERROR
      repair: "Fill Answer, Clue, Connection separately."
      fresh_retry: "Use a new passage."

    - diagnostic_id: D-MULTI-CAUSE-ONE-CLUE
      pages: [17, 18]
      trigger: "Child names only hunting."
      probe: "Find two other human-linked actions in the danger stanza."
      likely_error: TEXT_LOCATION_ERROR
      repair: "Collect several clues before combining them."
      fresh_retry: "Use a new three-cause paragraph."

  transfer:
    - transfer_id: TR-ADJ-OWN-DESCRIPTION
      pages: [7, 8, 9, 10, 11]
      from: GRAMMAR_CLASSIFICATION_AND_ORDER
      to: AUTHENTIC_DESCRIPTIVE_WRITING

    - transfer_id: TR-READING-FRESH-POEM
      page: 14
      from: STANZA_SUMMARY
      to: NEW_CONSERVATION_POEM

    - transfer_id: TR-INFERENCE-FRESH-TEXT
      page: 16
      from: ANSWER_CLUE_CONNECTION
      to: NEW_CAUSE_EFFECT_PASSAGE

    - transfer_id: TR-MULTI-CAUSE-FRESH
      page: 18
      from: MULTI_CLUE_SYNTHESIS
      to: NEW_THREE_CAUSE_PARAGRAPH

    - transfer_id: TR-SPECIES-THREAT-ACTION
      pages: [19, 20]
      from: POEM_MESSAGE
      to: NEW_SPECIES_AND_HUMAN_LINKED_THREAT

    - transfer_id: TR-CHOICE-REASON-FRESH-STORY
      page: 21
      from: HYPOTHETICAL_CHOICE
      to: NEW_STORY

  delayed_retrieval:
    status: NOT_PRESENT_AS_EXPLICIT_DELAYED_CHECK
    note: >-
      The upload contains fresh independent retries and transfer tasks, but no
      explicit 3-7 day delayed-retrieval marker. Under the draft schema this is a
      production gap for a study/revision product, not evidence of learner failure.

  extraction_review:
    strengths:
      - "Strong teach -> guided try -> hint -> fresh retry pattern across modules."
      - "Persistent visual organizers support classification, order, writing, and reasoning."
      - "Fresh retries reduce the chance that success comes only from memorising a model."
      - "Reading tasks separate answer, evidence, and reasoning rather than accepting unsupported guesses."
      - "The guide explicitly recognises source boundaries instead of inventing adjective categories."

    structural_gaps_under_new_schema:
      - id: GAP-PRIMARY-AUTHORITY
        severity: HIGH
        description: >-
          The file claims worksheet/source rules but is itself a derived guide.
          Primary-workbook authority is not preserved strongly enough inside the artifact.

      - id: GAP-CHILD-SURFACE-TECHNICALITY
        severity: MEDIUM
        description: >-
          Some headings and boundary language remain adult/technical. Internal labels
          should have simpler child-facing counterparts.

      - id: GAP-DELAYED-RETRIEVAL
        severity: MEDIUM
        description: "No explicit delayed-retention check is scheduled or marked."

      - id: GAP-GENERIC-PLACEHOLDERS
        severity: MEDIUM
        description: >-
          Several pages contain generic 'Contrast Pair A <-> B' placeholders rather
          than fully instantiated contrasts, weakening the learner-facing surface.

      - id: GAP-PAGE-COUNT
        severity: LOW
        description: >-
          The 21-page scope is broad. It is pedagogically richer than a rule-dump,
          but a focused adjective-only study guide should be shorter and keep the
          reading/poem unit separate unless intentionally combined.

    decision: >-
      Use this extraction as a benchmark for the new draft schema, but do not treat
      adj.pdf as the primary workbook authority. Rebuild future adjective material
      from primary source evidence with the same strong learning spine and clearer
      child/teacher surface separation.
