name: V2 Mathematics Canonical

on:
  pull_request:
    paths:
      - "Grade 9/V2/Mathematics/Canonical/**"
      - ".github/workflows/v2-math-canonical.yml"
  workflow_dispatch:

jobs:
  math-canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Validate MATH-V2-01 contracts and canonical package
        run: python "Grade 9/V2/Mathematics/Canonical/contracts/validate_contracts.py"
      - name: Run Mathematics canonical falsifiers
        run: python "Grade 9/V2/Mathematics/Canonical/tests/test_math_canonical.py"
      - name: Deterministic canonical replay
        run: |
          A=/tmp/math-v2-a.json
          B=/tmp/math-v2-b.json
          python "Grade 9/V2/Mathematics/Canonical/engine/build_math_canonical.py" --out "$A"
          python "Grade 9/V2/Mathematics/Canonical/engine/build_math_canonical.py" --out "$B"
          cmp "$A" "$B"
      - name: Upload canonical proof package
        uses: actions/upload-artifact@v4
        with:
          name: math-v2-01-canonical-proof
          path: /tmp/math-v2-a.json
          if-no-files-found: error
