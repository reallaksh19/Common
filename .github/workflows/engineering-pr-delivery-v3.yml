name: engineering-pr-delivery-v3

on:
  pull_request:
    paths:
      - 'skills/engineering-pr-delivery-v3/**'
      - '.github/workflows/engineering-pr-delivery-v3.yml'
  push:
    branches:
      - 'main'
      - 'v3/**'
    paths:
      - 'skills/engineering-pr-delivery-v3/**'
      - '.github/workflows/engineering-pr-delivery-v3.yml'

permissions:
  contents: read

jobs:
  validate-v3-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Compile V3 Python
        run: python -m compileall -q skills/engineering-pr-delivery-v3/scripts skills/engineering-pr-delivery-v3/tests
      - name: Run V3 foundation tests
        run: python -m unittest discover -s skills/engineering-pr-delivery-v3/tests -p 'test*.py' -v
