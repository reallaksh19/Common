name: V2 Chemistry Assessment Review C-B
on:
  pull_request:
    paths:
      - 'Grade 9/V2/Chemistry/AssessmentIntake/**'
      - 'Grade 9/V2/Chemistry/AssessmentReview/**'
      - '.github/workflows/v2-chemistry-assessment-review.yml'
jobs:
  chemistry-assessment-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.20,<5'
      - name: Validate C-B contracts and registries
        run: python 'Grade 9/V2/Chemistry/AssessmentReview/contracts/validate_contracts.py'
      - name: Run Chemistry source-integrity and assessment-safety falsifiers
        run: python 'Grade 9/V2/Chemistry/AssessmentReview/tests/test_chemistry_assessment_review.py'
      - name: Deterministic review replay
        run: |
          D='Grade 9/V2/Chemistry/AssessmentReview'
          I='Grade 9/V2/Chemistry/AssessmentIntake'
          python "$D/engine/review_chemistry_assessment.py" --sources "$I/fixtures/mixed-chemistry-source.fixture.json" --questions "$I/fixtures/mixed-chemistry-question-set.fixture.json" --registry "$D/registry/chemistry-item-validity-registry.json" --policy "$D/policies/chemistry-diagnostic-use-policy.json" --qc-events "$D/registry/chemistry-qc-events.json" --out /tmp/a.json --review-bundle-id DET
          python "$D/engine/review_chemistry_assessment.py" --sources "$I/fixtures/mixed-chemistry-source.fixture.json" --questions "$I/fixtures/mixed-chemistry-question-set.fixture.json" --registry "$D/registry/chemistry-item-validity-registry.json" --policy "$D/policies/chemistry-diagnostic-use-policy.json" --qc-events "$D/registry/chemistry-qc-events.json" --out /tmp/b.json --review-bundle-id DET
          cmp /tmp/a.json /tmp/b.json
      - name: Prove unresolved low-confidence charge item fails closed
        run: |
          D='Grade 9/V2/Chemistry/AssessmentReview'
          I='Grade 9/V2/Chemistry/AssessmentIntake'
          python "$D/engine/review_chemistry_assessment.py" --sources "$I/fixtures/mixed-chemistry-source.fixture.json" --questions "$I/fixtures/mixed-chemistry-question-set.fixture.json" --registry "$D/registry/chemistry-item-validity-registry.json" --policy "$D/policies/chemistry-diagnostic-use-policy.json" --qc-events "$D/registry/chemistry-qc-events.json" --out /tmp/review.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/review.json'))
          q={r['item_ref']:r for r in x['question_reviews']}['CQ13']
          assert q['source_integrity_state']=='FORMULA_OR_CHARGE_AMBIGUITY'
          assert q['validity_state']=='REVIEW_REQUIRED'
          assert q['diagnostic_use']=='EXCLUDE_FROM_NEGATIVE_INFERENCE'
          assert q['diagnostic_constraints']['negative_inference_allowed'] is False
          assert 'QUESTION:CQ13' in x['summary']['blocking_review_refs']
          PY
