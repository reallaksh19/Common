name: COMB-02 PDF Custody

on:
  push:
    branches: [ioqm-g9-comb02-graphs-colouring]
    paths:
      - '.github/workflows/comb02-build-audit.yml'

permissions:
  contents: write

jobs:
  render-and-custody:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ioqm-g9-comb02-graphs-colouring
          fetch-depth: 0

      - name: Install render dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra fonts-dejavu-core fonts-dejavu-extra poppler-utils

      - name: Render canonical PDFs
        shell: bash
        run: |
          set -euo pipefail
          TOPIC='Grade 9/Mathematics/IOQM/03_Main_Topics/COMB-02_Graphs_Colouring_Incidence_Counting'
          python "$TOPIC/Authoring/render_comb02_pdfs.py"
          test -s "$TOPIC/PDFs/COMB02_Student_Pack_v1.pdf"
          test -s "$TOPIC/PDFs/COMB02_Teacher_Key_v1.pdf"

      - name: Structural preflight and learner scrub
        shell: bash
        run: |
          set -euo pipefail
          TOPIC='Grade 9/Mathematics/IOQM/03_Main_Topics/COMB-02_Graphs_Colouring_Incidence_Counting'
          STUDENT="$TOPIC/PDFs/COMB02_Student_Pack_v1.pdf"; TEACHER="$TOPIC/PDFs/COMB02_Teacher_Key_v1.pdf"
          test "$(pdfinfo "$STUDENT" | awk '/^Pages:/ {print $2}')" = '14'
          test "$(pdfinfo "$TEACHER" | awk '/^Pages:/ {print $2}')" = '6'
          pdfinfo "$STUDENT" | grep -q '^Encrypted:       no'; pdfinfo "$TEACHER" | grep -q '^Encrypted:       no'
          pdftotext "$STUDENT" /tmp/student.txt; pdftotext "$TEACHER" /tmp/teacher.txt
          ! grep -Eqi 'COMB-02|issue #[0-9]+|pull request|PR #[0-9]+|branch|microstream|interface|metadata schema|H[0-3]|F[0-4]|DRAFT_AUTHORING' /tmp/student.txt
          grep -q 'Graphs, Colouring' /tmp/student.txt; grep -q 'Teacher' /tmp/teacher.txt

      - name: Write custody manifest
        shell: bash
        run: |
          set -euo pipefail
          TOPIC='Grade 9/Mathematics/IOQM/03_Main_Topics/COMB-02_Graphs_Colouring_Incidence_Counting'
          STUDENT="$TOPIC/PDFs/COMB02_Student_Pack_v1.pdf"; TEACHER="$TOPIC/PDFs/COMB02_Teacher_Key_v1.pdf"
          S_SHA=$(sha256sum "$STUDENT" | awk '{print $1}'); T_SHA=$(sha256sum "$TEACHER" | awk '{print $1}')
          S_SIZE=$(stat -c '%s' "$STUDENT"); T_SIZE=$(stat -c '%s' "$TEACHER")
          cat > "$TOPIC/PDF_Custody.md" <<EOF
          # COMB-02 PDF Custody

          Status: \`RENDERED_PREFLIGHTED_REPOSITORY_CUSTODY_PENDING_EXACT_BINARY_VISUAL_CONFIRMATION\`

          Canonical renderer: \`Authoring/render_comb02_pdfs.py\`
          Source render commit: \`${GITHUB_SHA}\`

          | Artifact | Pages | Bytes | SHA-256 |
          |---|---:|---:|---|
          | \`PDFs/COMB02_Student_Pack_v1.pdf\` | 14 | ${S_SIZE} | \`${S_SHA}\` |
          | \`PDFs/COMB02_Teacher_Key_v1.pdf\` | 6 | ${T_SIZE} | \`${T_SHA}\` |

          Automated checks in this run:
          - A4 page-count contract: PASS (student 14, teacher 6)
          - open/text extraction: PASS via \`pdfinfo\` and \`pdftotext\`
          - encryption: PASS_NONE
          - learner control-plane scrub: PASS_STATIC
          - exact repository binary visual inspection: PENDING until artifact retrieval and page-render inspection

          Independent source note: exact stems are closed 6/6; exact page-image confirmation for \`IOQM-2023-Q22\` remains a separate fail-closed source gate.

          Classroom timing/readability, retention, psychometrics, qualification/pass-mark calibration, and publication approval remain \`NOT_RUN\`.
          EOF

      - name: Commit binary custody artifacts
        shell: bash
        run: |
          set -euo pipefail
          TOPIC='Grade 9/Mathematics/IOQM/03_Main_Topics/COMB-02_Graphs_Colouring_Incidence_Counting'
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TOPIC/PDFs/COMB02_Student_Pack_v1.pdf" "$TOPIC/PDFs/COMB02_Teacher_Key_v1.pdf" "$TOPIC/PDF_Custody.md"
          git commit -m 'COMB-02: add benchmark PDF custody artifacts'
          git push origin HEAD:ioqm-g9-comb02-graphs-colouring

      - name: Upload exact custody artifact
        uses: actions/upload-artifact@v4
        with:
          name: comb02-pdf-custody
          path: |
            Grade 9/Mathematics/IOQM/03_Main_Topics/COMB-02_Graphs_Colouring_Incidence_Counting/PDFs/COMB02_Student_Pack_v1.pdf
            Grade 9/Mathematics/IOQM/03_Main_Topics/COMB-02_Graphs_Colouring_Incidence_Counting/PDFs/COMB02_Teacher_Key_v1.pdf
            Grade 9/Mathematics/IOQM/03_Main_Topics/COMB-02_Graphs_Colouring_Incidence_Counting/PDF_Custody.md
          if-no-files-found: error
          retention-days: 30
