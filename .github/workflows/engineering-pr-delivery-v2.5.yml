name: engineering-pr-delivery-v2.5

on:
  # Required PR checks must always instantiate. Path relevance is decided inside
  # the job so an irrelevant PR still receives a terminal successful check.
  pull_request:
  push:
    branches:
      - 'main'
      - 'agent/engineering-pr-delivery-v2.5*'
    paths:
      - 'skills/engineering-pr-delivery-v2.5/**'
      - 'skills/three-pass-prompt-generator/**'
      - '.github/workflows/engineering-pr-delivery-v2.5.yml'

permissions:
  contents: read

jobs:
  validate-v25:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Relay path relevance
        id: relevance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_paths="$RUNNER_TEMP/relay-changed-paths.txt"
          if ! git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Path relevance could not be determined; running full validation." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          relevant=false
          while IFS= read -r path; do
            case "$path" in
              skills/engineering-pr-delivery-v2.5/*|skills/three-pass-prompt-generator/*|.github/workflows/engineering-pr-delivery-v2.5.yml)
                relevant=true
                break
                ;;
            esac
          done < "$changed_paths"

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [[ "$relevant" == "false" ]]; then
            echo "Relay scope unchanged; check is NOT_APPLICABLE and terminal." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Relay scope not applicable
        if: steps.relevance.outputs.relevant != 'true'
        run: echo "NOT_APPLICABLE: no engineering-pr-delivery-v2.5 paths changed."

      - name: Set up Python
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Compile V2.5 Python
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m compileall -q skills/engineering-pr-delivery-v2.5/scripts skills/engineering-pr-delivery-v2.5/tests skills/three-pass-prompt-generator
      - name: Run V2.5 self-consistency audit
        if: steps.relevance.outputs.relevant == 'true'
        run: python skills/engineering-pr-delivery-v2.5/scripts/self_consistency_audit.py .
      - name: Run V2.5 unit tests
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m unittest discover -s skills/engineering-pr-delivery-v2.5/tests -p 'test*.py' -v
      - name: Run V2.5 synthetic stress tests
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m unittest discover -s skills/engineering-pr-delivery-v2.5/tests/stress -p 'test*.py' -v
