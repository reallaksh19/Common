name: engineering-pr-delivery-v2.5

on:
  pull_request:
    paths:
      - 'skills/engineering-pr-delivery-v2.5/**'
      - 'skills/three-pass-prompt-generator/**'
      - '.github/workflows/engineering-pr-delivery-v2.5.yml'
  push:
    branches:
      - 'main'
      - 'agent/engineering-pr-delivery-v2.5*'
    paths:
      - 'skills/engineering-pr-delivery-v2.5/**'
      - 'skills/three-pass-prompt-generator/**'
      - '.github/workflows/engineering-pr-delivery-v2.5.yml'

permissions:
  contents: read

jobs:
  validate-v25:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Compile V2.5 Python
        run: python -m compileall -q skills/engineering-pr-delivery-v2.5/scripts skills/engineering-pr-delivery-v2.5/tests skills/three-pass-prompt-generator
      - name: Run V2.5 self-consistency audit
        run: python skills/engineering-pr-delivery-v2.5/scripts/self_consistency_audit.py .
      - name: Run V2.5 unit tests
        run: python -m unittest discover -s skills/engineering-pr-delivery-v2.5/tests -p 'test*.py' -v
      - name: Run V2.5 synthetic stress tests
        run: python -m unittest discover -s skills/engineering-pr-delivery-v2.5/tests/stress -p 'test*.py' -v
