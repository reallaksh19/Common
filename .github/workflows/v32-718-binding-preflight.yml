name: v32-718-binding-preflight

on:
  pull_request:
    paths:
      - '.github/v32-evidence-spine/**'
      - '.github/workflows/v32-718-binding-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  bound-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # retained oracle ancestry must be provable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checkpoint-fact parser dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Revalidate released V3.2 contract and four exact provider bindings
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 69dd8a80df0a3ac0cacabee7cbe10860ed729545 HEAD
          GRAPH=.github/v32-evidence-spine/718-proposal-v2.json
          DELP=skills/engineering-pr-delivery-v3.2/scripts/delp_projection_v32.py
          python "$DELP" validate-graph --graph "$GRAPH"
          python "$DELP" decompose-check --graph "$GRAPH" --json > /tmp/718-bound-report.json
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          graph = json.loads(Path('.github/v32-evidence-spine/718-proposal-v2.json').read_text(encoding='utf-8'))
          report = json.loads(Path('/tmp/718-bound-report.json').read_text(encoding='utf-8'))
          oracle = json.loads(Path('.github/v32-evidence-spine/793-binding-oracles-v1.json').read_text(encoding='utf-8'))
          assert oracle['schema'] == 'common-v32-793-binding-oracles-v1'
          assert oracle['authority'] == 'PRECOMMITTED_PROPOSED_EXPECTED_RESULTS_NOT_OWNER_ACCEPTANCE'
          proposal = graph['programme']['decomposition_proposal']
          assert report['proposal_digest'] == proposal['released_proposal_digest'] == 'sha256:f86b7caf62dfbea4df9b1e342a6c306fd0abe708a973d84f75df8c0fbf27c3bd'
          assert report['release_state'] == 'RELEASEABLE', report
          assert report['summary']['evaluated'] == 6, report
          assert report['summary']['not_releasable'] == 0, report
          # Compare the CURRENT provider graph to a separately precommitted ESC-4
          # expected-result file. The historic C0 golden oracle stays untouched.
          assert oracle['released_proposal_digest'] == proposal['released_proposal_digest']
          assert oracle['expected_reserve_weight'] == 20 and oracle['old_reserve_weight'] == 35
          assert graph['nodes'][0]['reserve_weight'] == oracle['expected_reserve_weight']
          expected = {b['responsibility_id']: b for b in oracle['expected_bindings']}
          observed = {b['responsibility_id']: b['ref'] for b in proposal['bindings']}
          assert observed == {k: v['ref'] for k,v in expected.items()}, (observed, expected)
          leaves = {n['responsibility_id']: n for n in graph['nodes'] if n['kind'] == 'LEAF'}
          assert set(leaves) == set(expected), leaves
          assert len(graph['nodes']) == oracle['expected']['node_count'] == 5
          assert sum(n['weight'] for n in leaves.values()) + graph['nodes'][0]['reserve_weight'] == oracle['expected']['total_root_weight'] == 100
          for identity, fixture in expected.items():
              node = leaves[identity]
              assert node['ref'] == fixture['ref'] and node['weight'] == fixture['weight'], node
          new = oracle['expected_new_node']
          selected = leaves[new['responsibility_id']]
          assert selected['ref'] == new['ref'] and selected['parent'] == new['parent']
          assert selected['kind'] == new['kind'] and selected['work_class'] == new['work_class']
          assert selected['owns_claims'] == new['owns_claims'] and selected['depends_on'] == new['depends_on']
          registration = json.loads(Path('.github/v32-evidence-spine/793-c4-material-binding-v1.json').read_text(encoding='utf-8'))
          assert registration['responsibility'] == 'R-RECONSTRUCTION'
          assert selected.get('primary_pr') == registration['proposed_acceptance']['graph_primary_pr'] == 'Common#800'
          assert selected.get('primary_pr') != 'Common#794'
          proposed = next(r for r in proposal['responsibilities'] if r['id'] == new['responsibility_id'])
          assert selected['outcome'] == proposed['outcome']
          assert selected['independence_basis'] == proposed['independence_basis']
          assert selected['write_surface'] == proposed['write_surface']
          assert selected['size_budget'] == proposed['size_budget']
          assert selected['acceptance_methods'] == proposed['acceptance_methods']
          assert [(u['id'],u['weight']) for u in selected['units']] == [(u['id'],u['weight']) for u in new['semantic_units']]
          assert [(u['id'],u['weight'],u['outcome'],u['verify']) for u in selected['units']] == [
              (u['id'],u['weight'],u['outcome'],u['verify']) for u in proposed['semantic_units']]
          assert sum(u['weight'] for u in selected['units']) == 100
          path = Path('skills/engineering-pr-delivery-v3.2/scripts/delp_projection_v32.py')
          spec = importlib.util.spec_from_file_location('delp718', path)
          mod = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(mod)
          projected = mod.project(graph, [], {})
          for row in leaves.values():
              assert projected['nodes'][row['ref']]['plan']['releasable'], projected['nodes'][row['ref']]['plan']
          assert projected['nodes']['Common#793']['progress']['P'] == oracle['expected']['new_leaf_P'] == 0
          assert projected['nodes']['Common#793']['progress']['E'] == oracle['expected']['new_leaf_E'] == 0
          assert not projected['rejected_facts'], projected['rejected_facts']
          print('V32_718_BOUND_RELEASE=PASS')
          print('V32_718_PROPOSAL_DIGEST='+report['proposal_digest'])
          print('V32_718_MATERIALIZED='+':'.join(sorted(leaves)))
          print('V32_718_RESERVE='+str(graph['nodes'][0]['reserve_weight']))
          print('V32_793_NO_FACT_OR_PROGRESS_PROMOTION=PASS')
          print('V32_718_PLAN_JOIN=PASS')
          PY

      - name: Run eight named ESC-4 graph-binding source/oracle tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s .github/v32-evidence-spine -p 'test_793_binding_oracles_v32.py' -v 2>&1 | tee /tmp/v32-793-tests.log
          python - <<'PY'
          from pathlib import Path
          log = Path('/tmp/v32-793-tests.log').read_text(encoding='utf-8')
          missing = [f'test_{i:02d}_' for i in range(1,9) if f'test_{i:02d}_' not in log]
          if missing or 'Ran 8 tests' not in log or 'OK' not in log:
              raise SystemExit(f'ESC4_NAMED_TESTS_NOT_EXECUTED: {missing}')
          print('V32_793_NAMED_SOURCE_BINDING_TESTS=8_PASS')
          PY

      - name: Actual source-bound PR material (read-only dry-run)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          script = Path('skills/engineering-pr-delivery-v3.2/scripts/delp_projection_v32.py')
          spec = importlib.util.spec_from_file_location('delp733_material', script)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          graph = json.loads(Path('.github/v32-evidence-spine/718-proposal-v2.json').read_text())
          transport = module.GhTransport('reallaksh19/Common')
          observation = module.observe_github(transport, graph)
          assert observation['Common#720']['candidate_sha'] == 'b3dfba3becf829d3a4e21d6eaa54983f05317b65', observation
          assert observation['Common#724']['candidate_sha'] == '7ef9fbdd0c6f0f941fd573c1663c7a142fc41414', observation
          assert observation['Common#720']['pr_state'] == 'MERGED', observation
          assert observation['Common#724']['pr_state'] == 'MERGED', observation
          selected = next(n for n in graph['nodes'] if n.get('responsibility_id') == 'R-PROJECTION')
          if selected.get('primary_pr') == 'Common#740':
              product_pr = transport.get_pull(740)
              provider_state = ('MERGED' if product_pr.get('merged') else
                                str(product_pr.get('state') or 'UNKNOWN').upper())
              assert observation['Common#733']['pr_state'] == provider_state, observation
              head = observation['Common#733']['candidate_sha']
              assert head == (product_pr.get('head') or {}).get('sha'), observation
              assert isinstance(head, str) and len(head) == 40, observation
              print('V32_733_PRODUCT_PR_BOUND=Common#740')
              print('V32_733_LIVE_BOUND_HEAD=' + head)
              print('V32_733_LIVE_BOUND_STATE=' + provider_state)
          else:
              assert 'Common#733' not in observation, observation
          preview = module.plan_github(transport, graph)
          assert preview['input_digest'].startswith('sha256:'), preview
          assert 'Common#733' in preview['expected_titles'], preview
          print('V32_733_REAL_PR_SOURCE_BINDING=PASS')
          print('V32_733_PROVIDER_LEAVES=Common#720:Common#724')
          print('V32_733_DRY_RUN_INPUT_DIGEST=' + preview['input_digest'])
          print('V32_733_DRY_RUN_WOULD_WRITE_TITLES=' + str(preview['would_write_titles']))
          print('V32_733_DRY_RUN_REJECTED_FACTS=' + str(len(preview['rejected_facts'])))
          print('V32_733_NO_MUTATION=PASS')
          PY

      - name: Source-based live issue and draft PR smart-title readback (GET only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python skills/engineering-pr-delivery-v3.2/scripts/vertical_cycle_v32.py \
            --live-readback \
            --graph .github/v32-evidence-spine/718-proposal-v2.json \
            --manifest .github/v32-evidence-spine/718-golden-fixtures-v1.json \
            --report /tmp/v32-718-live-readback.json > /tmp/v32-718-live-readback.stdout
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/v32-718-live-readback.json").read_text(encoding="utf-8"))
          assert r["authority"] == "READ_ONLY_SELF_REPLAY_NO_ACCEPTANCE", r
          assert r["pr_binding"] == "BOUND", r
          assert r["candidate_sha"] and len(r["candidate_sha"]) == 40, r
          # Never freeze OPEN/MERGED historical candidates or zero progress:
          # accepted facts may arrive after the source PR is merged. Test
          # integrity/shape and print actual provider-derived state instead.
          historical = r["historical_unreported"]
          assert isinstance(historical, list) and len(historical) == len(set(historical)), r
          assert set(historical).issubset({"Common#720","Common#724","Common#733"}), r
          progress = r["semantic_progress"]
          assert all(isinstance(progress.get(k), int) and progress[k] >= 0
                     for k in ("P","E","D","DE")), r
          assert all(progress[k] <= 100 for k in ("P","E","D","DE")), r
          assert r["qualifier"]["state"] == "UNPROVEN", r
          assert r["full_ESC_6_gate"] == "FAIL_CLOSED_UNRELEASED_CONSUMERS", r
          assert r["authority_effects"] == [], r
          assert set(r["read_views"]) == {"Common#718","Common#733","Common#740"},r
          print("V32_733_PROVIDER_LIVE_READBACK=PASS_NO_MUTATION")
          print("V32_733_CURRENT_HEAD=" + r["candidate_sha"])
          print("V32_733_LIVE_INPUT_DIGEST=" + r["source_input_digest"])
          print("V32_733_LIVE_SYNC_STATE=" + r["reconciliation"])
          print("V32_733_PROVIDER_UNREPORTED="+json.dumps(historical))
          print("V32_733_DERP_PROGRESS="+json.dumps(progress, sort_keys=True))
          for ref,x in sorted(r["read_views"].items()):
              print(ref+"_SMART_TITLE="+x["title"]+";MANAGED_BLOCK="+x["managed_block"])
              print(ref+"_EXPECTED_TITLE="+x["expected"])
          print("V32_733_RENDERED_MANAGED_BLOCKS_JSON="+json.dumps(
              r["expected_managed_blocks"], ensure_ascii=False, sort_keys=True))
          PY

  golden-oracle-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Oracle PRECOMMIT precedes implementation
        run: |
          git cat-file -e 80a9c03d8f33ace129d21cb868c93e9359a8868a^{commit}
          git cat-file -e 6a61041f1aadaf9fb4975b225f4ca48e379f508f^{commit}
          git merge-base --is-ancestor 80a9c03d8f33ace129d21cb868c93e9359a8868a 6a61041f1aadaf9fb4975b225f4ca48e379f508f
          echo 'PRECOMMITTED_ORACLE_ORDER=PASS'
      - name: Run ten named golden preflight tests on REAL V3.2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m unittest discover -s .github/v32-evidence-spine -p 'test_vertical_cycle_preflight_v32.py' -v 2>&1 | tee artifacts/test-discovery.log
          python - <<'PY'
          from pathlib import Path
          raw = Path("artifacts/test-discovery.log").read_text()
          names = [f"test_{n:02d}_" for n in range(1, 11)]
          missing = [name for name in names if name not in raw]
          if missing or "Ran 10 tests" not in raw or "OK" not in raw:
              raise SystemExit(f"NAMED_CASES_NOT_EXECUTED: {missing}")
          print("V32_718_NAMED_TEST_EXECUTION=10")
          PY
      - name: Run golden preflight and deliberate full-chain RED
        shell: bash
        run: |
          set -euo pipefail
          python .github/v32-evidence-spine/vertical_cycle_preflight_v32.py \
            --mode preflight --report artifacts/v32-718-preflight.json > artifacts/preflight.log
          set +e
          python .github/v32-evidence-spine/vertical_cycle_preflight_v32.py \
            --mode full --report artifacts/v32-718-full-expected-red.json > artifacts/full.log
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "MISSING_EXPECTED_RED: $rc"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("artifacts/v32-718-preflight.json").read_text())
          b=json.loads(Path("artifacts/v32-718-full-expected-red.json").read_text())
          assert a["exit_code"] == 0 and len(a["negative_mutations"]) == 9
          assert a["consumer_results"]["AGENT_MATRIX"] == "NOT_IMPLEMENTED"
          assert b["exit_code"] == 2
          assert b["full_integrated_gate"] == "FAIL_CLOSED_UNIMPLEMENTED_CONSUMERS"
          print("V32_718_READ_ONLY_GOLDEN_PREFLIGHT=PASS")
          print("V32_718_FULL_INTEGRATION=EXPECTED_RED_NOT_IMPLEMENTED")
          print("V32_718_INPUT_DIGEST="+a["fixture_manifest_digest"])
          PY
      - name: S5-D1 independent read-only audit controls and oracle chronology
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 13437eca8483f04ad97d7611c95f0af65a13ac1b 95959bdbec6ae71058f5b56c79a9d6f5376726ad
          git merge-base --is-ancestor 5a42ecee3577d1f8f91b9610a47a2d73e5673d3 4756fa2880460738c9dad4e9f15b088edf7e49eb
          git merge-base --is-ancestor c2cbcbc5a7f2b532dd0b57e3df80e2c034884fda 1666d3bc75f2d213a81c1a8f06c4daaac1de2f59
          git merge-base --is-ancestor a56b6e115abce229e658850903aabdc9d0083bff ac0f4ddbcc51dda4fb770f7b32e211c15f31d5cb
          git merge-base --is-ancestor 75b7fa9dde73c88a53595112b4969c042cf54336 576a23058dbc831603bc31152b40b249ff0f038e
          git merge-base --is-ancestor 9bac69365732cbe2c5591bafbcd88d7e7b558603 3ed5a372d494ebcc4129de9181c73a374cdfbe2b
          python -m unittest discover -s .github/v32-evidence-spine -p 'test_760_readonly_audit_v32.py' -v 2>&1 | tee artifacts/v32-760-audit-tests.log
          python - <<'PY'
          from pathlib import Path
          log=Path('artifacts/v32-760-audit-tests.log').read_text()
          missing=[f'test_{n:02d}_' for n in range(1,25) if f'test_{n:02d}_' not in log]
          if missing or 'Ran 24 tests' not in log or 'OK' not in log:
              raise SystemExit(f'S5_D1_D2_D3_D4_D5_D6_NAMED_AUDIT_CASES_NOT_EXECUTED: {missing}')
          print('V32_760_767_773_776_780_784_READONLY_AUDIT_PRECOMMITTED_TESTS=24_PASS')
          PY
      - name: Retain golden preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v32-718-precommitted-golden-preflight
          path: artifacts/
          retention-days: 30
