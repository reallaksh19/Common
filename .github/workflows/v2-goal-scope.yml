name: V2 Goal Scope Dependency Composition

on:
  pull_request:
    paths:
      - "Grade 9/V2/GoalScope/**"
      - ".github/workflows/v2-goal-scope.yml"
  workflow_dispatch:

jobs:
  goal-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate V2-03 schemas
        run: python "Grade 9/V2/GoalScope/contracts/validate_contracts.py"
      - name: Run scope and dependency falsifiers
        run: python -m unittest discover -s "Grade 9/V2/GoalScope/tests" -p "test_*.py" -v
