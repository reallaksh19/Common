name: V2 Chemistry Core1A Core2A Foundation

on:
  pull_request:
    paths:
      - 'Grade 9/V2/Chemistry/Core1A/**'
      - 'Grade 9/V2/Chemistry/Core2A/**'
      - 'Grade 9/V2/Chemistry/LearnerProduct/**'
      - 'Grade 9/V2/Chemistry/ProductionKit/**'
      - 'Grade 9/V2/Chemistry/ColdStart/**'
      - 'Grade 9/V2/Chemistry/LearnerStudy/**'
      - 'Grade 9/V2/Chemistry/CoreAuthoring/**'
      - 'Grade 9/V2/Chemistry/Representation/**'
      - 'Grade 9/V2/Chemistry/Core2Transfer/**'
      - 'Grade 9/V2/Chemistry/ReasoningSemantics/**'
      - 'Grade 9/V2/Chemistry/ExactProduct/**'
      - '.github/workflows/v2-chemistry-learner-product.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chemistry-learner-product-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install learner-product contract and PDF QA dependencies
        run: python -m pip install 'jsonschema>=4.20,<5' 'reportlab>=4,<5' 'pypdf>=5,<7' 'pymupdf>=1.24,<2'

      - name: Run Chemistry learner-product contract render and golden tests
        run: >-
          python -m unittest discover
          -s 'Grade 9/V2/Chemistry/LearnerProduct/tests'
          -p 'test_*.py' -v

      - name: Run Chemistry Core1A bucket synthesis integration tests
        run: >-
          python -m unittest discover
          -s 'Grade 9/V2/Chemistry/Core1A/tests'
          -p 'test_*.py' -v

      - name: Run Chemistry Core2A source and generated challenge integration tests
        run: >-
          python -m unittest discover
          -s 'Grade 9/V2/Chemistry/Core2A/tests'
          -p 'test_*.py' -v

      - name: Run Chemistry Core1/Core2/Core1A/Core2A production kit goldens and falsifiers
        run: >-
          python -m unittest discover
          -s 'Grade 9/V2/Chemistry/ProductionKit/tests'
          -p 'test_*.py' -v

      - name: Validate learner-product and production-kit policy/registry JSON
        run: |
          for f in \
            'Grade 9/V2/Chemistry/LearnerProduct/policies/'*.json \
            'Grade 9/V2/Chemistry/LearnerProduct/registry/'*.json \
            'Grade 9/V2/Chemistry/Core1A/policies/'*.json \
            'Grade 9/V2/Chemistry/Core2A/policies/'*.json \
            'Grade 9/V2/Chemistry/ProductionKit/registry/'*.json \
            'Grade 9/V2/Chemistry/ProductionKit/golden/'*.json; do
            python -m json.tool "$f" > /dev/null
          done
          python -m json.tool 'Grade 9/V2/Chemistry/LearnerProduct/production/redox/redox-ncert-authority.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Chemistry/LearnerProduct/production/redox/redox-production-profile.json' > /dev/null

      - name: Validate learner-product, Core1A, Core2A and production-kit schemas are parseable
        run: |
          for f in \
            'Grade 9/V2/Chemistry/LearnerProduct/contracts/'*.json \
            'Grade 9/V2/Chemistry/Core1A/contracts/'*.json \
            'Grade 9/V2/Chemistry/Core2A/contracts/'*.json \
            'Grade 9/V2/Chemistry/ProductionKit/contracts/'*.json; do
            python -m json.tool "$f" > /dev/null
          done

      - name: Confirm canonical execution contract exists
        run: test -s 'Grade 9/V2/Chemistry/LearnerProduct/EXECUTION_CONTRACT.md'

      - name: Build rendered learner-product process golden
        run: >-
          python 'Grade 9/V2/Chemistry/LearnerProduct/golden/some-basic-concepts/build_render_golden.py'
          --out-dir /tmp/chemistry-lp-render-golden

      - name: Upload rendered process golden for human actual-size review
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-core1a-core2a-render-process-golden
          path: /tmp/chemistry-lp-render-golden
          if-no-files-found: error
          retention-days: 14

      - name: Build real Redox NCERT production inputs
        run: >-
          python 'Grade 9/V2/Chemistry/LearnerProduct/production/redox/build_redox_production_inputs.py'
          --out-dir /tmp/chemistry-redox-inputs

      - name: Execute 11-item Redox NCERT production through C-LP-25
        run: >-
          python 'Grade 9/V2/Chemistry/LearnerProduct/engine/run_chemistry_ncert_production.py'
          --run-manifest /tmp/chemistry-redox-inputs/redox_run_manifest.json
          --study-model /tmp/chemistry-redox-inputs/redox_study_model.json
          --core1-plan /tmp/chemistry-redox-inputs/redox_core1_plan.json
          --representation-bundle /tmp/chemistry-redox-inputs/redox_representation_bundle.json
          --core2-plan /tmp/chemistry-redox-inputs/redox_core2_plan.json
          --coverage-closure /tmp/chemistry-redox-inputs/redox_coverage_closure.json
          --out-dir /tmp/chemistry-redox-production

      - name: Upload Redox NCERT production candidate for human review
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-redox-ncert-production-candidate
          path: |
            /tmp/chemistry-redox-inputs
            /tmp/chemistry-redox-production
          if-no-files-found: error
          retention-days: 14
