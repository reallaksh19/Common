name: V2 Physics Assessment Intake P-A
on:
  pull_request:
    paths:
      - 'Grade 9/V2/Physics/AssessmentIntake/**'
      - '.github/workflows/v2-physics-assessment-intake.yml'
jobs:
  physics-assessment-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.20,<5'
      - name: Validate P-A contracts and fixtures
        run: python 'Grade 9/V2/Physics/AssessmentIntake/contracts/validate_contracts.py'
      - name: Run P-A source/representation-fidelity falsifiers
        run: python 'Grade 9/V2/Physics/AssessmentIntake/tests/test_physics_assessment_intake.py'
      - name: Deterministic intake replay
        run: |
          D='Grade 9/V2/Physics/AssessmentIntake'
          python "$D/engine/build_physics_assessment_intake.py" --questions "$D/fixtures/motion-question-set.fixture.json" --topic-scope "$D/fixtures/motion-topic-scope.fixture.json" --attempts "$D/fixtures/motion-attempt-set.fixture.json" --out /tmp/a.json --intake-id DET
          python "$D/engine/build_physics_assessment_intake.py" --questions "$D/fixtures/motion-question-set.fixture.json" --topic-scope "$D/fixtures/motion-topic-scope.fixture.json" --attempts "$D/fixtures/motion-attempt-set.fixture.json" --out /tmp/b.json --intake-id DET
          cmp /tmp/a.json /tmp/b.json
      - name: Prove AttemptSet is optional
        run: |
          D='Grade 9/V2/Physics/AssessmentIntake'
          python "$D/engine/build_physics_assessment_intake.py" --questions "$D/fixtures/motion-question-set.fixture.json" --topic-scope "$D/fixtures/motion-topic-scope.fixture.json" --out /tmp/no-attempt.json --intake-id NO-ATTEMPT
          grep -q '"attempt_mode": "ABSENT"' /tmp/no-attempt.json
