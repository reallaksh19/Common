name: V2 Mathematics Assessment Review M-B
on:
  pull_request:
    paths:
      - 'Grade 9/V2/Mathematics/AssessmentReview/**'
      - 'Grade 9/V2/Mathematics/AssessmentIntake/**'
      - '.github/workflows/v2-math-assessment-review.yml'

jobs:
  math-assessment-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.20,<5'
      - name: Validate MATH M-B contracts
        run: python 'Grade 9/V2/Mathematics/AssessmentReview/contracts/validate_contracts.py'
      - name: Run MATH M-B assessment-safety falsifiers
        run: python 'Grade 9/V2/Mathematics/AssessmentReview/tests/test_math_assessment_review.py'
      - name: Deterministic assessment-review replay
        run: |
          D='Grade 9/V2/Mathematics/AssessmentReview'
          Q='Grade 9/V2/Mathematics/AssessmentIntake/fixtures/mixed-grade9-question-set.fixture.json'
          python "$D/engine/review_math_assessment.py" --questions "$Q" --registry "$D/registry/assessment-item-validity-registry.json" --policy "$D/policies/diagnostic-use-policy.json" --out /tmp/a.json
          python "$D/engine/review_math_assessment.py" --questions "$Q" --registry "$D/registry/assessment-item-validity-registry.json" --policy "$D/policies/diagnostic-use-policy.json" --out /tmp/b.json
          cmp /tmp/a.json /tmp/b.json
      - name: Prove assessment-safety pilot states
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/a.json'))
          r={i['item_ref']:i for i in x['item_reviews']}
          assert r['Q9']['validity_state']=='UNDERDETERMINED'
          assert r['Q9']['diagnostic_constraints']['negative_inference_allowed'] is False
          assert r['Q12']['validity_state']=='VALID_MULTIPLE_SOLUTIONS'
          assert len(r['Q12']['canonical_answer']['accepted_answers'])==2
          assert x['attempt_data_consumed'] is False
          assert x['review_precedes_attempt_interpretation'] is True
          print('MATH M-B assessment safety gate PASS')
          PY
