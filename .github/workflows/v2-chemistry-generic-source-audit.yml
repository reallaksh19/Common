name: V2 Chemistry Generic Source Audit + Workbench v2

on:
  pull_request:
    paths:
      - 'Grade 9/V2/Chemistry/LearningBlueprint/contracts/chemistry-gate-source-audit.schema.json'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/contracts/chemistry-engineering-*.schema.json'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/contracts/chemistry-product-*.schema.json'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/engine/validate_chemistry_gate_source_audit.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/engine/validate_chemistry_engineering_registry_runtime.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/engine/compile_chemistry_engineering_*.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/engine/compile_chemistry_product_*.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/engine/validate_product_source_scope.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/engine/validate_cdau_engineering_ready.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/engine/validate_pal_engineering_ready.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/source_audits/**'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/stress_tests/**'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/tests/test_chemistry_gate_source_audit_generic.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/tests/test_chemistry_engineering_workbench_v2.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/tests/test_redox_production_source_audit_v2.py'
      - '.github/workflows/v2-chemistry-generic-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generic-source-audit-workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install 'jsonschema>=4.20,<5'

      - name: Validate contract and audit JSON
        run: |
          python -m json.tool 'Grade 9/V2/Chemistry/LearningBlueprint/contracts/chemistry-gate-source-audit.schema.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Chemistry/LearningBlueprint/contracts/chemistry-engineering-request.schema.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Chemistry/LearningBlueprint/contracts/chemistry-engineering-topic-manifest.schema.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Chemistry/LearningBlueprint/contracts/chemistry-engineering-closure-receipt.schema.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Chemistry/LearningBlueprint/contracts/chemistry-engineering-authorization-binding.schema.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Chemistry/LearningBlueprint/contracts/chemistry-engineering-passport.schema.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Chemistry/LearningBlueprint/contracts/chemistry-engineering-research-dossier.schema.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Chemistry/LearningBlueprint/contracts/chemistry-engineering-claim-ledger.schema.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Chemistry/LearningBlueprint/contracts/chemistry-product-source-scope-v1.schema.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Chemistry/LearningBlueprint/contracts/chemistry-product-engineering-custody-v1.schema.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Chemistry/LearningBlueprint/stress_tests/redox/source-audit.v2.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Chemistry/LearningBlueprint/source_audits/redox/production-source-audit.v2.json' > /dev/null

      - name: Run gate-generic source-audit falsifiers
        run: python -m unittest 'Grade 9/V2/Chemistry/LearningBlueprint/tests/test_chemistry_gate_source_audit_generic.py' -v

      - name: Run Workbench v2 closure, source-authority, custody and PAL falsifiers
        run: python -m unittest 'Grade 9/V2/Chemistry/LearningBlueprint/tests/test_chemistry_engineering_workbench_v2.py' -v

      - name: Validate Redox production source audit and current Core1A scope
        run: python -m unittest 'Grade 9/V2/Chemistry/LearningBlueprint/tests/test_redox_production_source_audit_v2.py' -v

      - name: Re-run complete engineering-gate registry falsifiers
        run: python 'Grade 9/V2/Chemistry/LearningBlueprint/tests/test_chemistry_engineering_gates.py'
