name: v35-wp1-u4-conformance
on:
  push:
    branches:
      - feat/v35-r14-wp1-u4-cross-language-conformance-20261009
  pull_request:
    paths:
      - skills/engineering-relay-v1/lifecycle-v35/**
      - skills/engineering-relay-v1/schemas/lifecycle-v35/**
      - .github/workflows/v35-wp1-u4-conformance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bound-cross-runtime:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Exact checked out source and runtimes
        shell: bash
        run: |
          git rev-parse HEAD
          python --version
          node --version
      - name: Install source validation dependencies
        run: python -m pip install 'jsonschema==4.26.0' PyYAML
      - name: Python U1 through U3 exact native contracts
        run: python -m unittest discover -s skills/engineering-relay-v1/lifecycle-v35 -p 'test_*contract_v1.py' -v
      - name: Python to Node U4 conformance plus real Common DELP facts
        run: python -m unittest discover -s skills/engineering-relay-v1/lifecycle-v35 -p 'test_*conformance_v1.py' -v
      - name: Node U4 self-contained negative controls
        run: node --test skills/engineering-relay-v1/lifecycle-v35/lifecycle-conformance-v1.test.mjs
