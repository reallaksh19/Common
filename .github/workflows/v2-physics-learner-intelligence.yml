name: V2 Physics Learner Intelligence

on:
  pull_request:
    paths:
      - "Grade 9/V2/Physics/LearnerIntelligence/**"
      - "Grade 9/V2/Physics/Canonical/**"
      - ".github/workflows/v2-physics-learner-intelligence.yml"
  workflow_dispatch:

jobs:
  physics-learner-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install "jsonschema>=4.20,<5"
      - name: Validate learner-intelligence contracts and reference state
        run: python "Grade 9/V2/Physics/LearnerIntelligence/contracts/validate_contracts.py"
      - name: Run PHY-V2-02 learner-state falsifiers
        run: python "Grade 9/V2/Physics/LearnerIntelligence/tests/test_physics_learner_state.py"
      - name: Derive exact synthetic learner state twice
        run: |
          L="Grade 9/V2/Physics/LearnerIntelligence"
          python "$L/engine/derive_physics_state.py" --evidence "$L/fixtures/evidence.synthetic.json" --policy "$L/fixtures/inference_policy.synthetic.json" --interface "$L/fixtures/learner_intelligence_interface.synthetic.json" --out /tmp/physics-state-a.json
          python "$L/engine/derive_physics_state.py" --evidence "$L/fixtures/evidence.synthetic.json" --policy "$L/fixtures/inference_policy.synthetic.json" --interface "$L/fixtures/learner_intelligence_interface.synthetic.json" --out /tmp/physics-state-b.json
          cmp /tmp/physics-state-a.json /tmp/physics-state-b.json
      - name: Prove expected capability localization
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/physics-state-a.json')); b={x['capability_ref']:x for x in r['capability_states']}
          assert b['PHY-PROJECTILE-COMPONENT-DECOMPOSITION']['state']=='READY'
          assert b['PHY-MODEL-SELECTION']['state']=='READY'
          assert b['PHY-MOTION-PROPAGATE-STATE']['state']=='REPAIR_REQUIRED'
          assert b['PHY-SIGNED-DISPLACEMENT-INTERPRETATION']['probe_refs']==['PHY-PROBE-SIGNED-DISPLACEMENT']
          assert 'PHY-PROBE-APEX-COMPONENTS' in b['PHY-PROJECTILE-COMPONENT-DECOMPOSITION']['probe_refs']
          assert r['external_dependency_observations'][0]['dependency_ref']=='SHARED-ARITHMETIC-EXECUTION'
          print('PHY-V2-02 capability localization = PASS')
          PY
      - name: Upload synthetic learner-state proof
        uses: actions/upload-artifact@v4
        with:
          name: physics-v2-02-learner-state-proof
          path: /tmp/physics-state-a.json
          if-no-files-found: error
