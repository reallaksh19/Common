name: V2 Physics Learner Study P-F

on:
  push:
    paths:
      - "Grade 9/V2/Physics/AssessmentIntake/**"
      - "Grade 9/V2/Physics/AssessmentReview/**"
      - "Grade 9/V2/Physics/AssessmentScope/**"
      - "Grade 9/V2/Physics/ProblemSemantics/**"
      - "Grade 9/V2/Physics/LearnerEvidence/**"
      - "Grade 9/V2/Physics/StudySynthesis/**"
      - "Grade 9/V2/Physics/Canonical/**"
      - "Grade 9/V2/Shared/LearnerIntelligence/contracts/**"
      - ".github/workflows/v2-physics-study-synthesis.yml"
  pull_request:
    paths:
      - "Grade 9/V2/Physics/AssessmentIntake/**"
      - "Grade 9/V2/Physics/AssessmentReview/**"
      - "Grade 9/V2/Physics/AssessmentScope/**"
      - "Grade 9/V2/Physics/ProblemSemantics/**"
      - "Grade 9/V2/Physics/LearnerEvidence/**"
      - "Grade 9/V2/Physics/StudySynthesis/**"
      - "Grade 9/V2/Physics/Canonical/**"
      - "Grade 9/V2/Shared/LearnerIntelligence/contracts/**"
      - ".github/workflows/v2-physics-study-synthesis.yml"
  workflow_dispatch:

jobs:
  physics-learner-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: python -m pip install "jsonschema>=4.20,<5"
      - name: Re-prove P-A assessment intake
        run: |
          python "Grade 9/V2/Physics/AssessmentIntake/contracts/validate_contracts.py"
          python "Grade 9/V2/Physics/AssessmentIntake/tests/test_physics_assessment_intake.py"
      - name: Re-prove P-B assessment review
        run: |
          python "Grade 9/V2/Physics/AssessmentReview/contracts/validate_contracts.py"
          python "Grade 9/V2/Physics/AssessmentReview/tests/test_physics_assessment_review.py"
      - name: Re-prove P-C assessment scope
        run: |
          python "Grade 9/V2/Physics/AssessmentScope/contracts/validate_contracts.py"
          python "Grade 9/V2/Physics/AssessmentScope/tests/test_physics_scope_reconciliation.py"
      - name: Re-prove P-D problem semantics
        run: |
          python "Grade 9/V2/Physics/ProblemSemantics/contracts/validate_contracts.py"
          python "Grade 9/V2/Physics/ProblemSemantics/tests/test_physics_problem_semantics.py"
      - name: Re-prove P-E learner evidence
        run: |
          python "Grade 9/V2/Physics/LearnerEvidence/contracts/validate_contracts.py"
          python "Grade 9/V2/Physics/LearnerEvidence/tests/test_physics_learner_evidence.py"
      - name: Validate P-F contracts and reference synthesis
        run: python "Grade 9/V2/Physics/StudySynthesis/contracts/validate_contracts.py"
      - name: Run P-F scope, treatment and longitudinal falsifiers
        run: python "Grade 9/V2/Physics/StudySynthesis/tests/test_physics_learner_study.py"
      - name: Generate no-attempt and attempt-present P-F proof twice
        run: |
          P="Grade 9/V2/Physics"
          PD="$P/ProblemSemantics"
          PE="$P/LearnerEvidence"
          PF="$P/StudySynthesis"
          python "$PD/engine/build_physics_problem_semantics.py" \
            --questions "$P/AssessmentIntake/fixtures/motion-question-set.fixture.json" \
            --topic-scope "$P/AssessmentIntake/fixtures/motion-topic-scope.fixture.json" \
            --review-registry "$P/AssessmentReview/registry/physics-item-validity-registry.json" \
            --review-policy "$P/AssessmentReview/policies/diagnostic-use-policy.json" \
            --canonical-capabilities "$P/Canonical/registry/capabilities.json" \
            --scope-authority "$P/AssessmentScope/authority/physics-assessment-scope-authority.json" \
            --scope-bindings "$P/AssessmentScope/registry/motion-question-scope-bindings.json" \
            --role-registry "$PD/registry/physics-reasoning-role-registry.json" \
            --family-registry "$PD/registry/physics-problem-family-registry.json" \
            --verification-registry "$PD/registry/physics-verification-route-registry.json" \
            --item-registry "$PD/registry/motion-item-semantics.json" \
            --badge-policy "$PD/registry/guide-demand-badge-policy.json" \
            --out /tmp/phy-pd.json
          python "$PE/engine/infer_physics_learner_evidence.py" \
            --problem-semantics /tmp/phy-pd.json \
            --questions "$P/AssessmentIntake/fixtures/motion-question-set.fixture.json" \
            --observation-registry "$PE/registry/physics-observation-code-registry.json" \
            --diagnostic-policy "$PE/registry/physics-diagnostic-policy.json" \
            --out /tmp/phy-pe-no-attempt.json
          python "$PE/engine/infer_physics_learner_evidence.py" \
            --problem-semantics /tmp/phy-pd.json \
            --questions "$P/AssessmentIntake/fixtures/motion-question-set.fixture.json" \
            --observation-registry "$PE/registry/physics-observation-code-registry.json" \
            --diagnostic-policy "$PE/registry/physics-diagnostic-policy.json" \
            --attempts "$P/AssessmentIntake/fixtures/motion-attempt-set.fixture.json" \
            --evidence "$PE/fixtures/physics-learner-evidence-ledger.fixture.json" \
            --out /tmp/phy-pe-attempt.json
          python "$PF/engine/build_physics_learner_study_model.py" \
            --scope-bindings "$P/AssessmentScope/registry/motion-question-scope-bindings.json" \
            --scope-authority "$P/AssessmentScope/authority/physics-assessment-scope-authority.json" \
            --problem-semantics /tmp/phy-pd.json \
            --learner-snapshot /tmp/phy-pe-no-attempt.json \
            --treatment-policy "$PF/policies/physics-treatment-policy.json" \
            --scope-out /tmp/phy-pf-scope-no-attempt.json \
            --model-out /tmp/phy-pf-model-no-attempt.json
          python "$PF/engine/build_physics_learner_study_model.py" \
            --scope-bindings "$P/AssessmentScope/registry/motion-question-scope-bindings.json" \
            --scope-authority "$P/AssessmentScope/authority/physics-assessment-scope-authority.json" \
            --problem-semantics /tmp/phy-pd.json \
            --learner-snapshot /tmp/phy-pe-attempt.json \
            --treatment-policy "$PF/policies/physics-treatment-policy.json" \
            --scope-out /tmp/phy-pf-scope-attempt-a.json \
            --model-out /tmp/phy-pf-model-attempt-a.json
          python "$PF/engine/build_physics_learner_study_model.py" \
            --scope-bindings "$P/AssessmentScope/registry/motion-question-scope-bindings.json" \
            --scope-authority "$P/AssessmentScope/authority/physics-assessment-scope-authority.json" \
            --problem-semantics /tmp/phy-pd.json \
            --learner-snapshot /tmp/phy-pe-attempt.json \
            --treatment-policy "$PF/policies/physics-treatment-policy.json" \
            --scope-out /tmp/phy-pf-scope-attempt-b.json \
            --model-out /tmp/phy-pf-model-attempt-b.json
          cmp /tmp/phy-pf-scope-no-attempt.json /tmp/phy-pf-scope-attempt-a.json
          cmp /tmp/phy-pf-scope-attempt-a.json /tmp/phy-pf-scope-attempt-b.json
          cmp /tmp/phy-pf-model-attempt-a.json /tmp/phy-pf-model-attempt-b.json
      - name: Upload P-F proof
        uses: actions/upload-artifact@v4
        with:
          name: physics-p-f-learner-study-proof
          path: |
            /tmp/phy-pf-scope-no-attempt.json
            /tmp/phy-pf-model-no-attempt.json
            /tmp/phy-pf-scope-attempt-a.json
            /tmp/phy-pf-model-attempt-a.json
          if-no-files-found: error
