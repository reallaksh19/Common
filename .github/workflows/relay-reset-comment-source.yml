name: relay-reset-comment-source
on:
  pull_request:
    paths:
      - 'skills/engineering-relay-v1/github-comment-source-v1.*'
      - '.github/workflows/relay-reset-comment-source.yml'
permissions:
  contents: read
jobs:
  source-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test skills/engineering-relay-v1/github-comment-source-v1.test.mjs