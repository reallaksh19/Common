# retry after payload integrity repair; unpack without CI workflow because Actions token lacks workflows permission
name: Bootstrap Physics P-D payload
on:
  push:
    branches:
      - v2/physics-p-d-problem-semantics-20260911
permissions:
  contents: write
jobs:
  unpack:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and unpack P-D payload
        run: |
          cat .pd_payload.part0 .pd_payload.part1 .pd_payload.part2 .pd_payload.part3 | base64 -d > /tmp/pd_payload.tar.gz
          tar -tzf /tmp/pd_payload.tar.gz >/dev/null
          tar -xzf /tmp/pd_payload.tar.gz -C .
          rm -f .github/workflows/v2-physics-problem-semantics.yml
          rm -f .pd_payload.part0 .pd_payload.part1 .pd_payload.part2 .pd_payload.part3 .github/workflows/bootstrap-physics-pd.yml
      - name: Commit unpacked implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'PHY P-D: problem-family, reasoning-route, model-validity and demand semantics'
          git push origin HEAD:${GITHUB_REF_NAME}
