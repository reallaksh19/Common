name: V2 Mathematics Study Synthesis M-F
on:
  pull_request:
    paths:
      - 'Grade 9/V2/Mathematics/StudySynthesis/**'
      - 'Grade 9/V2/Mathematics/AssessmentIntake/**'
      - 'Grade 9/V2/Mathematics/AssessmentReview/**'
      - 'Grade 9/V2/Mathematics/AssessmentScope/**'
      - 'Grade 9/V2/Mathematics/ProblemSemantics/**'
      - 'Grade 9/V2/Mathematics/LearnerIntelligence/**'
      - '.github/workflows/v2-math-study-synthesis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math-study-synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.20,<5'
      - name: Validate M-F contracts against merged Mathematics authorities
        run: python 'Grade 9/V2/Mathematics/StudySynthesis/contracts/validate_contracts.py'
      - name: Run M-F Study Synthesis falsifiers
        run: python 'Grade 9/V2/Mathematics/StudySynthesis/tests/test_math_study_synthesis.py'
      - name: End-to-end deterministic M-E to M-F replay
        run: |
          M='Grade 9/V2/Mathematics'
          ME="$M/LearnerIntelligence"
          MF="$M/StudySynthesis"
          derive_present() {
            python "$ME/engine/derive_math_learner_state.py" \
              --questions "$M/AssessmentIntake/fixtures/mixed-grade9-question-set.fixture.json" \
              --reviews "$M/AssessmentReview/registry/assessment-item-validity-registry.json" \
              --authority "$M/AssessmentScope/authority/math-assessment-scope-authority.json" \
              --item-semantics "$M/ProblemSemantics/registry/mixed-grade9-item-semantics.json" \
              --observation-registry "$ME/registry/math-observation-type-registry.json" \
              --attempts "$M/AssessmentIntake/fixtures/mixed-grade9-attempt-set.fixture.json" \
              --reviewed-observations "$ME/fixtures/reviewed-observations.fixture.json" \
              --out "$1"
          }
          derive_present /tmp/me-a.json
          derive_present /tmp/me-b.json
          python - <<'PY'
          import json
          for src,dst in [('/tmp/me-a.json','/tmp/state-a.json'),('/tmp/me-b.json','/tmp/state-b.json')]:
              json.dump(json.load(open(src))['learner_state_snapshot'],open(dst,'w'),sort_keys=True)
          PY
          synthesize() {
            python "$MF/engine/synthesize_math_study_model.py" \
              --scope-bindings "$M/AssessmentScope/registry/mixed-grade9-question-scope-bindings.json" \
              --authority "$M/AssessmentScope/authority/math-assessment-scope-authority.json" \
              --learner-state "$1" \
              --policy "$MF/policies/math-treatment-policy.json" \
              --out "$2"
          }
          synthesize /tmp/state-a.json /tmp/mf-a.json
          synthesize /tmp/state-b.json /tmp/mf-b.json
          cmp /tmp/mf-a.json /tmp/mf-b.json
      - name: Prove no-attempt keeps the same StudyScope and forces no repair
        run: |
          M='Grade 9/V2/Mathematics'
          ME="$M/LearnerIntelligence"
          MF="$M/StudySynthesis"
          python "$ME/engine/derive_math_learner_state.py" \
            --questions "$M/AssessmentIntake/fixtures/mixed-grade9-question-set.fixture.json" \
            --reviews "$M/AssessmentReview/registry/assessment-item-validity-registry.json" \
            --authority "$M/AssessmentScope/authority/math-assessment-scope-authority.json" \
            --item-semantics "$M/ProblemSemantics/registry/mixed-grade9-item-semantics.json" \
            --observation-registry "$ME/registry/math-observation-type-registry.json" \
            --out /tmp/me-none.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/me-none.json'))['learner_state_snapshot']
          json.dump(x,open('/tmp/state-none.json','w'),sort_keys=True)
          PY
          python "$MF/engine/synthesize_math_study_model.py" \
            --scope-bindings "$M/AssessmentScope/registry/mixed-grade9-question-scope-bindings.json" \
            --authority "$M/AssessmentScope/authority/math-assessment-scope-authority.json" \
            --learner-state /tmp/state-none.json \
            --policy "$MF/policies/math-treatment-policy.json" \
            --out /tmp/mf-none.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/mf-a.json'))
          n=json.load(open('/tmp/mf-none.json'))
          assert p['learner_study_scope']['scope_digest']==n['learner_study_scope']['scope_digest']
          assert all(x['treatment']=='ACTIVE_STUDY' for x in n['learner_study_model']['capability_plans'])
          print('MATH M-F scope invariance + NO_ATTEMPT != REPAIR PASS')
          PY
