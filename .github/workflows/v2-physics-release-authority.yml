name: V2 Physics P-L Release Authority

on:
  pull_request:
    paths:
      - "Grade 9/V2/Physics/V2_GENERATION_ENTRYPOINT.md"
      - "Grade 9/V2/Physics/ExactProduct/**"
      - "Grade 9/V2/Shared/HumanReview/**"
      - ".github/workflows/v2-physics-release-authority.yml"
  workflow_dispatch:

jobs:
  release-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install "jsonschema>=4.20,<5" reportlab
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Validate P-L release authority manifest
        run: python "Grade 9/V2/Physics/ExactProduct/tests/test_release_authority_manifest.py"
      - name: Validate Shared HumanReview regression
        run: python "Grade 9/V2/Shared/HumanReview/tests/test_human_review_intake.py"
      - name: Validate Physics four-gate intake
        run: python "Grade 9/V2/Physics/ExactProduct/tests/test_physics_human_review_intake.py"
      - name: Validate governed release and reference guard
        run: python "Grade 9/V2/Physics/ExactProduct/tests/test_physics_governed_release.py"
