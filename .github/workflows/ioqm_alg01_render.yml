name: IOQM ALG01 static render
on:
  push:
    branches: [ioqm-g9-alg01-transformations]
permissions:
  contents: write
jobs:
  render:
    if: ${{ !contains(github.event.head_commit.message, '[skip render]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render deterministic PDFs
        run: python 'Grade 9/Mathematics/IOQM/03_Main_Topics/ALG-01_Identities_Transformations/Authoring/render_static_pdfs.py'
      - name: Commit exact artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Grade 9/Mathematics/IOQM/03_Main_Topics/ALG-01_Identities_Transformations/PDFs/ALG01_Student_Pack_v1.pdf' 'Grade 9/Mathematics/IOQM/03_Main_Topics/ALG-01_Identities_Transformations/PDFs/ALG01_Teacher_Key_v1.pdf'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ALG-01: regenerate exact PDFs [skip render]'
          git push
