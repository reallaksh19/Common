name: V3.2 #718 Golden Precommit / RED First

on:
  pull_request:
    paths:
      - '.github/v32-evidence-spine/**'
      - '.github/workflows/v32-718-golden-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-oracle-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify oracle commit precedes runner code
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          oracle = "80a9c03d8f33ace129d21cb868c93e9359a8868a"
          runner = "6a61041f1aadaf9fb4975b225f4ca48e379f508f"
          subprocess.run(["git", "cat-file", "-e", oracle + "^{commit}"], check=True)
          subprocess.run(["git", "cat-file", "-e", runner + "^{commit}"], check=True)
          subprocess.run(["git", "merge-base", "--is-ancestor", oracle, runner], check=True)
          print("PRECOMMIT_ORACLE_PRECEDES_IMPLEMENTATION: PASS")
          PY

      - name: Execute ten named preflight unit cases against actual V3.2 source
        run: |
          mkdir -p artifacts
          python -m unittest discover -s .github/v32-evidence-spine -p 'test_vertical_cycle_preflight_v32.py' -v \
            2>&1 | tee artifacts/test-discovery.log
          python - <<'PY'
          from pathlib import Path
          raw = Path("artifacts/test-discovery.log").read_text()
          names = [f"test_{n:02d}_" for n in range(1, 11)]
          missing = [name for name in names if name not in raw]
          if missing or "Ran 10 tests" not in raw or "OK" not in raw:
              raise SystemExit(f"NAMED_CASE_EXECUTION_MISSING: {missing}")
          print("ACTUAL_NAMED_TEST_EXECUTION: PASS (10/10)")
          PY

      - name: Replay preflight and retain report with input digests
        run: |
          python .github/v32-evidence-spine/vertical_cycle_preflight_v32.py \
            --mode preflight --report artifacts/v32-718-preflight.json > artifacts/preflight.stdout
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/v32-718-preflight.json").read_text())
          assert r["exit_code"] == 0
          assert r["full_integrated_gate"] == "FAIL_CLOSED_UNIMPLEMENTED_CONSUMERS"
          assert len(r["negative_mutations"]) == 9
          assert r["consumer_results"]["AGENT_MATRIX"] == "NOT_IMPLEMENTED"
          print("READ_ONLY_PREFLIGHT: PASS; FULL_CHAIN: DELIBERATELY_NOT_IMPLEMENTED")
          PY

      - name: Verify full-chain gate is RED (nonzero by design)
        shell: bash
        run: |
          set +e
          python .github/v32-evidence-spine/vertical_cycle_preflight_v32.py \
            --mode full --report artifacts/v32-718-full-expected-red.json > artifacts/full.stdout
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "EXPECTED_FULL_INTEGRATION_RED_MISSING; got rc=$rc"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/v32-718-full-expected-red.json").read_text())
          assert r["full_integrated_gate"] == "FAIL_CLOSED_UNIMPLEMENTED_CONSUMERS"
          assert r["exit_code"] == 2
          print("FULL_CHAIN_EXPECTED_RED: PASS (correctly rejected)")
          PY

      - name: Retain oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v32-718-golden-precommit-evidence
          path: artifacts/
          retention-days: 30
