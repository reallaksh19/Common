name: V2 Physics Core1

on:
  pull_request:
    paths:
      - 'Grade 9/V2/Physics/CoreAuthoring/**'
      - '.github/workflows/v2-physics-core1-production-kit.yml'
  workflow_dispatch:

jobs:
  core1-production-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - name: Validate existing Core1 contracts
        run: python 'Grade 9/V2/Physics/CoreAuthoring/contracts/validate_contracts.py'
      - name: Run existing Core1 semantic tests
        run: python 'Grade 9/V2/Physics/CoreAuthoring/tests/test_physics_core1.py'
      - name: Run Core1 production-kit golden fixtures
        run: python 'Grade 9/V2/Physics/CoreAuthoring/production_kit/run_golden_fixtures.py'
      - name: Run Core1 production-kit tests
        run: python 'Grade 9/V2/Physics/CoreAuthoring/tests/test_physics_core1_production_kit.py'
