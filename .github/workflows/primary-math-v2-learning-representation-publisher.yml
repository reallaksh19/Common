name: Primary Math V2 learning-representation publisher

on:
  push:
    paths:
      - 'Primary/V2/Mathematics/Publication/**'
      - 'Primary/V2/Mathematics/Representation/**'
      - '.github/workflows/primary-math-v2-learning-representation-publisher.yml'
  pull_request:
    paths:
      - 'Primary/V2/Mathematics/Publication/**'
      - 'Primary/V2/Mathematics/Representation/**'
      - '.github/workflows/primary-math-v2-learning-representation-publisher.yml'

jobs:
  representation-publisher-seam:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest reportlab jsonschema
      - name: Run learning-support primitive tests
        run: pytest -q Primary/V2/Mathematics/Representation/tests/test_learning_support_primitives.py
      - name: Run learning-representation adapter tests
        run: pytest -q Primary/V2/Mathematics/Publication/tests/test_learning_representation_adapter.py
      - name: Run measured learning-representation component tests
        run: pytest -q Primary/V2/Mathematics/Publication/tests/test_learning_representation_components.py
      - name: Render Core2 from LearningRepresentationPlan
        run: pytest -q Primary/V2/Mathematics/Publication/tests/test_learning_representation_core2_render.py
      - name: Render Core2 from automatic authoring handoff
        run: pytest -q Primary/V2/Mathematics/Publication/tests/test_authoring_handoff_adapter.py
      - name: Validate Core1 automatic handoff consumption
        run: pytest -q Primary/V2/Mathematics/Publication/tests/test_core1_handoff_adapter.py
      - name: Enforce strict production path and reject legacy text-only hints
        run: pytest -q Primary/V2/Mathematics/Publication/tests/test_production_composer.py
