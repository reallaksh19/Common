name: engineering-pr-delivery-v3.1

on:
  # Required PR checks must always instantiate. Path relevance is decided inside
  # the job so an irrelevant PR still receives a terminal successful check.
  pull_request:
  push:
    branches:
      - 'main'
      - 'v3.1/**'
    paths:
      - 'skills/engineering-pr-delivery-v3.1/**'
      - 'skills/two-pass-prompt-generator/**'
      - 'relay/**'
      - '.github/workflows/engineering-pr-delivery-v3.1.yml'

permissions:
  contents: read

jobs:
  validate-v3-1-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Relay path relevance
        id: relevance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_paths="$RUNNER_TEMP/relay-changed-paths.txt"
          if ! git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Path relevance could not be determined; running full validation." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          relevant=false
          while IFS= read -r path; do
            case "$path" in
              skills/engineering-pr-delivery-v3.1/*|skills/two-pass-prompt-generator/*|relay/*|.github/workflows/engineering-pr-delivery-v3.1.yml)
                relevant=true
                break
                ;;
            esac
          done < "$changed_paths"

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [[ "$relevant" == "false" ]]; then
            echo "Relay scope unchanged; check is NOT_APPLICABLE and terminal." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Relay scope not applicable
        if: steps.relevance.outputs.relevant != 'true'
        run: |
          echo "NOT_APPLICABLE: no engineering-pr-delivery-v3.1 paths changed."

      - name: Set up Python
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Compile V3.1 Python
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m compileall -q skills/engineering-pr-delivery-v3.1/scripts skills/engineering-pr-delivery-v3.1/tests
      - name: Validate standalone two-pass example
        if: steps.relevance.outputs.relevant == 'true'
        run: python skills/two-pass-prompt-generator/validate.py skills/two-pass-prompt-generator/examples/clean-two-pass-packet.md

      - name: Run V3.1 foundation tests
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m unittest discover -s skills/engineering-pr-delivery-v3.1/tests -p 'test*.py' -v

  bootstrap-v3-2-candidate:
    # GitHub may not instantiate a brand-new workflow on a PR until that workflow
    # exists on the base branch. This job supplies exact-head candidate evidence
    # only during that bootstrap window. Once the dedicated V3.2 workflow exists
    # on the PR base, this job becomes terminal NOT_APPLICABLE.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect V3.2 bootstrap need
        id: bootstrap
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_paths="$RUNNER_TEMP/relay-v32-bootstrap-paths.txt"
          git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"

          candidate_changed=false
          while IFS= read -r path; do
            case "$path" in
              skills/engineering-pr-delivery-v3.2/*|.github/workflows/engineering-pr-delivery-v3.2.yml)
                candidate_changed=true
                break
                ;;
            esac
          done < "$changed_paths"

          dedicated_on_base=false
          if git cat-file -e "$BASE_SHA:.github/workflows/engineering-pr-delivery-v3.2.yml" 2>/dev/null; then
            dedicated_on_base=true
          fi

          run_candidate=false
          if [[ "$candidate_changed" == "true" && "$dedicated_on_base" == "false" ]]; then
            run_candidate=true
          fi

          echo "candidate_changed=$candidate_changed" >> "$GITHUB_OUTPUT"
          echo "dedicated_on_base=$dedicated_on_base" >> "$GITHUB_OUTPUT"
          echo "run_candidate=$run_candidate" >> "$GITHUB_OUTPUT"

      - name: V3.2 bootstrap not applicable
        if: steps.bootstrap.outputs.run_candidate != 'true'
        run: echo "NOT_APPLICABLE: dedicated V3.2 workflow is already on the base, or V3.2 candidate paths are unchanged."

      - name: Set up Python
        if: steps.bootstrap.outputs.run_candidate == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schema dependency
        if: steps.bootstrap.outputs.run_candidate == 'true'
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Compile V3.2 Python
        if: steps.bootstrap.outputs.run_candidate == 'true'
        run: python -m compileall -q skills/engineering-pr-delivery-v3.2/scripts skills/engineering-pr-delivery-v3.2/tests

      - name: Validate V3.2 continuity schema syntax
        if: steps.bootstrap.outputs.run_candidate == 'true'
        run: |
          python - <<'PY'
          import pathlib
          import yaml
          path = pathlib.Path('skills/engineering-pr-delivery-v3.2/schemas/responsibility-continuity.schema.yaml')
          document = yaml.safe_load(path.read_text(encoding='utf-8'))
          assert document['$id'] == 'relay-v3.2-responsibility-continuity'
          PY

      - name: Run V3.2 continuity regressions
        if: steps.bootstrap.outputs.run_candidate == 'true'
        run: python -m unittest discover -s skills/engineering-pr-delivery-v3.2/tests -p 'test_continuity_v32*.py' -v

      - name: Run V3.2 audited-reality replay regressions
        if: steps.bootstrap.outputs.run_candidate == 'true'
        run: python -m unittest discover -s skills/engineering-pr-delivery-v3.2/tests -p 'test_replay_cases_v32.py' -v

      - name: Verify V3.1 isolation invariant
        if: steps.bootstrap.outputs.run_candidate == 'true'
        run: python -m unittest discover -s skills/engineering-pr-delivery-v3.2/tests -p 'test_v31_isolation.py' -v
