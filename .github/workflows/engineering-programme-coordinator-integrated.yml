name: engineering-programme-coordinator-integrated

on:
  pull_request:
    paths:
      - 'skills/engineering-programme-coordinator/**'
      - 'skills/Local_PR_Deliverty_v1.1/**'
      - 'skills/engineering-pr-delivery-v3.5/**'
      - '.github/workflows/engineering-programme-coordinator-integrated.yml'
  push:
    branches:
      - 'codex/492-c-*'
      - 'bench/**'
      - 'prod/**'
    paths:
      - 'skills/engineering-programme-coordinator/**'
      - 'skills/Local_PR_Deliverty_v1.1/**'
      - 'skills/engineering-pr-delivery-v3.5/**'
      - '.github/workflows/engineering-programme-coordinator-integrated.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact 40-character commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-local-v11-integrated-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha) }}
          fetch-depth: 1

      - name: Bind exact candidate
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha) }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Validated candidate SHA: $ACTUAL_SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Compile coordinator runtime
        run: |
          python -m py_compile \
            skills/engineering-programme-coordinator/scripts/local_v11_integrated.py \
            skills/engineering-programme-coordinator/scripts/production_readiness.py \
            skills/engineering-programme-coordinator/scripts/execution_kernel.py \
            skills/engineering-programme-coordinator/scripts/proof_obligations.py \
            skills/engineering-programme-coordinator/scripts/evidence_gate.py \
            skills/engineering-programme-coordinator/scripts/validate.py

      - name: Validate coordinator schemas
        run: |
          python - <<'PY'
          import pathlib
          import yaml

          root = pathlib.Path('skills/engineering-programme-coordinator/schemas')

          integrated = yaml.safe_load(
              (root / 'local-v1.1-integrated.schema.yaml').read_text(encoding='utf-8')
          )
          assert integrated['$id'] == 'engineering-programme-coordinator-local-v1.1-integrated'
          assert integrated['properties']['mode']['const'] == 'LOCAL_V1_1_INTEGRATED'
          assert integrated['properties']['authority']['const'] == 'OBSERVATION_ONLY'
          assert integrated['properties']['legacy_v31_interpretation']['const'] == 'READABLE_COMPATIBILITY_ONLY'

          readiness = yaml.safe_load(
              (root / 'production-readiness.schema.yaml').read_text(encoding='utf-8')
          )
          assert readiness['$id'] == 'engineering-programme-coordinator-production-readiness-v1'
          assert readiness['properties']['schema_version']['const'] == 'PRODUCTION_READINESS_V1'
          assert readiness['properties']['authority']['const'] == 'PRODUCTION_READINESS_PROJECTION'

          execution = yaml.safe_load(
              (root / 'execution-state.schema.yaml').read_text(encoding='utf-8')
          )
          assert execution['$id'] == 'engineering-programme-coordinator-execution-state-v1'
          assert execution['properties']['schema_version']['const'] == 'EXECUTION_STATE_V1'
          assert execution['properties']['authority']['const'] == 'CANONICAL_EXECUTION_STATE'

          manifest = yaml.safe_load(
              (root / 'proof-obligation-manifest.schema.yaml').read_text(encoding='utf-8')
          )
          assert manifest['$id'] == 'engineering-programme-coordinator-proof-obligation-manifest-v1'
          assert manifest['properties']['schema_version']['const'] == 'PROOF_OBLIGATION_MANIFEST_V1'
          assert manifest['properties']['authority']['const'] == 'FROZEN_EXPECTATION_MANIFEST'

          ledger = yaml.safe_load(
              (root / 'evidence-ledger.schema.yaml').read_text(encoding='utf-8')
          )
          assert ledger['$id'] == 'engineering-programme-coordinator-evidence-ledger-v1'
          assert ledger['properties']['schema_version']['const'] == 'EVIDENCE_LEDGER_V1'
          assert ledger['properties']['authority']['const'] == 'EXACT_CANDIDATE_EVIDENCE_LEDGER'

          review = yaml.safe_load(
              (root / 'review-context.schema.yaml').read_text(encoding='utf-8')
          )
          assert review['$id'] == 'engineering-programme-coordinator-review-context-v1'
          assert review['properties']['schema_version']['const'] == 'REVIEW_CONTEXT_V1'
          assert review['properties']['authority']['const'] == 'FRESH_REVIEW_CONTEXT'

          gate = yaml.safe_load(
              (root / 'evidence-gate-result.schema.yaml').read_text(encoding='utf-8')
          )
          assert gate['$id'] == 'engineering-programme-coordinator-evidence-gate-result-v1'
          assert gate['properties']['schema_version']['const'] == 'EVIDENCE_GATE_RESULT_V1'
          assert gate['properties']['authority']['const'] == 'DETERMINISTIC_EVIDENCE_GATE'
          assert 'PASS' not in gate['properties']['decision']['enum']
          PY

      - name: Run coordinator regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_*.py' -v

      - name: Verify V3.5 provider is explicit
        run: |
          grep -F 'engineering-pr-delivery-v3.5' skills/engineering-programme-coordinator/references/local-v1.1-v3.5-integrated-mode.md
          grep -F 'READABLE_COMPATIBILITY_ONLY' skills/engineering-programme-coordinator/schemas/local-v1.1-integrated.schema.yaml
