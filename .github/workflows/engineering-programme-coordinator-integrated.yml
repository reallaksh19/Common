name: engineering-programme-coordinator-integrated

on:
  push:
    branches:
      - 'codex/492-c-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-local-v11-integrated-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Compile integrated adapter
        run: python -m py_compile skills/engineering-programme-coordinator/scripts/local_v11_integrated.py
      - name: Validate integrated schema
        run: |
          python - <<'PY'
          import pathlib
          import yaml
          path = pathlib.Path('skills/engineering-programme-coordinator/schemas/local-v1.1-integrated.schema.yaml')
          document = yaml.safe_load(path.read_text(encoding='utf-8'))
          assert document['$id'] == 'engineering-programme-coordinator-local-v1.1-integrated'
          assert document['properties']['mode']['const'] == 'LOCAL_V1_1_INTEGRATED'
          assert document['properties']['authority']['const'] == 'OBSERVATION_ONLY'
          assert document['properties']['legacy_v31_interpretation']['const'] == 'READABLE_COMPATIBILITY_ONLY'
          PY
      - name: Run integrated-mode regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_local_v11_integrated.py' -v
      - name: Verify V3.5 provider is explicit
        run: |
          grep -F 'engineering-pr-delivery-v3.5' skills/engineering-programme-coordinator/references/local-v1.1-v3.5-integrated-mode.md
          grep -F 'READABLE_COMPATIBILITY_ONLY' skills/engineering-programme-coordinator/schemas/local-v1.1-integrated.schema.yaml
