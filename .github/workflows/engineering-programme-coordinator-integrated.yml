name: engineering-programme-coordinator-integrated

on:
  pull_request:
    paths:
      - 'skills/engineering-programme-coordinator/**'
      - 'skills/common-reviewer-protocol-v1.0/**'
      - 'skills/Local_PR_Deliverty_v1.1/**'
      - 'skills/engineering-pr-delivery-v3.5/**'
      - '.github/workflows/engineering-programme-coordinator-integrated.yml'
  push:
    branches:
      - 'codex/492-c-*'
      - 'bench/**'
      - 'prod/**'
    paths:
      - 'skills/engineering-programme-coordinator/**'
      - 'skills/common-reviewer-protocol-v1.0/**'
      - 'skills/Local_PR_Deliverty_v1.1/**'
      - 'skills/engineering-pr-delivery-v3.5/**'
      - '.github/workflows/engineering-programme-coordinator-integrated.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact 40-character commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  validate-local-v11-integrated-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha) }}
          fetch-depth: 1

      - name: Bind exact candidate
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha) }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Validated candidate SHA: $ACTUAL_SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Compile coordinator runtimes
        run: |
          python -m py_compile \
            skills/engineering-programme-coordinator/scripts/local_v11_integrated.py \
            skills/engineering-programme-coordinator/scripts/review_basis.py \
            skills/engineering-programme-coordinator/scripts/production_readiness.py \
            skills/engineering-programme-coordinator/scripts/execution_kernel.py \
            skills/engineering-programme-coordinator/scripts/provider_mutation.py \
            skills/engineering-programme-coordinator/scripts/current_state.py \
            skills/engineering-programme-coordinator/scripts/authority_resolver.py \
            skills/engineering-programme-coordinator/scripts/evidence_freshness.py \
            skills/engineering-programme-coordinator/scripts/phase1_runtime_replay.py \
            skills/engineering-programme-coordinator/scripts/real_artifact_replay.py \
            skills/engineering-programme-coordinator/scripts/l0_task_obligations.py \
            skills/engineering-programme-coordinator/scripts/l1_baseline_obligations.py \
            skills/engineering-programme-coordinator/scripts/l2_diff_impact.py \
            skills/engineering-programme-coordinator/scripts/exact_candidate_evidence.py \
            skills/engineering-programme-coordinator/scripts/validate.py

      - name: Validate coordinator schemas
        run: |
          python - <<'PY'
          import pathlib
          import yaml
          root = pathlib.Path('skills/engineering-programme-coordinator/schemas')

          integrated = yaml.safe_load(
              (root / 'local-v1.1-integrated.schema.yaml').read_text(encoding='utf-8')
          )
          assert integrated['$id'] == 'engineering-programme-coordinator-local-v1.1-integrated'
          assert integrated['properties']['mode']['const'] == 'LOCAL_V1_1_INTEGRATED'
          assert integrated['properties']['authority']['const'] == 'OBSERVATION_ONLY'
          assert integrated['properties']['legacy_v31_interpretation']['const'] == 'READABLE_COMPATIBILITY_ONLY'

          readiness = yaml.safe_load(
              (root / 'production-readiness.schema.yaml').read_text(encoding='utf-8')
          )
          assert readiness['$id'] == 'engineering-programme-coordinator-production-readiness-v1'
          assert readiness['properties']['schema_version']['const'] == 'PRODUCTION_READINESS_V1'
          assert readiness['properties']['authority']['const'] == 'PRODUCTION_READINESS_PROJECTION'
          assert readiness['properties']['production_mode']['enum'] == [
              'OFF', 'SHADOW_ONLY', 'CRITICAL_GATE', 'DEFAULT_GATE'
          ]
          required_basis = set(readiness['properties']['exact_basis']['required'])
          assert 'common_reviewer_ref' in required_basis
          assert 'common_reviewer_digest' in required_basis

          execution = yaml.safe_load(
              (root / 'execution-state.schema.yaml').read_text(encoding='utf-8')
          )
          assert execution['$id'] == 'engineering-programme-coordinator-execution-state-v1'
          assert execution['properties']['schema_version']['const'] == 'EXECUTION_STATE_V1'
          assert execution['properties']['authority']['const'] == 'EXECUTION_STATE_PROJECTION'
          action_enum = execution['properties']['next_action']['properties']['type']['enum']
          assert 'REQUEST_STAGE_ADVANCE' in action_enum
          assert 'ADVANCE_STAGE' not in action_enum

          provider = yaml.safe_load(
              (root / 'provider-mutation.schema.yaml').read_text(encoding='utf-8')
          )
          assert provider['$id'] == 'engineering-programme-coordinator-provider-mutation-v1'
          assert provider['properties']['schema_version']['const'] == 'PROVIDER_MUTATION_V1'
          assert provider['properties']['authority']['const'] == 'PROVIDER_MUTATION_TRANSACTION'

          current = yaml.safe_load(
              (root / 'current-state.schema.yaml').read_text(encoding='utf-8')
          )
          assert current['$id'] == 'engineering-programme-coordinator-current-state-v1'
          assert current['properties']['schema_version']['const'] == 'CURRENT_STATE_V1'
          assert current['properties']['authority']['const'] == 'CURRENT_STATE_PROJECTION'

          authority = yaml.safe_load(
              (root / 'authority-resolution.schema.yaml').read_text(encoding='utf-8')
          )
          assert authority['$id'] == 'engineering-programme-coordinator-authority-resolution-v1'
          assert authority['properties']['schema_version']['const'] == 'AUTHORITY_RESOLUTION_V1'
          assert authority['properties']['authority']['const'] == 'LOCAL_AUTHORITY_RESOLUTION'

          freshness = yaml.safe_load(
              (root / 'evidence-freshness.schema.yaml').read_text(encoding='utf-8')
          )
          assert freshness['$id'] == 'engineering-programme-coordinator-evidence-freshness-v1'
          assert freshness['properties']['schema_version']['const'] == 'EVIDENCE_FRESHNESS_V1'
          assert freshness['properties']['authority']['const'] == 'EVIDENCE_FRESHNESS_PROJECTION'

          phase1 = yaml.safe_load(
              (root / 'phase1-runtime-replay.schema.yaml').read_text(encoding='utf-8')
          )
          assert phase1['$id'] == 'engineering-programme-coordinator-phase1-runtime-replay-v1'
          assert phase1['properties']['schema_version']['const'] == 'PHASE1_RUNTIME_REPLAY_V1'
          assert phase1['properties']['authority']['const'] == 'INTEGRATION_PROJECTION_ONLY'

          real = yaml.safe_load(
              (root / 'real-artifact-replay.schema.yaml').read_text(encoding='utf-8')
          )
          assert real['$id'] == 'engineering-programme-coordinator-real-artifact-replay-v1'
          assert real['properties']['schema_version']['const'] == 'REAL_ARTIFACT_REPLAY_V1'
          assert real['properties']['artifact_class']['const'] == 'RETAINED_REAL_PROVIDER_ATTESTED'

          l0_source = yaml.safe_load(
              (root / 'l0-task-contract-source.schema.yaml').read_text(encoding='utf-8')
          )
          assert l0_source['$id'] == 'engineering-programme-coordinator-l0-task-contract-source-v1'
          assert l0_source['properties']['schema_version']['const'] == 'L0_TASK_CONTRACT_SOURCE_V1'
          assert l0_source['properties']['authority']['const'] == 'CHILD_CONTRACT_PROJECTION'

          l0_manifest = yaml.safe_load(
              (root / 'l0-task-obligation-manifest.schema.yaml').read_text(encoding='utf-8')
          )
          assert l0_manifest['$id'] == 'engineering-programme-coordinator-l0-task-obligation-manifest-v1'
          assert l0_manifest['properties']['schema_version']['const'] == 'L0_TASK_OBLIGATION_MANIFEST_V1'
          assert l0_manifest['properties']['authority']['const'] == 'FROZEN_PREIMPLEMENTATION_EXPECTATIONS'

          l1_source = yaml.safe_load(
              (root / 'l1-baseline-source.schema.yaml').read_text(encoding='utf-8')
          )
          assert l1_source['$id'] == 'engineering-programme-coordinator-l1-baseline-source-v1'
          assert l1_source['properties']['schema_version']['const'] == 'L1_BASELINE_SOURCE_V1'
          assert l1_source['properties']['authority']['const'] == 'BASELINE_SELECTION_CONTRACT'

          l1_manifest = yaml.safe_load(
              (root / 'l1-baseline-obligation-manifest.schema.yaml').read_text(encoding='utf-8')
          )
          assert l1_manifest['$id'] == 'engineering-programme-coordinator-l1-baseline-obligation-manifest-v1'
          assert l1_manifest['properties']['schema_version']['const'] == 'L1_BASELINE_OBLIGATION_MANIFEST_V1'
          assert l1_manifest['properties']['authority']['const'] == 'BASELINE_DERIVED_EXPECTATIONS'

          l2_source = yaml.safe_load(
              (root / 'l2-impact-source.schema.yaml').read_text(encoding='utf-8')
          )
          assert l2_source['$id'] == 'engineering-programme-coordinator-l2-impact-source-v1'
          assert l2_source['properties']['schema_version']['const'] == 'L2_IMPACT_SOURCE_V1'
          assert l2_source['properties']['authority']['const'] == 'CANDIDATE_DIFF_SELECTION_CONTRACT'

          l2_manifest = yaml.safe_load(
              (root / 'l2-impact-obligation-manifest.schema.yaml').read_text(encoding='utf-8')
          )
          assert l2_manifest['$id'] == 'engineering-programme-coordinator-l2-impact-obligation-manifest-v1'
          assert l2_manifest['properties']['schema_version']['const'] == 'L2_IMPACT_OBLIGATION_MANIFEST_V1'
          assert l2_manifest['properties']['authority']['const'] == 'DIFF_DERIVED_IMPACT_EXPECTATIONS'

          evidence_source = yaml.safe_load(
              (root / 'exact-candidate-evidence-source.schema.yaml').read_text(encoding='utf-8')
          )
          assert evidence_source['$id'] == 'engineering-programme-coordinator-exact-candidate-evidence-source-v1'
          assert evidence_source['properties']['schema_version']['const'] == 'EXACT_CANDIDATE_EVIDENCE_SOURCE_V1'
          assert evidence_source['properties']['authority']['const'] == 'CLOSED_DENOMINATOR_EVIDENCE_INPUT'

          evidence_ledger = yaml.safe_load(
              (root / 'exact-candidate-evidence-ledger.schema.yaml').read_text(encoding='utf-8')
          )
          assert evidence_ledger['$id'] == 'engineering-programme-coordinator-exact-candidate-evidence-ledger-v1'
          assert evidence_ledger['properties']['schema_version']['const'] == 'EXACT_CANDIDATE_EVIDENCE_LEDGER_V1'
          assert evidence_ledger['properties']['authority']['const'] == 'CLOSED_DENOMINATOR_EVIDENCE_ACCOUNTING'
          PY

      - name: Run integrated-mode regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_local_v11_integrated.py' -v

      - name: Run Common Reviewer basis regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_review_basis.py' -v

      - name: Run production readiness regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_production_readiness.py' -v

      - name: Run execution-kernel regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_execution_kernel.py' -v

      - name: Run provider-mutation regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_provider_mutation.py' -v

      - name: Run current-state regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_current_state.py' -v

      - name: Run authority-resolver regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_authority_resolver.py' -v

      - name: Run evidence-freshness regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_evidence_freshness.py' -v

      - name: Run Phase-1 runtime horizontal replay
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_phase1_runtime_replay.py' -v

      - name: Run retained real-artifact replay regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_real_artifact_replay.py' -v

      - name: Attest precommitted P2-S1 source from GitHub issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import urllib.request

          scripts = pathlib.Path('skills/engineering-programme-coordinator/scripts')
          sys.path.insert(0, str(scripts))
          from coordlib import load_yaml
          from l0_task_obligations import canonical_digest, extract_precommitted_source

          request = urllib.request.Request(
              'https://api.github.com/repos/reallaksh19/Common/issues/558',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'User-Agent': 'Common-P2-S1-L0-attestation',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              issue = json.load(response)

          live = extract_precommitted_source(issue['body'])
          retained = load_yaml(
              pathlib.Path(
                  'skills/engineering-programme-coordinator/references/p2-s1-l0-source.yaml'
              )
          )
          assert live == retained
          assert canonical_digest(live) == '5be577a4b69a0d9f34e0f660fa15efcdde0eb944aad9d1c0f568311c5d1fc09e'
          print('P2-S1 live child-contract source attestation: PASS')
          PY

      - name: Run L0 task-obligation compiler regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_l0_task_obligations.py' -v

      - name: Replay retained P2-S1 L0 source
        run: |
          python skills/engineering-programme-coordinator/scripts/l0_task_obligations.py validate \
            skills/engineering-programme-coordinator/references/p2-s1-l0-source.yaml \
            skills/engineering-programme-coordinator/references/p2-s1-l0-manifest.yaml

      - name: Fetch exact P2-S2 baseline object
        run: git fetch --no-tags --depth=1 origin 5a0077c9342938192f8d2861e9b9faaba106aedc

      - name: Attest precommitted P2-S2 selector source from GitHub issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import urllib.request

          scripts = pathlib.Path('skills/engineering-programme-coordinator/scripts')
          sys.path.insert(0, str(scripts))
          from coordlib import load_yaml
          from l1_baseline_obligations import canonical_digest, extract_precommitted_source

          request = urllib.request.Request(
              'https://api.github.com/repos/reallaksh19/Common/issues/560',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'User-Agent': 'Common-P2-S2-L1-attestation',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              issue = json.load(response)

          live = extract_precommitted_source(issue['body'])
          retained = load_yaml(
              pathlib.Path(
                  'skills/engineering-programme-coordinator/references/p2-s2-l1-source.yaml'
              )
          )
          assert live == retained
          assert canonical_digest(live) == '49228fa2e05b8b2a000e5116625e59ed8634bd293c2a62a730b6ee321490987a'
          print('P2-S2 live child-contract source attestation: PASS')
          PY

      - name: Run L1 baseline-obligation regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_l1_baseline_obligations.py' -v

      - name: Replay retained P2-S2 exact-base L1 manifest
        run: |
          python skills/engineering-programme-coordinator/scripts/l1_baseline_obligations.py validate \
            skills/engineering-programme-coordinator/references/p2-s2-l1-source.yaml \
            skills/engineering-programme-coordinator/references/p2-s2-l1-manifest.yaml \
            --repo-root .

      - name: Fetch exact P2-S3 retained candidate objects
        run: |
          git fetch --no-tags --depth=1 origin b5cdf39852bd2d403339f4d9ca0f819222f680c7
          git fetch --no-tags --depth=1 origin ff72a6a8fea215d2dc046655aa6bd9064282d3b7

      - name: Attest P2-S3 source and live PR522 identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import urllib.request

          scripts = pathlib.Path('skills/engineering-programme-coordinator/scripts')
          sys.path.insert(0, str(scripts))
          from coordlib import load_yaml
          from l2_diff_impact import canonical_digest, extract_precommitted_source

          def get_json(url, agent):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                      'User-Agent': agent,
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          issue = get_json(
              'https://api.github.com/repos/reallaksh19/Common/issues/562',
              'Common-P2-S3-L2-source-attestation',
          )
          pull = get_json(
              'https://api.github.com/repos/reallaksh19/Common/pulls/522',
              'Common-P2-S3-PR522-attestation',
          )

          live = extract_precommitted_source(issue['body'])
          retained = load_yaml(
              pathlib.Path(
                  'skills/engineering-programme-coordinator/references/p2-s3-l2-source.yaml'
              )
          )
          assert live == retained
          assert canonical_digest(live) == '2d7ec848316f2d0f981363e4bc2e2862bf721a05ea3d70f1c5f84be8a814342e'

          candidate = retained['candidate']
          assert candidate['repository'] == 'reallaksh19/Common'
          assert candidate['pr_number'] == 522
          assert pull['base']['ref'] == candidate['base_ref']
          assert pull['base']['sha'] == candidate['base_sha']
          assert pull['head']['ref'] == candidate['head_ref']
          assert pull['head']['sha'] == candidate['head_sha']
          assert pull['head']['repo']['full_name'] == candidate['repository']
          print('P2-S3 live issue + PR522 identity attestation: PASS')
          PY

      - name: Run L2 diff-impact regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_l2_diff_impact.py' -v

      - name: Replay retained P2-S3 exact-diff manifest
        run: |
          python skills/engineering-programme-coordinator/scripts/l2_diff_impact.py validate \
            skills/engineering-programme-coordinator/references/p2-s3-l2-source.yaml \
            skills/engineering-programme-coordinator/references/p2-s3-l2-manifest.yaml \
            --repo-root .
          python - <<'PY'
          import pathlib
          import yaml

          manifest = yaml.safe_load(
              pathlib.Path(
                  'skills/engineering-programme-coordinator/references/p2-s3-l2-manifest.yaml'
              ).read_text(encoding='utf-8')
          )
          assert manifest['diff']['changed_path_count'] == 6
          assert manifest['diff']['changed_paths_digest'] == '7b4d9019add69635a2016d2230abeba155bc1b1c22f5b3598444c67a425132d3'
          unknown = [
              row for row in manifest['obligations']
              if row['impact_classification'] != 'KNOWN'
          ]
          assert len(unknown) == 1
          assert unknown[0]['impact_classification'] == 'UNKNOWN_UNMAPPED'
          assert unknown[0]['diff_observation']['path'] == '.github/workflows/engineering-programme-coordinator-integrated.yml'
          assert all(
              row['evidence_required']['independence'] == 'IMPACT_DERIVED'
              for row in manifest['obligations']
          )
          assert manifest['authority_boundaries']['consumes_candidate_diff'] is True
          assert not any(
              value
              for key, value in manifest['authority_boundaries'].items()
              if key != 'consumes_candidate_diff'
          )
          print('P2-S3 retained real diff projection: PASS')
          PY

      - name: Attest P2-S4 source, PR522 and historical evidence identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import urllib.request

          scripts = pathlib.Path('skills/engineering-programme-coordinator/scripts')
          sys.path.insert(0, str(scripts))
          from coordlib import load_yaml
          from exact_candidate_evidence import canonical_digest, extract_precommitted_source

          def get_json(url, agent):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                      'User-Agent': agent,
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          issue = get_json(
              'https://api.github.com/repos/reallaksh19/Common/issues/564',
              'Common-P2-S4-source-attestation',
          )
          pull = get_json(
              'https://api.github.com/repos/reallaksh19/Common/pulls/522',
              'Common-P2-S4-PR522-attestation',
          )
          run = get_json(
              'https://api.github.com/repos/reallaksh19/Common/actions/runs/37408270193',
              'Common-P2-S4-run-attestation',
          )
          job = get_json(
              'https://api.github.com/repos/reallaksh19/Common/actions/jobs/112090640333',
              'Common-P2-S4-job-attestation',
          )

          live = extract_precommitted_source(issue['body'])
          retained = load_yaml(
              pathlib.Path(
                  'skills/engineering-programme-coordinator/references/p2-s4-evidence-source.yaml'
              )
          )
          assert live == retained
          assert canonical_digest(live) == '41a70b1580aadc31c278d9659ef785e9ef73eccc7d00ae7e4f4e98761910bd8b'

          candidate = retained['candidate']
          assert candidate['repository'] == 'reallaksh19/Common'
          assert candidate['pr_number'] == 522
          assert pull['head']['repo']['full_name'] == candidate['repository']
          assert pull['head']['ref'] == candidate['ref']
          assert pull['head']['sha'] == candidate['sha']

          assert run['id'] == 37408270193
          assert run['head_sha'] == candidate['sha']
          assert run['conclusion'] == 'success'
          assert job['id'] == 112090640333
          assert job['name'] == 'validate-local-v11-integrated-mode'
          assert job['conclusion'] == 'success'
          steps = {step['number']: step for step in job['steps']}
          assert steps[7]['name'] == 'Validate coordinator schemas'
          assert steps[7]['conclusion'] == 'success'
          assert steps[8]['name'] == 'Run coordinator regressions'
          assert steps[8]['conclusion'] == 'success'
          print('P2-S4 live source + exact candidate + historical evidence attestation: PASS')
          PY

      - name: Run exact-candidate evidence ledger regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_exact_candidate_evidence.py' -v

      - name: Replay retained P2-S4 closed evidence ledger
        run: |
          python skills/engineering-programme-coordinator/scripts/exact_candidate_evidence.py validate \
            skills/engineering-programme-coordinator/references/p2-s4-evidence-source.yaml \
            skills/engineering-programme-coordinator/references/p2-s4-evidence-ledger.yaml \
            --repo-root .
          python - <<'PY'
          import pathlib
          import yaml

          ledger = yaml.safe_load(
              pathlib.Path(
                  'skills/engineering-programme-coordinator/references/p2-s4-evidence-ledger.yaml'
              ).read_text(encoding='utf-8')
          )
          assert ledger['denominator'] == {
              'obligation_count': 13,
              'requirement_count': 13,
          }
          assert ledger['accounting'] == {
              'obligations_with_evidence': 4,
              'obligations_without_evidence': 9,
              'requirements_with_evidence': 4,
              'requirements_without_evidence': 9,
              'evidence_item_count': 4,
          }
