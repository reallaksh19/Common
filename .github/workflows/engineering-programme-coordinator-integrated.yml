name: engineering-programme-coordinator-integrated

on:
  pull_request:
    paths:
      - 'skills/engineering-programme-coordinator/**'
      - 'skills/common-reviewer-protocol-v1.0/**'
      - 'skills/Local_PR_Deliverty_v1.1/**'
      - 'skills/engineering-pr-delivery-v3.5/**'
      - '.github/workflows/engineering-programme-coordinator-integrated.yml'
  push:
    branches:
      - 'codex/492-c-*'
      - 'bench/**'
      - 'prod/**'
    paths:
      - 'skills/engineering-programme-coordinator/**'
      - 'skills/common-reviewer-protocol-v1.0/**'
      - 'skills/Local_PR_Deliverty_v1.1/**'
      - 'skills/engineering-pr-delivery-v3.5/**'
      - '.github/workflows/engineering-programme-coordinator-integrated.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact 40-character commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  validate-local-v11-integrated-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha) }}
          fetch-depth: 1

      - name: Bind exact candidate
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha) }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Validated candidate SHA: $ACTUAL_SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Compile coordinator runtimes
        run: |
          python -m py_compile \
            skills/engineering-programme-coordinator/scripts/local_v11_integrated.py \
            skills/engineering-programme-coordinator/scripts/review_basis.py \
            skills/engineering-programme-coordinator/scripts/production_readiness.py \
            skills/engineering-programme-coordinator/scripts/execution_kernel.py \
            skills/engineering-programme-coordinator/scripts/provider_mutation.py \
            skills/engineering-programme-coordinator/scripts/current_state.py \
            skills/engineering-programme-coordinator/scripts/authority_resolver.py \
            skills/engineering-programme-coordinator/scripts/evidence_freshness.py \
            skills/engineering-programme-coordinator/scripts/phase1_runtime_replay.py \
            skills/engineering-programme-coordinator/scripts/real_artifact_replay.py \
            skills/engineering-programme-coordinator/scripts/validate.py

      - name: Validate coordinator schemas
        run: |
          python - <<'PY'
          import pathlib
          import yaml
          root = pathlib.Path('skills/engineering-programme-coordinator/schemas')

          integrated = yaml.safe_load(
              (root / 'local-v1.1-integrated.schema.yaml').read_text(encoding='utf-8')
          )
          assert integrated['$id'] == 'engineering-programme-coordinator-local-v1.1-integrated'
          assert integrated['properties']['mode']['const'] == 'LOCAL_V1_1_INTEGRATED'
          assert integrated['properties']['authority']['const'] == 'OBSERVATION_ONLY'
          assert integrated['properties']['legacy_v31_interpretation']['const'] == 'READABLE_COMPATIBILITY_ONLY'

          readiness = yaml.safe_load(
              (root / 'production-readiness.schema.yaml').read_text(encoding='utf-8')
          )
          assert readiness['$id'] == 'engineering-programme-coordinator-production-readiness-v1'
          assert readiness['properties']['schema_version']['const'] == 'PRODUCTION_READINESS_V1'
          assert readiness['properties']['authority']['const'] == 'PRODUCTION_READINESS_PROJECTION'
          assert readiness['properties']['production_mode']['enum'] == [
              'OFF', 'SHADOW_ONLY', 'CRITICAL_GATE', 'DEFAULT_GATE'
          ]
          required_basis = set(readiness['properties']['exact_basis']['required'])
          assert 'common_reviewer_ref' in required_basis
          assert 'common_reviewer_digest' in required_basis

          execution = yaml.safe_load(
              (root / 'execution-state.schema.yaml').read_text(encoding='utf-8')
          )
          assert execution['$id'] == 'engineering-programme-coordinator-execution-state-v1'
          assert execution['properties']['schema_version']['const'] == 'EXECUTION_STATE_V1'
          assert execution['properties']['authority']['const'] == 'EXECUTION_STATE_PROJECTION'
          action_enum = execution['properties']['next_action']['properties']['type']['enum']
          assert 'REQUEST_STAGE_ADVANCE' in action_enum
          assert 'ADVANCE_STAGE' not in action_enum

          provider = yaml.safe_load(
              (root / 'provider-mutation.schema.yaml').read_text(encoding='utf-8')
          )
          assert provider['$id'] == 'engineering-programme-coordinator-provider-mutation-v1'
          assert provider['properties']['schema_version']['const'] == 'PROVIDER_MUTATION_V1'
          assert provider['properties']['authority']['const'] == 'PROVIDER_MUTATION_TRANSACTION'

          current = yaml.safe_load(
              (root / 'current-state.schema.yaml').read_text(encoding='utf-8')
          )
          assert current['$id'] == 'engineering-programme-coordinator-current-state-v1'
          assert current['properties']['schema_version']['const'] == 'CURRENT_STATE_V1'
          assert current['properties']['authority']['const'] == 'CURRENT_STATE_PROJECTION'

          authority = yaml.safe_load(
              (root / 'authority-resolution.schema.yaml').read_text(encoding='utf-8')
          )
          assert authority['$id'] == 'engineering-programme-coordinator-authority-resolution-v1'
          assert authority['properties']['schema_version']['const'] == 'AUTHORITY_RESOLUTION_V1'
          assert authority['properties']['authority']['const'] == 'LOCAL_AUTHORITY_RESOLUTION'

          freshness = yaml.safe_load(
              (root / 'evidence-freshness.schema.yaml').read_text(encoding='utf-8')
          )
          assert freshness['$id'] == 'engineering-programme-coordinator-evidence-freshness-v1'
          assert freshness['properties']['schema_version']['const'] == 'EVIDENCE_FRESHNESS_V1'
          assert freshness['properties']['authority']['const'] == 'EVIDENCE_FRESHNESS_PROJECTION'

          phase1 = yaml.safe_load(
              (root / 'phase1-runtime-replay.schema.yaml').read_text(encoding='utf-8')
          )
          assert phase1['$id'] == 'engineering-programme-coordinator-phase1-runtime-replay-v1'
          assert phase1['properties']['schema_version']['const'] == 'PHASE1_RUNTIME_REPLAY_V1'
          assert phase1['properties']['authority']['const'] == 'INTEGRATION_PROJECTION_ONLY'

          real = yaml.safe_load(
              (root / 'real-artifact-replay.schema.yaml').read_text(encoding='utf-8')
          )
          assert real['$id'] == 'engineering-programme-coordinator-real-artifact-replay-v1'
          assert real['properties']['schema_version']['const'] == 'REAL_ARTIFACT_REPLAY_V1'
          assert real['properties']['artifact_class']['const'] == 'RETAINED_REAL_PROVIDER_ATTESTED'
          PY

      - name: Run integrated-mode regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_local_v11_integrated.py' -v

      - name: Run Common Reviewer basis regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_review_basis.py' -v

      - name: Run production readiness regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_production_readiness.py' -v

      - name: Run execution-kernel regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_execution_kernel.py' -v

      - name: Run provider-mutation regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_provider_mutation.py' -v

      - name: Run current-state regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_current_state.py' -v

      - name: Run authority-resolver regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_authority_resolver.py' -v

      - name: Run evidence-freshness regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_evidence_freshness.py' -v

      - name: Run Phase-1 runtime horizontal replay
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_phase1_runtime_replay.py' -v

      - name: Run retained real-artifact replay regressions
        run: python -m unittest discover -s skills/engineering-programme-coordinator/tests -p 'test_real_artifact_replay.py' -v

      - name: Run authenticated retained real-artifact replay
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          python skills/engineering-programme-coordinator/scripts/real_artifact_replay.py \
            skills/engineering-programme-coordinator/references/p1-i-b-real-artifact-manifest.yaml \
            --candidate-sha "$CANDIDATE_SHA" \
            --repository-root . \
            > /tmp/p1-i-b-real-artifact.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/p1-i-b-real-artifact.json').read_text(encoding='utf-8'))
          assert result['artifact_class'] == 'RETAINED_REAL_PROVIDER_ATTESTED'
          assert result['provider_attestation']['live_verified'] is True
          assert result['provider_attestation']['comments_verified'] == 6
          assert result['provider_attestation']['workflow_runs_verified'] == 4
          assert result['production_readiness']['components']['real_artifact_horizontal_integration']['state'] == 'VERIFIED'
          assert result['production_readiness']['production_mode'] == 'OFF'
          assert 'P1I-REAL-ARTIFACT-MISSING' not in {
              row['id'] for row in result['production_readiness']['cutover_blockers']
          }
          assert result['assertions']['historical_failures_preserved'] is True
          assert result['assertions']['exact_candidate_bound'] is True
          assert not any(result['authority_boundaries'].values())
          print('P1-I-B live real-artifact replay: PASS')
          PY

      - name: Validate Common Reviewer authority boundary
        run: |
          python - <<'PY'
          import pathlib
          import yaml
          manifest = yaml.safe_load(pathlib.Path('skills/common-reviewer-protocol-v1.0/protocol-manifest.yaml').read_text(encoding='utf-8'))
          protocol = manifest['protocol']
          assert protocol['version'] == '1.0'
          assert protocol['status'] == 'ACTIVE'
          assert manifest['capabilities']['emits_engineering_pass'] is False
          assert manifest['capabilities']['emits_lifecycle_advance'] is False
          assert manifest['execution_contexts']['solo_default']['schema'] == 'SELF_CHECK_CONTEXT_V1'
          assert manifest['execution_contexts']['governed_review']['schema'] == 'REVIEW_CONTEXT_V1'
          PY

      - name: Verify V3.5 provider is explicit
        run: |
          grep -F 'engineering-pr-delivery-v3.5' skills/engineering-programme-coordinator/references/local-v1.1-v3.5-integrated-mode.md
          grep -F 'READABLE_COMPATIBILITY_ONLY' skills/engineering-programme-coordinator/schemas/local-v1.1-integrated.schema.yaml
