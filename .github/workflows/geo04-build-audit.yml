name: GEO-04 PDF Custody

on:
  push:
    branches: [ioqm-g9-geo04-circles-tangency]
    paths:
      - '.github/workflows/geo04-build-audit.yml'

permissions:
  contents: write

jobs:
  render-and-custody:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ioqm-g9-geo04-circles-tangency
          fetch-depth: 0

      - name: Install render dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra fonts-dejavu-core fonts-dejavu-extra poppler-utils

      - name: Regenerate and validate metadata
        shell: bash
        run: |
          set -euo pipefail
          TOPIC='Grade 9/Mathematics/IOQM/03_Main_Topics/GEO-04_Circles_Cyclicity_Tangency'
          python "$TOPIC/Authoring/generate_geo04_metadata.py"
          export TOPIC
          python - <<'PY'
          import csv, os
          from pathlib import Path
          p=Path(os.environ['TOPIC'])/'Item_Metadata.csv'
          with p.open(encoding='utf-8', newline='') as f: rows=list(csv.reader(f))
          assert len(rows)==85
          assert all(len(r)==31 for r in rows)
          assert all(r[27]=='true' for r in rows[1:])
          PY

      - name: Render and preflight exact custody PDFs
        shell: bash
        run: |
          set -euo pipefail
          TOPIC='Grade 9/Mathematics/IOQM/03_Main_Topics/GEO-04_Circles_Cyclicity_Tangency'
          python "$TOPIC/Authoring/render_geo04_pdfs.py"
          STUDENT="$TOPIC/PDFs/GEO04_Student_Pack_v1.pdf"
          TEACHER="$TOPIC/PDFs/GEO04_Teacher_Key_v1.pdf"
          test "$(pdfinfo "$STUDENT" | awk '/^Pages:/ {print $2}')" = '17'
          test "$(pdfinfo "$TEACHER" | awk '/^Pages:/ {print $2}')" = '6'
          pdfinfo "$STUDENT" | grep -q '^Encrypted:       no'
          pdfinfo "$TEACHER" | grep -q '^Encrypted:       no'
          pdftotext "$STUDENT" /tmp/student.txt
          pdftotext "$TEACHER" /tmp/teacher.txt
          if grep -Eqi 'GEO-04|issue #[0-9]+|pull request|PR #[0-9]+|git branch|branch (name|ref)|microstream|interface|metadata schema|H[0-3]|F[0-4]|DRAFT_AUTHORING' /tmp/student.txt; then exit 1; fi
          grep -q 'Circles, Cyclicity' /tmp/student.txt
          grep -q 'Teacher' /tmp/teacher.txt

      - name: Write custody manifest
        shell: bash
        run: |
          set -euo pipefail
          TOPIC='Grade 9/Mathematics/IOQM/03_Main_Topics/GEO-04_Circles_Cyclicity_Tangency'
          STUDENT="$TOPIC/PDFs/GEO04_Student_Pack_v1.pdf"
          TEACHER="$TOPIC/PDFs/GEO04_Teacher_Key_v1.pdf"
          S_SHA=$(sha256sum "$STUDENT" | awk '{print $1}')
          T_SHA=$(sha256sum "$TEACHER" | awk '{print $1}')
          S_BLOB=$(git hash-object "$STUDENT")
          T_BLOB=$(git hash-object "$TEACHER")
          S_SIZE=$(stat -c '%s' "$STUDENT")
          T_SIZE=$(stat -c '%s' "$TEACHER")
          cat > "$TOPIC/PDF_Custody.md" <<EOF
          # GEO-04 PDF Custody

          Status: \`REPOSITORY_CUSTODY_PENDING_EXACT_BINARY_VISUAL_CONFIRMATION\`

          Canonical renderer: \`Authoring/render_geo04_pdfs.py\`
          Source render commit: \`${GITHUB_SHA}\`

          | Artifact | Pages | Bytes | SHA-256 | Git blob |
          |---|---:|---:|---|---|
          | \`PDFs/GEO04_Student_Pack_v1.pdf\` | 17 | ${S_SIZE} | \`${S_SHA}\` | \`${S_BLOB}\` |
          | \`PDFs/GEO04_Teacher_Key_v1.pdf\` | 6 | ${T_SIZE} | \`${T_SHA}\` | \`${T_BLOB}\` |

          Automated checks: A4/page counts PASS; open/text extraction PASS; encryption NONE; learner control-plane scrub PASS.

          Historical source-page custody: PASS 5/5. Exact inspected historical problem pages are text-only; no printed historical figures require redraw custody. The canonical non-degenerate IOQM-2025-Q23 reading is preserved.

          Exact repository-binary 200-dpi visual comparison: PENDING until artifact retrieval.

          Classroom timing/readability, retention, psychometrics, qualification/pass-mark calibration, and publication approval remain \`NOT_RUN\`.
          EOF

      - name: Commit exact binary custody
        shell: bash
        run: |
          set -euo pipefail
          TOPIC='Grade 9/Mathematics/IOQM/03_Main_Topics/GEO-04_Circles_Cyclicity_Tangency'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TOPIC/Item_Metadata.csv" "$TOPIC/PDFs/GEO04_Student_Pack_v1.pdf" "$TOPIC/PDFs/GEO04_Teacher_Key_v1.pdf" "$TOPIC/PDF_Custody.md"
          git commit -m 'GEO-04: add benchmark PDF custody artifacts'
          git push origin HEAD:ioqm-g9-geo04-circles-tangency

      - name: Upload exact custody artifact
        uses: actions/upload-artifact@v4
        with:
          name: geo04-pdf-custody
          path: |
            Grade 9/Mathematics/IOQM/03_Main_Topics/GEO-04_Circles_Cyclicity_Tangency/PDFs/GEO04_Student_Pack_v1.pdf
            Grade 9/Mathematics/IOQM/03_Main_Topics/GEO-04_Circles_Cyclicity_Tangency/PDFs/GEO04_Teacher_Key_v1.pdf
            Grade 9/Mathematics/IOQM/03_Main_Topics/GEO-04_Circles_Cyclicity_Tangency/PDF_Custody.md
          if-no-files-found: error
          retention-days: 30
