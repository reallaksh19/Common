name: delp-projection

# Durable Execution Lineage and Projection (DELP): agents publish facts, everything else is recomputed.
# Instantiated on every PR so the check is terminal even when DELP is irrelevant; path relevance is
# classified inside the job (same pattern as engineering-pr-delivery-v3.2).
on:
  pull_request:
  push:
    branches:
      - 'main'
    paths:
      - 'skills/engineering-pr-delivery-v3.2/**'
      - 'skills/engineering-pr-delivery-v3.5/**'
      - '.github/workflows/delp-projection.yml'

permissions:
  contents: read

jobs:
  validate-delp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect DELP path relevance
        id: relevance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_paths="$RUNNER_TEMP/delp-changed-paths.txt"
          if ! git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Path relevance could not be determined; running DELP validation." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          relevant=false
          while IFS= read -r path; do
            case "$path" in
              skills/engineering-pr-delivery-v3.2/*|skills/engineering-pr-delivery-v3.5/*|.github/workflows/delp-projection.yml)
                relevant=true
                break
                ;;
            esac
          done < "$changed_paths"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [[ "$relevant" == "false" ]]; then
            echo "DELP scope unchanged; check is NOT_APPLICABLE and terminal." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: DELP scope not applicable
        if: steps.relevance.outputs.relevant != 'true'
        run: echo "NOT_APPLICABLE - no V3.2/V3.5 skill paths changed."

      - name: Set up Python
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schema dependencies
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Compile DELP and continuity Python
        if: steps.relevance.outputs.relevant == 'true'
        run: |
          python -m py_compile \
            skills/engineering-pr-delivery-v3.2/scripts/delp_projection_v32.py \
            skills/engineering-pr-delivery-v3.2/scripts/continuity_projection.py \
            skills/engineering-pr-delivery-v3.2/scripts/owner_commands.py \
            skills/engineering-pr-delivery-v3.5/scripts/delp_projection_v35.py \
            skills/engineering-pr-delivery-v3.5/scripts/continuity_projection.py \
            skills/engineering-pr-delivery-v3.5/scripts/owner_commands.py

      - name: Validate DELP schemas parse and carry the expected ids
        if: steps.relevance.outputs.relevant == 'true'
        run: |
          python - <<'PY'
          import pathlib
          import yaml
          for tag, line in (('v32', 'v3.2'), ('v35', 'v3.5')):
              skill = pathlib.Path(f'skills/engineering-pr-delivery-{line}/schemas')
              for name in ('checkpoint-facts', 'execution-graph', 'live-status'):
                  document = yaml.safe_load((skill / f'delp-{name}-{tag}.schema.yaml').read_text(encoding='utf-8'))
                  assert document['$id'] == f'relay-{line}-delp-{name}', (tag, name, document['$id'])
          PY

      - name: Run DELP regressions (V3.5 active contract)
        if: steps.relevance.outputs.relevant == 'true'
        run: |
          python -m unittest discover -s skills/engineering-pr-delivery-v3.5/tests -p 'test_delp_projection_v35.py' -v
          python -m unittest discover -s skills/engineering-pr-delivery-v3.5/tests -p 'test_continuity_derived_projection.py' -v
          python -m unittest discover -s skills/engineering-pr-delivery-v3.5/tests -p 'test_owner_commands*.py' -v

      - name: Run DELP regressions (V3.2 amendment)
        if: steps.relevance.outputs.relevant == 'true'
        run: |
          python -m unittest discover -s skills/engineering-pr-delivery-v3.2/tests -p 'test_delp_projection_v32.py' -v
          python -m unittest discover -s skills/engineering-pr-delivery-v3.2/tests -p 'test_continuity_derived_projection.py' -v
          python -m unittest discover -s skills/engineering-pr-delivery-v3.2/tests -p 'test_owner_commands*.py' -v
          python -m unittest discover -s skills/engineering-pr-delivery-v3.2/tests -p 'test_continuity_v32*.py' -v
          python -m unittest discover -s skills/engineering-pr-delivery-v3.2/tests -p 'test_replay_cases_v32.py' -v

      - name: Decomposition gate accepts the shipped plan and rejects a broken one (both lines)
        if: steps.relevance.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for pair in 'v3.2 v32' 'v3.5 v35'; do
            set -- $pair
            skill="skills/engineering-pr-delivery-$1"
            engine="$skill/scripts/delp_projection_$2.py"
            example="$skill/examples/delp/execution-graph.yaml"
            python "$engine" decompose-check --graph "$example"
            broken="$RUNNER_TEMP/broken-$2.yaml"
            python - "$example" "$broken" <<'PY'
          import sys
          import yaml
          graph = yaml.safe_load(open(sys.argv[1], encoding='utf-8'))
          next(n for n in graph['nodes'] if n['kind'] == 'LEAF').pop('outcome')
          yaml.safe_dump(graph, open(sys.argv[2], 'w', encoding='utf-8'))
          PY
            if python "$engine" decompose-check --graph "$broken" > "$RUNNER_TEMP/broken-$2.out"; then
              echo "decomposition gate accepted a plan with a leaf that states no outcome" >&2
              exit 1
            fi
            grep -F 'OUTCOME_MISSING' "$RUNNER_TEMP/broken-$2.out"
            python "$engine" graph-diff --old "$example" --new "$example"
          done

      - name: Verify explicitly shared V3.2 and V3.5 compatibility surfaces
        if: steps.relevance.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmp skills/engineering-pr-delivery-v3.2/scripts/continuity_projection.py skills/engineering-pr-delivery-v3.5/scripts/continuity_projection.py
          cmp skills/engineering-pr-delivery-v3.2/scripts/owner_commands.py skills/engineering-pr-delivery-v3.5/scripts/owner_commands.py
