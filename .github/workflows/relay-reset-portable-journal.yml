name: relay-reset-portable-journal-bundle
on:
  pull_request:
    paths:
      - 'skills/engineering-relay-v1/session-bundle-v1.*'
      - '.github/workflows/relay-reset-portable-journal.yml'
permissions:
  contents: read
jobs:
  portable-bundle-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test cross-process bundle export and real merged R2-A import
        run: node --test skills/engineering-relay-v1/session-bundle-v1.test.mjs