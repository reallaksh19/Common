name: relay-reset-owner-scope
on:
  pull_request:
    paths:
      - 'skills/engineering-relay-v1/owner-decision-scope-v1.*'
      - '.github/workflows/relay-reset-owner-scope.yml'
permissions:
  contents: read
jobs:
  scope-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test inert decision-scope candidate policy
        run: node --test skills/engineering-relay-v1/owner-decision-scope-v1.test.mjs