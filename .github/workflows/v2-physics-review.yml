name: V2 Physics Review Revision
on:
  pull_request:
    paths:
      - "Grade 9/V2/Physics/Review/**"
      - "Grade 9/V2/Physics/Publication/**"
      - ".github/workflows/v2-physics-review.yml"
  workflow_dispatch:
jobs:
  physics-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators and PDF tooling
        run: python -m pip install "jsonschema>=4.20,<5" "reportlab>=4.0,<5" "pypdf>=5,<6" "pypdfium2>=4.30,<5"
      - name: Validate review contracts
        run: python "Grade 9/V2/Physics/Review/contracts/validate_contracts.py"
      - name: Run review falsifiers
        run: |
          P="Grade 9/V2/Physics"; L="$P/LearnerIntelligence"; S="$P/StudySynthesis"; D="$P/LearningDesign"; PUB="$P/Publication"; R="$P/Review"
          python "$L/engine/derive_physics_state.py" --evidence "$L/fixtures/evidence.synthetic.json" --policy "$L/fixtures/inference_policy.synthetic.json" --interface "$L/fixtures/learner_intelligence_interface.synthetic.json" --out /tmp/phy-state.json
          python "$S/engine/synthesize_physics_study_model.py" --goal "$S/fixtures/goal_scope.synthetic.json" --cks "$S/fixtures/canonical_knowledge_set.synthetic.json" --learner-state /tmp/phy-state.json --policy "$S/fixtures/study_policy.synthetic.json" --out /tmp/phy-study.json
          python "$D/engine/design_physics_learning.py" --study-result /tmp/phy-study.json --policy "$D/fixtures/design_policy.synthetic.json" --out "$PUB/fixtures/design_result.synthetic.json"
          python "$R/tests/test_physics_review.py"
      - name: Build revised exact candidate and preflight
        run: |
          P="Grade 9/V2/Physics"; PUB="$P/Publication"; R="$P/Review"
          python "$PUB/engine/build_semantic_product.py" --design-plan "$PUB/fixtures/design_result.synthetic.json" --canonical-probes "$P/Canonical/registry/diagnostic_probes.json" --out /tmp/phy-v206-product.json
          python "$PUB/engine/realize_physics_publication.py" --product /tmp/phy-v206-product.json --target "$PUB/fixtures/publication_target.synthetic.json" --policy "$PUB/fixtures/publication_policy.synthetic.json" --design-plan "$PUB/fixtures/design_result.synthetic.json" --out /tmp/phy-v206
          python "$PUB/validator/validate_candidate.py" --out /tmp/phy-v206
          python "$PUB/validator/render_preflight.py" --pdf /tmp/phy-v206/candidate.pdf --out-dir /tmp/phy-v206-renders --expected-pages 4
          python "$R/engine/build_review_package.py" --baseline "$R/fixtures/baseline_candidate.synthetic.json" --findings "$R/fixtures/ai_pre_review_findings.synthetic.json" --revised-manifest /tmp/phy-v206/publication_manifest.json --revised-product /tmp/phy-v206/learner_semantic_product.json --out /tmp/phy-v206/review_package.json
      - name: Prove resolved findings and pending human gates
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/phy-v206/review_package.json'))
          b={x['finding_id']:x for x in r['findings']}
          assert all(b[x]['status']=='RESOLVED' for x in ('PHY-R01','PHY-R02','PHY-R03','PHY-R04'))
          assert b['PHY-R05']['status']=='OBSERVED_HUMAN_REVIEW_REQUIRED'
          assert all(r['quality_states'][x]=='PENDING' for x in ('SUBJECT_CORRECTNESS','PEDAGOGY_USABILITY','VISUAL_USABILITY'))
          assert r['release_evidence_eligible'] is False
          print('PHY-V2-06 exact revised review gates = PASS')
          PY
      - name: Deterministic review-package replay
        run: |
          R="Grade 9/V2/Physics/Review"
          python "$R/engine/build_review_package.py" --baseline "$R/fixtures/baseline_candidate.synthetic.json" --findings "$R/fixtures/ai_pre_review_findings.synthetic.json" --revised-manifest /tmp/phy-v206/publication_manifest.json --revised-product /tmp/phy-v206/learner_semantic_product.json --out /tmp/review-a.json
          python "$R/engine/build_review_package.py" --baseline "$R/fixtures/baseline_candidate.synthetic.json" --findings "$R/fixtures/ai_pre_review_findings.synthetic.json" --revised-manifest /tmp/phy-v206/publication_manifest.json --revised-product /tmp/phy-v206/learner_semantic_product.json --out /tmp/review-b.json
          cmp /tmp/review-a.json /tmp/review-b.json
      - name: Upload revised candidate and review proof
        uses: actions/upload-artifact@v4
        with:
          name: physics-v2-06-reviewed-candidate
          path: |
            /tmp/phy-v206/**
            /tmp/phy-v206-renders/**
          if-no-files-found: error
