name: Local PR Delivery v1.1 integration

on:
  pull_request:
  push:
    branches:
      - 'codex/492-d-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation-and-version-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Compile integration runtime
        run: |
          python -m py_compile \
            skills/Local_PR_Deliverty_v1.1/scripts/activation.py \
            skills/Local_PR_Deliverty_v1.1/scripts/stage_timer.py \
            skills/Local_PR_Deliverty_v1.1/scripts/version_guard.py \
            skills/Local_PR_Deliverty_v1.1/scripts/selector_scan.py \
            skills/Local_PR_Deliverty_v1.1/scripts/frozen_tree_guard.py
      - name: Validate stack manifests
        run: |
          python - <<'PY'
          import pathlib
          import yaml
          root = pathlib.Path('skills/Local_PR_Deliverty_v1.1/integration')
          stack = yaml.safe_load((root / 'protocol-stack.yaml').read_text(encoding='utf-8'))
          matrix = yaml.safe_load((root / 'compatibility-matrix.yaml').read_text(encoding='utf-8'))
          assert stack['stack_id'] == 'LOCAL_V1_1_V35'
          assert stack['outer_protocol']['name'] == 'Local_PR_Deliverty_v1.1'
          assert stack['nested_protocols']['CODER']['name'] == 'engineering-pr-delivery-v3.5'
          assert stack['coordinator_adapter']['mode'] == 'LOCAL_V1_1_INTEGRATED'
          assert stack['coordinator_adapter']['role'] == 'OBSERVATION_ONLY'
          review = stack['review_stack']
          assert review['common_floor']['name'] == 'common-reviewer-protocol-v1.0'
          assert review['common_floor']['emits_engineering_pass'] is False
          assert review['execution_modes']['SOLO_SELF_CHECK']['context_schema'] == 'SELF_CHECK_CONTEXT_V1'
          assert review['execution_modes']['SOLO_SELF_CHECK']['principal_independence'] == 'NONE'
          assert review['execution_modes']['GOVERNED_REVIEW']['context_schema'] == 'REVIEW_CONTEXT_V1'
          assert review['downstream_evidence_gate']['common_review_may_bypass'] is False
          assert 'COMMON_REVIEW_PROTOCOL_PINNED' in stack['activation']['material_work_requires']
          assert 'PROJECT_REVIEW_PROTOCOL_PINNED' in stack['activation']['material_work_requires']
          assert 'REVIEW_MODE_RESOLVED' in stack['activation']['material_work_requires']
          assert 'engineering-pr-delivery-v3.2' in stack['forbidden_active_relay_versions']
          profile = matrix['profiles']['LOCAL_V1_1_V35']
          assert profile['nested_coder']['version'] == '3.5'
          assert profile['common_reviewer']['version'] == '1.0'
          assert profile['common_reviewer']['same_principal_independence_claim'] == 'FORBIDDEN'
          assert profile['review_execution']['solo']['context_schema'] == 'SELF_CHECK_CONTEXT_V1'
          assert profile['review_execution']['governed']['context_schema'] == 'REVIEW_CONTEXT_V1'
          assert profile['review_execution']['advancement_gate']['state'] == 'DOWNSTREAM_DEPENDENCY'
          assert profile['programme_coordinator']['legacy_v31'] == 'READABLE_COMPATIBILITY_ONLY'
          assert matrix['migration']['automatic'] is False
          PY
      - name: Run activation adversarial suite
        run: python -m unittest discover -s skills/Local_PR_Deliverty_v1.1/tests -p 'test_492_activation.py' -v
      - name: Replay live Common selector conflict
        run: |
          python -m unittest discover -s skills/Local_PR_Deliverty_v1.1/tests -p 'test_492_selector_scan.py' -v
          python skills/Local_PR_Deliverty_v1.1/scripts/selector_scan.py AGENTS.md
      - name: Frozen-tree guard tests
        run: python -m unittest discover -s skills/Local_PR_Deliverty_v1.1/tests -p 'test_frozen_tree_guard.py' -v
      - name: Verify frozen V3.2 tree unchanged (or amended only by a base-pinned Owner amendment)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ZERO_SHA='0000000000000000000000000000000000000000'

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$PUSH_BEFORE_SHA" != "$ZERO_SHA" ]]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            BASE_SHA="$(git rev-parse HEAD^)"
          else
            echo "Unable to resolve comparison basis for frozen V3.2 tree" >&2
            exit 1
          fi

          BASE_TREE="$(git rev-parse "$BASE_SHA:skills/engineering-pr-delivery-v3.2")"
          HEAD_TREE="$(git rev-parse "HEAD:skills/engineering-pr-delivery-v3.2")"

          echo "comparison_base_sha=$BASE_SHA"
          echo "base_v32_tree=$BASE_TREE"
          echo "head_v32_tree=$HEAD_TREE"

          if [[ "$HEAD_TREE" == "$BASE_TREE" ]]; then
            echo "frozen V3.2 tree unchanged"
            exit 0
          fi

          # Changed. Permitted only for exact paths authorised by an owner_authorized amendment that is
          # already present at the comparison base: a pull request cannot authorise its own edits.
          python skills/Local_PR_Deliverty_v1.1/scripts/frozen_tree_guard.py --base "$BASE_SHA" --head HEAD
      - name: Verify integrated coordinator and Common Reviewer contracts are present
        run: |
          test -f skills/engineering-programme-coordinator/schemas/local-v1.1-integrated.schema.yaml
          test -f skills/engineering-programme-coordinator/schemas/self-check-context.schema.yaml
          test -f skills/engineering-programme-coordinator/schemas/review-context.schema.yaml
          test -f skills/common-reviewer-protocol-v1.0/schemas/common-review-profile.schema.yaml
          grep -F 'LOCAL_V1_1_INTEGRATED' skills/engineering-programme-coordinator/references/local-v1.1-v3.5-integrated-mode.md
