name: Primary Math V2 CoreSkills registries

on:
  pull_request:
    paths:
      - 'Primary/V2/Mathematics/CoreSkills/**'
      - '.github/workflows/primary-math-v2-core-skills.yml'
  push:
    branches: [main]
    paths:
      - 'Primary/V2/Mathematics/CoreSkills/**'
      - '.github/workflows/primary-math-v2-core-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-core-skills-registries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical capability/problem/translation registries
        run: python Primary/V2/Mathematics/CoreSkills/validate_registries.py
