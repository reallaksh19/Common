name: Grade 4 English V2 Core

on:
  pull_request:
    paths:
      - 'Grade 4/V2/English/**'
      - '.github/workflows/grade4-english-v2-core.yml'
  push:
    branches:
      - primary-english-v2-source-evidence
    paths:
      - 'Grade 4/V2/English/**'
      - '.github/workflows/grade4-english-v2-core.yml'

jobs:
  semantic-authoring-and-publication:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publication test dependencies
        run: pip install pytest reportlab pypdfium2 pillow
      - name: Build first real English source-set handoff
        run: python 'Grade 4/V2/English/Benchmarks/source_sets/english_worksheet_09/build_fixture.py'
      - name: Validate source coverage and semantic invariants
        run: python 'Grade 4/V2/English/Acceptance/Validation/validate_english_worksheet_09.py'
      - name: Validate deterministic publication
        run: pytest -q 'Grade 4/V2/English/Publication/tests'
      - name: Build and render real Worksheet 09 publication set
        run: python 'Grade 4/V2/English/Acceptance/Validation/validate_english_worksheet_09_publication.py'
      - name: Upload English V2 study guide, workbook, teacher key and renders
        uses: actions/upload-artifact@v4
        with:
          name: grade4-english-v2-ws09-publication
          path: build/grade4_english_v2/
          if-no-files-found: error
