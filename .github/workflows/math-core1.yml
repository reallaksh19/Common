name: Mathematics Core 1

on:
  pull_request:
    paths:
      - "Grade 9/skills/grade9-math-core1/**"
      - "Grade 9/Mathematics/Architecture/MATHEMATICS_CORE1_IMPLEMENTATION.md"
      - "Grade 9/Mathematics/Permutations/Core1/**"
      - "Grade 9/install_skills.py"
      - ".github/workflows/math-core1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  math-core1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Core 1 dependencies
        run: python -m pip install -r "Grade 9/skills/grade9-math-core1/requirements.txt"
      - name: Validate shared PR160 v1 contracts
        run: python "Grade 9/Architecture/contracts/v1/validate_contracts.py"
      - name: Validate Mathematics research input
        run: python "Grade 9/skills/grade9-math-core1/scripts/validate_math_research_input.py" "Grade 9/Mathematics/Permutations/Core1/research_input.json"
      - name: Build fresh Mathematics Core 1 package
        run: python "Grade 9/skills/grade9-math-core1/scripts/run_math_core1.py" --input "Grade 9/Mathematics/Permutations/Core1/research_input.json" --out /tmp/math-core1
      - name: Validate fresh package
        run: python "Grade 9/skills/grade9-math-core1/scripts/validate_math_core1_package.py" --dir /tmp/math-core1 --prefix Permutations_Core1
      - name: Materialize generated review package
        run: |
          cp /tmp/math-core1/Permutations_Core1_Research_Bundle.json "Grade 9/Mathematics/Permutations/Core1/"
          cp /tmp/math-core1/Permutations_Core1_Research_Bundle_Manifest.json "Grade 9/Mathematics/Permutations/Core1/"
          cp /tmp/math-core1/Permutations_Core1_Research_Core.md "Grade 9/Mathematics/Permutations/Core1/"
          cp /tmp/math-core1/Permutations_Core1_Research_Core.pdf "Grade 9/Mathematics/Permutations/Core1/"
          cp /tmp/math-core1/Permutations_Core1_Source_Ledger.json "Grade 9/Mathematics/Permutations/Core1/"
      - name: Validate materialized review package
        run: python "Grade 9/skills/grade9-math-core1/scripts/validate_math_core1_package.py" --dir "Grade 9/Mathematics/Permutations/Core1" --prefix Permutations_Core1
      - name: Smoke-test Grade 9 installer
        run: |
          python "Grade 9/install_skills.py" --dest /tmp/grade9-skills
          test -f /tmp/grade9-skills/grade9-math-core1/SKILL.md
      - name: Upload generated Core 1 review package
        uses: actions/upload-artifact@v4
        with:
          name: permutations-core1-research-package
          path: |
            Grade 9/Mathematics/Permutations/Core1/Permutations_Core1_Research_Bundle.json
            Grade 9/Mathematics/Permutations/Core1/Permutations_Core1_Research_Bundle_Manifest.json
            Grade 9/Mathematics/Permutations/Core1/Permutations_Core1_Research_Core.md
            Grade 9/Mathematics/Permutations/Core1/Permutations_Core1_Research_Core.pdf
            Grade 9/Mathematics/Permutations/Core1/Permutations_Core1_Source_Ledger.json
          if-no-files-found: error
      - name: Commit generated review package to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "Grade 9/Mathematics/Permutations/Core1/Permutations_Core1_Research_Bundle.json" \
            "Grade 9/Mathematics/Permutations/Core1/Permutations_Core1_Research_Bundle_Manifest.json" \
            "Grade 9/Mathematics/Permutations/Core1/Permutations_Core1_Research_Core.md" \
            "Grade 9/Mathematics/Permutations/Core1/Permutations_Core1_Research_Core.pdf" \
            "Grade 9/Mathematics/Permutations/Core1/Permutations_Core1_Source_Ledger.json"
          if git diff --cached --quiet; then
            echo "Generated review package already current."
          else
            git commit -m "Math Core1: materialize generated Permutations review package [skip ci]"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
