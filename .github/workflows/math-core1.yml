name: Mathematics Core 1

on:
  pull_request:
    paths:
      - "Grade 9/skills/grade9-math-core1/**"
      - "Grade 9/Mathematics/CORE1_IMPLEMENTATION.md"
      - "Grade 9/Mathematics/Permutations/Core1/**"
      - ".github/workflows/math-core1.yml"
  workflow_dispatch:

jobs:
  math-core1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Core 1 dependencies
        run: python -m pip install -r "Grade 9/skills/grade9-math-core1/requirements.txt"
      - name: Validate shared PR160 v1 contracts
        run: python "Grade 9/Architecture/contracts/v1/validate_contracts.py"
      - name: Validate Mathematics research input
        run: python "Grade 9/skills/grade9-math-core1/scripts/validate_math_research_input.py" "Grade 9/Mathematics/Permutations/Core1/research_input.json"
      - name: Build fresh Mathematics Core 1 package
        run: python "Grade 9/skills/grade9-math-core1/scripts/run_math_core1.py" --input "Grade 9/Mathematics/Permutations/Core1/research_input.json" --out /tmp/math-core1
      - name: Validate fresh package
        run: python "Grade 9/skills/grade9-math-core1/scripts/validate_math_core1_package.py" --dir /tmp/math-core1 --prefix Permutations_Core1
      - name: Validate committed review package
        run: python "Grade 9/skills/grade9-math-core1/scripts/validate_math_core1_package.py" --dir "Grade 9/Mathematics/Permutations/Core1" --prefix Permutations_Core1
