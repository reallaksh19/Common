name: IOQM ALG03 repair render
on:
  push:
    branches: [ioqm-g9-alg03-polynomials]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip alg03]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render tools
        run: |
          pip install reportlab
          sudo apt-get update >/dev/null
          sudo apt-get install -y poppler-utils fonts-dejavu-core >/dev/null
      - name: Repair learner sources and interfaces
        run: python 'Grade 9/Mathematics/IOQM/03_Main_Topics/ALG-03_Polynomials_Roots_Vieta_Remainders/Authoring/repair_alg03_sources.py'
      - name: Render exact PDFs
        run: python 'Grade 9/Mathematics/IOQM/03_Main_Topics/ALG-03_Polynomials_Roots_Vieta_Remainders/Authoring/render_alg03_pdfs.py'
      - name: Exact structural and raster QA
        shell: bash
        run: |
          set -euo pipefail
          ROOT='Grade 9/Mathematics/IOQM/03_Main_Topics/ALG-03_Polynomials_Roots_Vieta_Remainders'
          STUD="$ROOT/PDFs/ALG03_Student_Pack_v1.pdf"
          TEACH="$ROOT/PDFs/ALG03_Teacher_Key_v1.pdf"
          REPORT="$ROOT/Authoring/_render_qa_report.txt"
          pdfinfo "$STUD" >/tmp/alg03-stud.info
          pdftotext -layout "$STUD" /tmp/alg03-stud.txt
          pdfinfo "$TEACH" >/tmp/alg03-teach.info
          pdftotext -layout "$TEACH" /tmp/alg03-teach.txt
          rm -f /tmp/alg03-stud-page-*.pgm /tmp/alg03-teach-page-*.pgm
          pdftoppm -gray -r 36 "$STUD" /tmp/alg03-stud-page >/dev/null
          pdftoppm -gray -r 36 "$TEACH" /tmp/alg03-teach-page >/dev/null
          STUD="$STUD" TEACH="$TEACH" REPORT="$REPORT" python - <<'PY'
          from pathlib import Path
          import hashlib, os, re, subprocess

          stud=Path(os.environ['STUD']); teach=Path(os.environ['TEACH']); report=Path(os.environ['REPORT'])
          text=Path('/tmp/alg03-stud.txt').read_text(errors='replace')
          sinfo=Path('/tmp/alg03-stud.info').read_text(errors='replace')
          tinfo=Path('/tmp/alg03-teach.info').read_text(errors='replace')
          forbidden_re=re.compile(r'(?i)(?<![A-Za-z0-9])(?:H[0-3]|T[234]|WAVE|PR|ISSUE|ALG-01|ALG-02|ALG-03)(?![A-Za-z0-9])')
          forbidden=sorted(set(m.group(0) for m in forbidden_re.finditer(text)))

          p=text.find('Practice and Transfer Bank')
          m=text.find('Independent Mixed Mastery Check')
          nums=lambda s:[int(x) for x in re.findall(r'(?m)^\s*(\d{1,2})\.\s',s)]
          def uniq(xs):
              out=[]
              for x in xs:
                  if x not in out: out.append(x)
              return out
          practice=uniq(nums(text[p:m])) if p>=0 and m>=0 else []
          mastery=uniq(nums(text[m:])) if m>=0 else []

          def read_pgm(path):
              raw=Path(path).read_bytes(); pos=0
              def tok():
                  nonlocal pos
                  while pos<len(raw):
                      if raw[pos:pos+1]==b'#':
                          while pos<len(raw) and raw[pos:pos+1] not in (b'\n',b'\r'): pos+=1
                      elif raw[pos:pos+1].isspace(): pos+=1
                      else: break
                  st=pos
                  while pos<len(raw) and not raw[pos:pos+1].isspace(): pos+=1
                  return raw[st:pos]
              magic=tok(); w=int(tok()); h=int(tok()); maxv=int(tok())
              while pos<len(raw) and raw[pos:pos+1].isspace(): pos+=1
              pix=raw[pos:pos+w*h]
              if magic!=b'P5' or maxv!=255 or len(pix)!=w*h: raise ValueError(path)
              return w,h,pix

          chars=' .:-=+*#%@'
          def raster_group(prefix):
              rows=[]; bounds=True
              pgms=sorted(Path('/tmp').glob(prefix+'*.pgm'))
              for i,path in enumerate(pgms,1):
                  w,h,pix=read_pgm(path)
                  ink=[(j%w,j//w) for j,v in enumerate(pix) if v<245]
                  if not ink:
                      bbox=None; bounds=False
                  else:
                      xs=[q[0] for q in ink]; ys=[q[1] for q in ink]
                      bbox=(min(xs),min(ys),max(xs),max(ys))
                      if bbox[0]<4 or bbox[1]<4 or bbox[2]>w-5 or bbox[3]>h-4: bounds=False
                  thumb=[]; tw,th=58,30
                  for ty in range(th):
                      row=[]; y0=ty*h//th; y1=max(y0+1,(ty+1)*h//th)
                      for tx in range(tw):
                          x0=tx*w//tw; x1=max(x0+1,(tx+1)*w//tw); vals=[]
                          for yy in range(y0,y1): vals.extend(pix[yy*w+x0:yy*w+x1])
                          d=255-sum(vals)/len(vals); row.append(chars[min(len(chars)-1,int(d/256*len(chars)))])
                      thumb.append(''.join(row).rstrip())
                  rows.append((i,w,h,bbox,thumb))
              return pgms,bounds,rows

          spgms,sbounds,srows=raster_group('alg03-stud-page-')
          tpgms,tbounds,trows=raster_group('alg03-teach-page-')
          practice_ok=practice==list(range(1,31))
          mastery_ok=mastery==list(range(1,17))
          overall=(not forbidden) and practice_ok and mastery_ok and sbounds and tbounds and len(spgms)>0 and len(tpgms)>0

          print('QA_DIAGNOSTIC forbidden=',forbidden)
          print('QA_DIAGNOSTIC practice=',practice,'ok=',practice_ok,'markers=',p,m)
          print('QA_DIAGNOSTIC mastery=',mastery,'ok=',mastery_ok)
          print('QA_DIAGNOSTIC student_pages=',len(spgms),'bounds=',sbounds)
          print('QA_DIAGNOSTIC teacher_pages=',len(tpgms),'bounds=',tbounds)

          lines=['ALG-03 EXACT RENDER QA REPORT','================================','']
          for label,path in [('student',stud),('teacher',teach)]:
              b=path.read_bytes()
              lines += [f'{label}_bytes={len(b)}',f'{label}_sha256={hashlib.sha256(b).hexdigest()}',f'{label}_git_blob={subprocess.check_output(["git","hash-object",str(path)],text=True).strip()}']
          lines += ['student_'+x for x in sinfo.splitlines() if x.startswith(('Pages:','Page size:','Encrypted:','Form:'))]
          lines += ['teacher_'+x for x in tinfo.splitlines() if x.startswith(('Pages:','Page size:','Encrypted:','Form:'))]
          lines += [f'forbidden_labels={forbidden or "NONE"}',f'practice_numbers={practice}',f'mastery_numbers={mastery}',f'student_raster_page_count={len(spgms)}',f'student_raster_bounds_pass={sbounds}',f'teacher_raster_page_count={len(tpgms)}',f'teacher_raster_bounds_pass={tbounds}',f'overall_static_render_qa={"PASS" if overall else "FAIL"}','']
          for label,rows in [('STUDENT',srows),('TEACHER',trows)]:
              lines += [label+' PAGE THUMBNAILS','']
              for i,w,h,bbox,thumb in rows:
                  lines += [f'{label} PAGE {i:02d} raster={w}x{h} ink_bbox={bbox}','-'*58,*thumb,'']
          report.write_text('\n'.join(lines)+'\n')
          if not overall: raise SystemExit('ALG-03 exact render QA failed')
          PY
      - name: Commit repaired package and QA evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Grade 9/Mathematics/IOQM/03_Main_Topics/ALG-03_Polynomials_Roots_Vieta_Remainders'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ALG-03: repair learner surfaces, interfaces and exact PDFs [skip alg03]'
          git push
