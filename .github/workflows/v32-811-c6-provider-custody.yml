name: v32-811-c6-provider-custody

on:
  push:
    branches: ['v32/811-c6-c5-provider-artifact-custody']
    paths:
      - '.github/v32-evidence-spine/811-c6-c5-*'
      - '.github/v32-evidence-spine/811_c6_c5_*'
      - '.github/workflows/v32-811-c6-provider-custody.yml'
  pull_request:
    paths:
      - '.github/v32-evidence-spine/811-c6-c5-*'
      - '.github/v32-evidence-spine/811_c6_c5_*'
      - '.github/workflows/v32-811-c6-provider-custody.yml'

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing source schema dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Verify nine golden oracles committed before code
        run: git merge-base --is-ancestor 8211fcb2a64c7d816b6648c395d0276b5b85ec0a HEAD
      - name: Real native GitHub PLAN_HANDOVER writes only two custody files
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python .github/v32-evidence-spine/811_c6_c4_cold_producer.py --out artifacts/c6-c5
          test "$(find artifacts/c6-c5 -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Upload immutable-per-ID GitHub Actions evidence artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: c6-c5-provider-anchored-handover
          path: artifacts/c6-c5/
          if-no-files-found: error
          retention-days: 7
          overwrite: false

  verify:
    runs-on: ubuntu-latest
    needs: produce
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing schema dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Verify GITHUB provider metadata and ZIP hash, then challenge joint forgery
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.produce.outputs.artifact-id }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/v32-evidence-spine/811_c6_c5_provider_anchor.py \
            --artifact-id "$ARTIFACT_ID" --run-id "$RUN_ID" \
            --source-head "$SOURCE_SHA" --dest artifacts/provider-verified \
            2>&1 | tee /tmp/c6-c5-provider.log
          grep -q 'ANCHOR_PROVIDER_RUN_REPO_HEAD_IDENTITY=PASS' /tmp/c6-c5-provider.log
          grep -q 'ANCHOR_GITHUB_ARCHIVE_DIGEST=PASS_PROVIDER_STORED_SHA256' /tmp/c6-c5-provider.log
          grep -q 'ANCHOR_JOINT_FORGERY_PASSES_TWO_FILE_CHECK=PROVEN' /tmp/c6-c5-provider.log
          grep -q 'ANCHOR_JOINT_FORGERY_REJECTED_AGAINST_GITHUB_BYTES=PASS' /tmp/c6-c5-provider.log
          grep -q 'C6_C5_PROVIDER_ANCHORED_CUSTODY=PASS_NOT_OWNER_SIGNED' /tmp/c6-c5-provider.log
      - name: Refuse missing token and forged runtime repository before any network
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.produce.outputs.artifact-id }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=.github/v32-evidence-spine/811_c6_c5_provider_anchor.py
          if env -u GH_TOKEN -u GITHUB_TOKEN python "$SCRIPT" --artifact-id "$ARTIFACT_ID" \
            --run-id "$RUN_ID" --source-head "$SOURCE_SHA" --dest /tmp/no-token > /tmp/no-token.log 2>&1; then
            echo 'ANCHOR_MISSING_TOKEN_FAILED_OPEN'; exit 1
          fi
          grep -q 'ANCHOR_ACTIONS_READ_TOKEN_REQUIRED' /tmp/no-token.log
          if env GITHUB_REPOSITORY=untrusted/repository python "$SCRIPT" --artifact-id "$ARTIFACT_ID" \
            --run-id "$RUN_ID" --source-head "$SOURCE_SHA" --dest /tmp/wrong-repo > /tmp/wrong-repo.log 2>&1; then
            echo 'ANCHOR_WRONG_REPOSITORY_FAILED_OPEN'; exit 1
          fi
          grep -q 'ANCHOR_REPOSITORY_SCOPE_REQUIRED' /tmp/wrong-repo.log
          echo ANCHOR_TOKEN_AND_REPOSITORY_NEGATIVES=PASS
      - name: Independent fresh process performs offline then native GitHub source replay
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=artifacts/provider-verified
          python .github/v32-evidence-spine/811_c6_c4_cold_successor.py --bundle "$BUNDLE" --local-only
          python .github/v32-evidence-spine/811_c6_c4_cold_successor.py --bundle "$BUNDLE" --live | tee /tmp/c6-c5-replay.log
          grep -q 'COLD_LIVE_GITHUB_SOURCE_REPLAY=PASS_CURRENT_READ_ONLY' /tmp/c6-c5-replay.log
          grep -q 'COLD_REVIEWER_OR_MERGE_AUTHORITY=NOT_GRANTED' /tmp/c6-c5-replay.log
          echo C6_C5_PROVIDER_ANCHORED_FRESH_SOURCE_REPLAY=PASS_NO_INDEPENDENT_REVIEW
