name: v32-811-c6-cold-successor

on:
  pull_request:
    paths:
      - '.github/v32-evidence-spine/811-c6-c4-*'
      - '.github/v32-evidence-spine/811_c6_c4_*'
      - '.github/workflows/v32-811-c6-cold-successor.yml'
  push:
    branches: ['v32/811-c6-c4-cold-successor-replay']
    paths:
      - '.github/v32-evidence-spine/811-c6-c4-*'
      - '.github/v32-evidence-spine/811_c6_c4_*'
      - '.github/workflows/v32-811-c6-cold-successor.yml'

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  real-fresh-process-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing schema dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Precommitted golden before any implementation
        run: |
          git merge-base --is-ancestor 7b1dbbaa4f325a92974d576995771daef2c76018 HEAD
          echo COLD_GOLDEN_BEFORE_CODE=PASS
      - name: Process A produces a real committed GitHub-source handover then exits
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p artifacts/cold-handover
          python .github/v32-evidence-spine/811_c6_c4_cold_producer.py --out artifacts/cold-handover
          test "$(find artifacts/cold-handover -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Process B recovers custody from only two archived files OFFLINE
        run: |
          cd artifacts/cold-handover
          python "${GITHUB_WORKSPACE}/.github/v32-evidence-spine/811_c6_c4_cold_successor.py" --bundle . --local-only
      - name: Four local tamper cases must reject before network
        run: |
          python .github/v32-evidence-spine/811_c6_c4_cold_mutations.py --bundle artifacts/cold-handover
      - name: Cold live entry rejects missing token and spoofed repository BEFORE GitHub access
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          BUNDLE=artifacts/cold-handover
          VERIFY=.github/v32-evidence-spine/811_c6_c4_cold_successor.py
          if env -u GH_TOKEN -u GITHUB_TOKEN python "$VERIFY" --bundle "$BUNDLE" --live > /tmp/cold-no-token.log 2>&1; then
            echo 'COLD_MISSING_TOKEN_FAILED_OPEN'; exit 1
          fi
          grep -q 'COLD_GITHUB_TOKEN_OR_REPO_SCOPE_REQUIRED' /tmp/cold-no-token.log
          echo 'COLD_MISSING_TOKEN_FAIL_CLOSED=PASS'
          if env GITHUB_REPOSITORY=wrong/repository python "$VERIFY" --bundle "$BUNDLE" --live > /tmp/cold-wrong-repo.log 2>&1; then
            echo 'COLD_WRONG_REPOSITORY_FAILED_OPEN'; exit 1
          fi
          grep -q 'COLD_GITHUB_TOKEN_OR_REPO_SCOPE_REQUIRED' /tmp/cold-wrong-repo.log
          echo 'COLD_WRONG_REPOSITORY_FAIL_CLOSED=PASS'
      - name: Process C cold re-reads immutable graph and real GitHub provider GET-only
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd artifacts/cold-handover
          python "${GITHUB_WORKSPACE}/.github/v32-evidence-spine/811_c6_c4_cold_successor.py" --bundle . --live | tee ../cold-live.log
          python "${GITHUB_WORKSPACE}/.github/v32-evidence-spine/811_c6_c4_cold_successor.py" --bundle . --live --negative-stale | tee ../cold-negative.log
          grep -q 'COLD_LIVE_GITHUB_SOURCE_REPLAY=PASS_CURRENT_READ_ONLY' ../cold-live.log
          grep -q 'COLD_LIVE_NEGATIVE_STALE_INPUT_REJECTED=PASS' ../cold-negative.log
          grep -q 'COLD_OWNER_CHAT_SOURCE=UNKNOWN' ../cold-live.log
          grep -q 'COLD_REVIEWER_OR_MERGE_AUTHORITY=NOT_GRANTED' ../cold-live.log
          echo 'C6_C4_FRESH_PROCESS_READ_ONLY_COLD_REPLAY=PASS_NO_REVIEW_AUTHORITY'
