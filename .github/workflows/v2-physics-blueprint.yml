name: V2 Physics Blueprint

on:
  pull_request:
    paths:
      - 'Grade 9/V2/Physics/Blueprint/**'
      - 'Grade 9/V2/Physics/Core2A/**'
      - '.github/workflows/v2-physics-blueprint.yml'
  workflow_dispatch:

jobs:
  blueprint-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install jsonschema
      - name: Validate blueprint contracts and role bindings
        run: python "Grade 9/V2/Physics/Blueprint/contracts/validate_contracts.py"
      - name: Run adaptive-routing golden fixtures
        run: python "Grade 9/V2/Physics/Blueprint/engine/run_golden_fixtures.py"
      - name: Run blueprint routing tests
        run: python "Grade 9/V2/Physics/Blueprint/tests/test_blueprint_routing.py"
      - name: Run independent second-pass tests
        run: python "Grade 9/V2/Physics/Blueprint/tests/test_blueprint_independence.py"
      - name: Run Core1 x Core2 Join falsifiers
        run: python "Grade 9/V2/Physics/Blueprint/tests/test_blueprint_join.py"
      - name: Compile Join golden
        run: python "Grade 9/V2/Physics/Blueprint/engine/compile_join.py" "Grade 9/V2/Physics/Blueprint/fixtures/join/join-ready.json" --out /tmp/physics-join.json
      - name: Run learner-purpose control-state falsifiers
        run: python "Grade 9/V2/Physics/Blueprint/tests/test_blueprint_control_state.py"
      - name: Compile learner-purpose control-state golden
        run: python "Grade 9/V2/Physics/Blueprint/engine/resolve_control_state.py" "Grade 9/V2/Physics/Blueprint/fixtures/control-state/m2d-p20-first-study.json" --out /tmp/physics-control-state.json
      - name: Run Core1A state-machine falsifiers
        run: python "Grade 9/V2/Physics/Blueprint/tests/test_blueprint_core1a_stage_machine.py"
      - name: Prove manuscript gate from exact Join and control-state digests
        run: python "Grade 9/V2/Physics/Blueprint/engine/compile_core1a_stage_run.py" "Grade 9/V2/Physics/Blueprint/fixtures/core1a/stage-run-ready.json" --join /tmp/physics-join.json --control-state /tmp/physics-control-state.json --out /tmp/physics-core1a-stage-run.json
      - name: Run Motion-in-a-Plane topic-pilot falsifiers
        run: python "Grade 9/V2/Physics/Blueprint/tests/test_blueprint_topic_pilot.py"
      - name: Validate Motion-in-a-Plane topic blueprint and derived route
        run: python "Grade 9/V2/Physics/Blueprint/engine/validate_topic_blueprint.py" "Grade 9/V2/Physics/Blueprint/topics/motion-in-a-plane.v1.json"
      - name: Run Publication IR lossless-boundary falsifiers
        run: python "Grade 9/V2/Physics/Blueprint/tests/test_blueprint_publication_ir.py"
      - name: Compile lossless Publication IR golden
        run: python "Grade 9/V2/Physics/Blueprint/engine/compile_publication_ir.py" "Grade 9/V2/Physics/Blueprint/fixtures/publication/m2d-core1a-ir.json" --out /tmp/physics-publication-ir.json
