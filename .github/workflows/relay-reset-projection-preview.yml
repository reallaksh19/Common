name: relay-reset-projection-preview
on:
  pull_request:
    paths:
      - 'skills/engineering-relay-v1/projection-preview-v1.*'
      - 'skills/engineering-relay-v1/candidate-verification-v1.*'
      - '.github/workflows/relay-reset-projection-preview.yml'
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
jobs:
  r4-preview:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Real R3 current GitHub source to three same-digest R4 previews
        env:
          RELAY_R4_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELAY_R4_CI_PR_NUMBER: ${{ github.event.number }}
          RELAY_R4_READ_TOKEN: ${{ github.token }}
        run: node --test skills/engineering-relay-v1/projection-preview-v1.test.mjs
