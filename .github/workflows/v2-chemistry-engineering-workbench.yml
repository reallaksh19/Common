name: V2 Chemistry Engineering Workbench

on:
  pull_request:
    paths:
      - 'Grade 9/V2/Chemistry/LearningBlueprint/contracts/chemistry-engineering-*.schema.json'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/contracts/chemistry-product-engineering-custody-v1.schema.json'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/contracts/chemistry-gate-source-audit.schema.json'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/engine/compile_chemistry_engineering_*.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/engine/compile_chemistry_product_engineering_custody.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/engine/validate_cdau_engineering_ready.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/engine/validate_pal_engineering_ready.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/engine/validate_chemistry_engineering_gates_v2.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/engine/validate_chemistry_gate_source_audit.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/fixtures/engineering-workbench/**'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/tests/test_chemistry_engineering_workbench_v1.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/tests/test_chemistry_engineering_authorization_binding.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/tests/test_chemistry_product_engineering_custody.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/tests/test_chemistry_redox_source_hardening.py'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/policies/chemistry-technical-engineering-gates.v1.json'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/policies/chemistry-redox-source-audit.v1.json'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/ENGINEERING_WORKBENCH_V1.md'
      - 'Grade 9/V2/Chemistry/LearningBlueprint/CHEMISTRY_REDOX_SOURCE_HARDENING_V1.md'
      - '.github/workflows/v2-chemistry-engineering-workbench.yml'
  workflow_dispatch:

jobs:
  chemistry-engineering-workbench-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install jsonschema
      - name: Validate Redox source hardening and grade-scope custody
        run: python "Grade 9/V2/Chemistry/LearningBlueprint/tests/test_chemistry_redox_source_hardening.py"
      - name: Validate PR377 Chemistry gates through hardened wrapper
        run: python "Grade 9/V2/Chemistry/LearningBlueprint/engine/validate_chemistry_engineering_gates_v2.py"
      - name: Run Chemistry Engineering Workbench falsifiers
        run: python "Grade 9/V2/Chemistry/LearningBlueprint/tests/test_chemistry_engineering_workbench_v1.py"
      - name: Validate authorization binding
        run: python "Grade 9/V2/Chemistry/LearningBlueprint/tests/test_chemistry_engineering_authorization_binding.py"
      - name: Validate CCBOM to PAL engineering custody
        run: python "Grade 9/V2/Chemistry/LearningBlueprint/tests/test_chemistry_product_engineering_custody.py"
      - name: Validate Redox CDAU through engineering-ready boundary
        run: >-
          python "Grade 9/V2/Chemistry/LearningBlueprint/engine/validate_cdau_engineering_ready.py"
          "fixtures/engineering-workbench/redox-request.v1.json"
          "fixtures/engineering-workbench/redox-manifest.v1.json"
          "golden/v6/cdau-redox.json"
      - name: Compile Redox closure receipt
        run: >-
          python "Grade 9/V2/Chemistry/LearningBlueprint/engine/compile_chemistry_engineering_closure.py"
          "fixtures/engineering-workbench/redox-request.v1.json"
          "fixtures/engineering-workbench/redox-manifest.v1.json"
          --out /tmp/chem-redox-engineering-closure.json
      - name: Compile Redox authorization binding
        run: >-
          python "Grade 9/V2/Chemistry/LearningBlueprint/engine/compile_chemistry_engineering_authorization_binding.py"
          "fixtures/engineering-workbench/redox-request.v1.json"
          "fixtures/engineering-workbench/redox-manifest.v1.json"
          --out /tmp/chem-redox-engineering-binding.json
      - name: Compile Redox product engineering custody
        run: >-
          python "Grade 9/V2/Chemistry/LearningBlueprint/engine/compile_chemistry_product_engineering_custody.py"
          "fixtures/engineering-workbench/redox-request.v1.json"
          "fixtures/engineering-workbench/redox-manifest.v1.json"
          "golden/v7/ccbom-redox.json"
          --out /tmp/chem-redox-product-engineering-custody.json
      - name: Validate PAL against current engineering custody
        run: >-
          python "Grade 9/V2/Chemistry/LearningBlueprint/engine/validate_pal_engineering_ready.py"
          "fixtures/engineering-workbench/redox-request.v1.json"
          "fixtures/engineering-workbench/redox-manifest.v1.json"
          "golden/v7/ccbom-redox.json"
          /tmp/chem-redox-product-engineering-custody.json
      - name: Compile Redox Engineering Passport
        run: >-
          python "Grade 9/V2/Chemistry/LearningBlueprint/engine/compile_chemistry_engineering_passport.py"
          "fixtures/engineering-workbench/redox-request.v1.json"
          /tmp/chem-redox-engineering-closure.json
          --out /tmp/chem-redox-engineering-passport.json
          --markdown-out /tmp/chem-redox-engineering-passport.md
      - name: Publish passport in workflow summary
        run: cat /tmp/chem-redox-engineering-passport.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload closure, binding, product custody and passport proof
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-engineering-workbench-redox
          path: |
            /tmp/chem-redox-engineering-closure.json
            /tmp/chem-redox-engineering-binding.json
            /tmp/chem-redox-product-engineering-custody.json
            /tmp/chem-redox-engineering-passport.json
            /tmp/chem-redox-engineering-passport.md
          if-no-files-found: error
          retention-days: 14
