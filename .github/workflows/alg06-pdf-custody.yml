name: ALG-06 PDF Custody

on:
  push:
    branches: [ioqm-g9-alg06-radicals-logs]
    paths:
      - '.github/workflows/alg06-pdf-custody.yml'

permissions:
  contents: write

jobs:
  render-and-custody:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ioqm-g9-alg06-radicals-logs
          fetch-depth: 0

      - name: Install render dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra fonts-dejavu-core fonts-dejavu-extra poppler-utils

      - name: Render canonical PDFs
        shell: bash
        run: |
          set -euo pipefail
          TOPIC='Grade 9/Mathematics/IOQM/03_Main_Topics/ALG-06_Exponents_Radicals_Logarithms'
          python "$TOPIC/Authoring/render_alg06_pdfs.py"
          test -s "$TOPIC/PDFs/ALG06_Student_Pack_v1.pdf"
          test -s "$TOPIC/PDFs/ALG06_Teacher_Key_v1.pdf"

      - name: Structural preflight and learner scrub
        shell: bash
        run: |
          set -euo pipefail
          TOPIC='Grade 9/Mathematics/IOQM/03_Main_Topics/ALG-06_Exponents_Radicals_Logarithms'
          STUDENT="$TOPIC/PDFs/ALG06_Student_Pack_v1.pdf"
          TEACHER="$TOPIC/PDFs/ALG06_Teacher_Key_v1.pdf"
          test "$(pdfinfo "$STUDENT" | awk '/^Pages:/ {print $2}')" = '14'
          test "$(pdfinfo "$TEACHER" | awk '/^Pages:/ {print $2}')" = '5'
          pdfinfo "$STUDENT" | grep -q '^Encrypted:       no'
          pdfinfo "$TEACHER" | grep -q '^Encrypted:       no'
          pdftotext "$STUDENT" /tmp/student.txt
          pdftotext "$TEACHER" /tmp/teacher.txt
          ! grep -Eqi 'ALG-06|issue #[0-9]+|pull request|PR #[0-9]+|branch|microstream|interface|metadata schema|H[0-3]|F[0-4]|DRAFT_AUTHORING' /tmp/student.txt
          grep -q 'Exponents, Radicals' /tmp/student.txt
          grep -q 'Teacher' /tmp/teacher.txt

      - name: Write custody manifest
        shell: bash
        run: |
          set -euo pipefail
          TOPIC='Grade 9/Mathematics/IOQM/03_Main_Topics/ALG-06_Exponents_Radicals_Logarithms'
          STUDENT="$TOPIC/PDFs/ALG06_Student_Pack_v1.pdf"
          TEACHER="$TOPIC/PDFs/ALG06_Teacher_Key_v1.pdf"
          S_SHA=$(sha256sum "$STUDENT" | awk '{print $1}')
          T_SHA=$(sha256sum "$TEACHER" | awk '{print $1}')
          S_SIZE=$(stat -c '%s' "$STUDENT")
          T_SIZE=$(stat -c '%s' "$TEACHER")
          cat > "$TOPIC/PDF_Custody.md" <<EOF
          # ALG-06 PDF Custody

          Status: \`RENDERED_PREFLIGHTED_REPOSITORY_CUSTODY_PENDING_LOCAL_VISUAL_CONFIRMATION\`

          Canonical renderer: \`Authoring/render_alg06_pdfs.py\`
          Source render commit: \`${GITHUB_SHA}\`

          | Artifact | Pages | Bytes | SHA-256 |
          |---|---:|---:|---|
          | \`PDFs/ALG06_Student_Pack_v1.pdf\` | 14 | ${S_SIZE} | \`${S_SHA}\` |
          | \`PDFs/ALG06_Teacher_Key_v1.pdf\` | 5 | ${T_SIZE} | \`${T_SHA}\` |

          Automated checks in this run:
          - A4 page-count contract: PASS (student 14, teacher 5)
          - open/text extraction: PASS via \`pdfinfo\` and \`pdftotext\`
          - encryption: PASS_NONE
          - learner control-plane scrub: PASS_STATIC
          - visual inspection of these exact GitHub-run binaries: PENDING until artifact retrieval and page-render inspection

          Classroom timing/readability, retention, psychometrics, qualification/pass-mark calibration, and publication approval remain \`NOT_RUN\`.
          EOF

      - name: Commit binary custody artifacts
        shell: bash
        run: |
          set -euo pipefail
          TOPIC='Grade 9/Mathematics/IOQM/03_Main_Topics/ALG-06_Exponents_Radicals_Logarithms'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TOPIC/PDFs/ALG06_Student_Pack_v1.pdf" "$TOPIC/PDFs/ALG06_Teacher_Key_v1.pdf" "$TOPIC/PDF_Custody.md"
          git commit -m 'ALG-06: add benchmark PDF custody artifacts'
          git push origin HEAD:ioqm-g9-alg06-radicals-logs

      - name: Upload exact custody artifact
        uses: actions/upload-artifact@v4
        with:
          name: alg06-pdf-custody
          path: |
            Grade 9/Mathematics/IOQM/03_Main_Topics/ALG-06_Exponents_Radicals_Logarithms/PDFs/ALG06_Student_Pack_v1.pdf
            Grade 9/Mathematics/IOQM/03_Main_Topics/ALG-06_Exponents_Radicals_Logarithms/PDFs/ALG06_Teacher_Key_v1.pdf
            Grade 9/Mathematics/IOQM/03_Main_Topics/ALG-06_Exponents_Radicals_Logarithms/PDF_Custody.md
          if-no-files-found: error
          retention-days: 30
