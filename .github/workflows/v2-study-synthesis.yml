name: V2 Study Synthesis

on:
  pull_request:
    paths:
      - 'Grade 9/V2/StudySynthesis/**'
      - '.github/workflows/v2-study-synthesis.yml'

jobs:
  study-synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Validate V2-04 schemas and fixtures
        run: python "Grade 9/V2/StudySynthesis/contracts/validate_contracts.py"
      - name: Run Study Synthesis falsifiers
        run: python "Grade 9/V2/StudySynthesis/tests/test_study_synthesis.py"
      - name: Deterministic replay
        run: |
          python "Grade 9/V2/StudySynthesis/engine/synthesize_study_model.py" \
            --fixture-root "Grade 9/V2/StudySynthesis/fixtures" > /tmp/a.json
          python "Grade 9/V2/StudySynthesis/engine/synthesize_study_model.py" \
            --fixture-root "Grade 9/V2/StudySynthesis/fixtures" > /tmp/b.json
          cmp /tmp/a.json /tmp/b.json
