name: Build Mathematics Review Cores

on:
  push:
    branches: [main]
    paths:
      - 'Review Cores/math/equidistant-point-on-axis/generate_review_pack.py'
      - '.github/workflows/build-review-cores-math.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-review-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependency
        run: python -m pip install 'reportlab>=4.0'
      - name: Generate six-core review PDFs
        run: |
          python 'Review Cores/math/equidistant-point-on-axis/generate_review_pack.py' \
            'Review Cores/math/equidistant-point-on-axis'
      - name: Commit generated review artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Review Cores/math/equidistant-point-on-axis'
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Build Mathematics six-core review PDFs [skip ci]'
            git push origin HEAD:main
          fi
