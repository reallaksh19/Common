name: IOQM COMB01 canonical build
on:
  push:
    branches: [ioqm-g9-comb01-counting]
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip comb01]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render tools
        run: |
          pip install reportlab
          sudo apt-get update >/dev/null
          sudo apt-get install -y poppler-utils fonts-dejavu-core >/dev/null
      - name: Build canonical source package
        run: python 'Grade 9/Mathematics/IOQM/03_Main_Topics/COMB-01_Basic_Counting_Restrictions_Inclusion_Exclusion/Authoring/build_comb01_package.py'
      - name: Validate static schema and provider contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT='Grade 9/Mathematics/IOQM/03_Main_Topics/COMB-01_Basic_Counting_Restrictions_Inclusion_Exclusion'
          ROOT="$ROOT" python - <<'PY'
          from pathlib import Path
          import csv, os, re
          root=Path(os.environ['ROOT'])
          # Frozen metadata width.
          rows=list(csv.reader((root/'Item_Metadata.csv').open()))
          if len(rows)<2 or len(rows[0])!=31 or any(len(r)!=31 for r in rows):
              raise SystemExit('metadata schema width failure')
          if len(rows)-1 != 53:
              raise SystemExit(f'unexpected metadata row count: {len(rows)-1}')
          # Seven separate A-P interfaces.
          interfaces=sorted((root/'Authoring').glob('IOQM-G9-COMB-01__W1-?__*__interface.md'))
          if len(interfaces)!=7: raise SystemExit(f'interface count {len(interfaces)}')
          for p in interfaces:
              s=p.read_text()
              for letter in 'ABCDEFGHIJKLMNOP':
                  if not re.search(rf'^## {letter}\.',s,re.M):
                      raise SystemExit(f'{p.name}: missing section {letter}')
          idx=(root/'Authoring/Microstream_Interfaces.md').read_text()
          if 'INDEX_ONLY__NOT_INTERFACE_AUTHORITY' not in idx: raise SystemExit('consolidated interface not index-only')
          # COMB-03 acceptance contract payload.
          provider=(root/'Authoring/COMB01_Stable_Counting_Model_Interface_v1.md').read_text()
          for i in range(1,11):
              if f'C01-{i}' not in provider: raise SystemExit(f'missing C01-{i}')
          for i in range(1,7):
              if f'T{i} ' not in provider and f'T{i} —' not in provider: raise SystemExit(f'missing T{i}')
          # Learner source hygiene before rendering.
          forbidden=re.compile(r'(?i)(?<![A-Za-z0-9])(?:H[0-3]|T[234]|WAVE|PR|ISSUE|COMB-01|COMB-02|COMB-03|NT-05)(?![A-Za-z0-9])')
          for name in ['02_Assimilation_Book.md','03_First_Step_Reference.md','04_Recognition_and_First_Line_Lab.md','05_Practice_and_Transfer_Bank.md','06_H0_Mastery_Test.md']:
              hits=sorted(set(m.group(0) for m in forbidden.finditer((root/name).read_text())))
              if hits: raise SystemExit(f'{name} learner leakage: {hits}')
          print('STATIC_SCHEMA_PROVIDER_HYGIENE=PASS')
          PY
      - name: Render deterministic PDFs
        run: python 'Grade 9/Mathematics/IOQM/03_Main_Topics/COMB-01_Basic_Counting_Restrictions_Inclusion_Exclusion/Authoring/render_comb01_pdfs.py'
      - name: Exact structural and raster QA
        shell: bash
        run: |
          set -euo pipefail
          ROOT='Grade 9/Mathematics/IOQM/03_Main_Topics/COMB-01_Basic_Counting_Restrictions_Inclusion_Exclusion'
          STUD="$ROOT/PDFs/COMB01_Student_Pack_v1.pdf"
          TEACH="$ROOT/PDFs/COMB01_Teacher_Key_v1.pdf"
          REPORT="$ROOT/Authoring/_render_qa_report.txt"
          pdfinfo "$STUD" >/tmp/comb01-stud.info
          pdftotext -layout "$STUD" /tmp/comb01-stud.txt
          pdfinfo "$TEACH" >/tmp/comb01-teach.info
          pdftotext -layout "$TEACH" /tmp/comb01-teach.txt
          rm -f /tmp/comb01-stud-page-*.pgm /tmp/comb01-teach-page-*.pgm
          pdftoppm -gray -r 36 "$STUD" /tmp/comb01-stud-page >/dev/null
          pdftoppm -gray -r 36 "$TEACH" /tmp/comb01-teach-page >/dev/null
          STUD="$STUD" TEACH="$TEACH" REPORT="$REPORT" python - <<'PY'
          from pathlib import Path
          import hashlib, os, re, subprocess
          stud=Path(os.environ['STUD']); teach=Path(os.environ['TEACH']); report=Path(os.environ['REPORT'])
          text=Path('/tmp/comb01-stud.txt').read_text(errors='replace')
          sinfo=Path('/tmp/comb01-stud.info').read_text(errors='replace')
          tinfo=Path('/tmp/comb01-teach.info').read_text(errors='replace')
          forbidden_re=re.compile(r'(?i)(?<![A-Za-z0-9])(?:H[0-3]|T[234]|WAVE|PR|ISSUE|COMB-01|COMB-02|COMB-03|NT-05)(?![A-Za-z0-9])')
          forbidden=sorted(set(m.group(0) for m in forbidden_re.finditer(text)))
          p=text.find('Practice and Transfer Bank'); m=text.find('Independent Mixed Mastery Check')
          nums=lambda s:[int(x) for x in re.findall(r'(?m)^\s*(\d{1,2})\.\s',s)]
          def uniq(xs):
              out=[]
              for x in xs:
                  if x not in out: out.append(x)
              return out
          practice=uniq(nums(text[p:m])) if p>=0 and m>=0 else []
          mastery=uniq(nums(text[m:])) if m>=0 else []
          def read_pgm(path):
              raw=Path(path).read_bytes(); pos=0
              def tok():
                  nonlocal pos
                  while pos<len(raw):
                      if raw[pos:pos+1]==b'#':
                          while pos<len(raw) and raw[pos:pos+1] not in (b'\n',b'\r'): pos+=1
                      elif raw[pos:pos+1].isspace(): pos+=1
                      else: break
                  st=pos
                  while pos<len(raw) and not raw[pos:pos+1].isspace(): pos+=1
                  return raw[st:pos]
              magic=tok(); w=int(tok()); h=int(tok()); maxv=int(tok())
              while pos<len(raw) and raw[pos:pos+1].isspace(): pos+=1
              pix=raw[pos:pos+w*h]
              if magic!=b'P5' or maxv!=255 or len(pix)!=w*h: raise ValueError(path)
              return w,h,pix
          chars=' .:-=+*#%@'
          def raster(prefix):
              pgms=sorted(Path('/tmp').glob(prefix+'*.pgm')); bounds=True; rows=[]
              for i,path in enumerate(pgms,1):
                  w,h,pix=read_pgm(path); ink=[(j%w,j//w) for j,v in enumerate(pix) if v<245]
                  if not ink: bbox=None; bounds=False
                  else:
                      xs=[q[0] for q in ink]; ys=[q[1] for q in ink]; bbox=(min(xs),min(ys),max(xs),max(ys))
                      if bbox[0]<4 or bbox[1]<4 or bbox[2]>w-5 or bbox[3]>h-4: bounds=False
                  tw,th=58,28; thumb=[]
                  for ty in range(th):
                      row=[]; y0=ty*h//th; y1=max(y0+1,(ty+1)*h//th)
                      for tx in range(tw):
                          x0=tx*w//tw; x1=max(x0+1,(tx+1)*w//tw); vals=[]
                          for yy in range(y0,y1): vals.extend(pix[yy*w+x0:yy*w+x1])
                          d=255-sum(vals)/len(vals); row.append(chars[min(len(chars)-1,int(d/256*len(chars)))])
                      thumb.append(''.join(row).rstrip())
                  rows.append((i,w,h,bbox,thumb))
              return pgms,bounds,rows
          spgms,sbounds,srows=raster('comb01-stud-page-'); tpgms,tbounds,trows=raster('comb01-teach-page-')
          # Footer-only page protection: strip repeated footer/control text and require substantive page text.
          pages=text.split('\f'); substantive=[]
          for page in pages:
              if not page.strip(): continue
              q=re.sub(r'IOQM Grade 9 \| Basic Counting','',page)
              q=re.sub(r'Page\s+\d+','',q)
              substantive.append(len(re.sub(r'\s+','',q)))
          page_text_ok=bool(substantive) and min(substantive)>=15
          practice_ok=practice==list(range(1,31)); mastery_ok=mastery==list(range(1,17))
          overall=(not forbidden) and practice_ok and mastery_ok and sbounds and tbounds and len(spgms)>0 and len(tpgms)>0 and page_text_ok
          lines=['COMB-01 EXACT RENDER QA REPORT','=================================','']
          for label,path in [('student',stud),('teacher',teach)]:
              b=path.read_bytes(); lines += [f'{label}_bytes={len(b)}',f'{label}_sha256={hashlib.sha256(b).hexdigest()}',f'{label}_git_blob={subprocess.check_output(["git","hash-object",str(path)],text=True).strip()}']
          lines += ['student_'+x for x in sinfo.splitlines() if x.startswith(('Pages:','Page size:','Encrypted:','Form:'))]
          lines += ['teacher_'+x for x in tinfo.splitlines() if x.startswith(('Pages:','Page size:','Encrypted:','Form:'))]
          lines += [f'forbidden_labels={forbidden or "NONE"}',f'practice_numbers={practice}',f'mastery_numbers={mastery}',f'student_raster_page_count={len(spgms)}',f'student_raster_bounds_pass={sbounds}',f'teacher_raster_page_count={len(tpgms)}',f'teacher_raster_bounds_pass={tbounds}',f'student_substantive_text_counts={substantive}',f'student_no_footer_only_pages={page_text_ok}',f'overall_static_render_qa={"PASS" if overall else "FAIL"}','']
          for label,rows in [('STUDENT',srows),('TEACHER',trows)]:
              lines += [label+' PAGE THUMBNAILS','']
              for i,w,h,bbox,thumb in rows: lines += [f'{label} PAGE {i:02d} raster={w}x{h} ink_bbox={bbox}','-'*58,*thumb,'']
          report.write_text('\n'.join(lines)+'\n')
          if not overall: raise SystemExit('COMB-01 exact render QA failed')
          PY
      - name: Commit canonical package and exact QA evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Grade 9/Mathematics/IOQM/03_Main_Topics/COMB-01_Basic_Counting_Restrictions_Inclusion_Exclusion'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'COMB-01: build canonical provider and exact PDFs [skip comb01]'
          git push
