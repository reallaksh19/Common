name: IOQM coverage hardening PDF audit

on:
  push:
    branches:
      - ioqm-g9-coverage-proof-euclid-euler

permissions:
  contents: read

jobs:
  render-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install render and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra fonts-dejavu-core fonts-dejavu-extra poppler-utils python3-pip
          python3 -m pip install --break-system-packages pypdf

      - name: Render canonical PDFs
        run: |
          python3 "Grade 9/Mathematics/IOQM/00_Architecture/render_coverage_hardening_pdfs.py"

      - name: Structural preflight and learner scrub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from pypdf import PdfReader

          specs = [
              (Path("Grade 9/Mathematics/IOQM/03_Main_Topics/NT-01_Divisibility_GCD_LCM/PDFs/NT01_Student_Pack_v1.pdf"), True),
              (Path("Grade 9/Mathematics/IOQM/03_Main_Topics/NT-01_Divisibility_GCD_LCM/PDFs/NT01_Teacher_Key_v1.pdf"), False),
              (Path("Grade 9/Mathematics/IOQM/03_Main_Topics/NT-02_Modular_Arithmetic_Residues/PDFs/NT02_Student_Pack_v1.pdf"), True),
              (Path("Grade 9/Mathematics/IOQM/03_Main_Topics/NT-02_Modular_Arithmetic_Residues/PDFs/NT02_Teacher_Key_v1.pdf"), False),
          ]
          forbidden = re.compile(r"\b(PR\s*#?\d+|Issue\s*#?\d+|WAVE\d*|H[0-3]|T[0-4]|ioqm-g9-coverage-proof-euclid-euler|BENCHMARK_READY|PASS_STATIC)\b", re.I)
          for path, learner in specs:
              assert path.exists() and path.stat().st_size > 1000, path
              r = PdfReader(str(path))
              assert not r.is_encrypted, path
              assert len(r.pages) >= 2, (path, len(r.pages))
              text = "\n".join((p.extract_text() or "") for p in r.pages)
              assert len(text.strip()) > 500, path
              for p in r.pages:
                  box = p.mediabox
                  w = float(box.width); h = float(box.height)
                  assert abs(w - 612) < 2 and abs(h - 792) < 2, (path, w, h)
              if learner:
                  hits = forbidden.findall(text)
                  assert not hits, (path, hits[:10])
              print(path, "pages=", len(r.pages), "bytes=", path.stat().st_size, "learner=", learner)
          PY

      - name: Inventory theorem bridges
        run: |
          pdftotext "Grade 9/Mathematics/IOQM/03_Main_Topics/NT-01_Divisibility_GCD_LCM/PDFs/NT01_Student_Pack_v1.pdf" - | grep -F "Euclid's Lemma"
          pdftotext "Grade 9/Mathematics/IOQM/03_Main_Topics/NT-02_Modular_Arithmetic_Residues/PDFs/NT02_Student_Pack_v1.pdf" - | grep -F "Euler's theorem"
          pdftotext "Grade 9/Mathematics/IOQM/03_Main_Topics/NT-02_Modular_Arithmetic_Residues/PDFs/NT02_Student_Pack_v1.pdf" - | grep -F "Fermat's little theorem"

      - name: Write candidate manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          from pypdf import PdfReader
          paths = [
              Path("Grade 9/Mathematics/IOQM/03_Main_Topics/NT-01_Divisibility_GCD_LCM/PDFs/NT01_Student_Pack_v1.pdf"),
              Path("Grade 9/Mathematics/IOQM/03_Main_Topics/NT-01_Divisibility_GCD_LCM/PDFs/NT01_Teacher_Key_v1.pdf"),
              Path("Grade 9/Mathematics/IOQM/03_Main_Topics/NT-02_Modular_Arithmetic_Residues/PDFs/NT02_Student_Pack_v1.pdf"),
              Path("Grade 9/Mathematics/IOQM/03_Main_Topics/NT-02_Modular_Arithmetic_Residues/PDFs/NT02_Teacher_Key_v1.pdf"),
          ]
          out = Path("coverage-hardening-manifest.txt")
          with out.open("w", encoding="utf-8") as f:
              for p in paths:
                  data = p.read_bytes()
                  f.write(f"{p.name}\tpages={len(PdfReader(str(p)).pages)}\tbytes={len(data)}\tsha256={hashlib.sha256(data).hexdigest()}\n")
          print(out.read_text())
          PY

      - name: Stage audit artifact
        run: |
          mkdir -p audit-artifact/NT01 audit-artifact/NT02
          cp "Grade 9/Mathematics/IOQM/03_Main_Topics/NT-01_Divisibility_GCD_LCM/PDFs/NT01_Student_Pack_v1.pdf" audit-artifact/NT01/
          cp "Grade 9/Mathematics/IOQM/03_Main_Topics/NT-01_Divisibility_GCD_LCM/PDFs/NT01_Teacher_Key_v1.pdf" audit-artifact/NT01/
          cp "Grade 9/Mathematics/IOQM/03_Main_Topics/NT-02_Modular_Arithmetic_Residues/PDFs/NT02_Student_Pack_v1.pdf" audit-artifact/NT02/
          cp "Grade 9/Mathematics/IOQM/03_Main_Topics/NT-02_Modular_Arithmetic_Residues/PDFs/NT02_Teacher_Key_v1.pdf" audit-artifact/NT02/
          cp coverage-hardening-manifest.txt audit-artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: ioqm-coverage-hardening-pdf-audit
          path: audit-artifact/
          if-no-files-found: error
