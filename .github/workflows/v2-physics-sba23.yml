name: V2 Physics SBA23 Source Gate

on:
  pull_request:
    paths:
      - 'Grade 9/V2/Physics/Core1A/**'
      - 'Grade 9/V2/Physics/Core1B/**'
      - '.github/workflows/v2-physics-sba23.yml'
  workflow_dispatch:

jobs:
  sba23-source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install jsonschema
      - name: Run SBA23 exact-source integrity gate
        run: python 'Grade 9/V2/Physics/Core1A/tests/test_physics_core1a_sba23_source_gate.py'
      - name: Run Core1B moving-launcher process golden
        run: python 'Grade 9/V2/Physics/Core1B/tests/test_core1b_moving_launcher_process_golden.py'
      - name: Validate SBA23 JSON artifacts
        run: |
          python -m json.tool 'Grade 9/V2/Physics/Core1A/registry/physics-core1a-motion-in-a-plane-sba23-source-audit-v1.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Physics/Core1A/registry/physics-core1a-motion-in-a-plane-sba23-teaching-plan-v1.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Physics/Core1A/registry/physics-core1a-motion-in-a-plane-sba23-transfer-v1.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Physics/Core1A/registry/build-manifests/M2D-SBA-23-v1.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Physics/Core1B/registry/moving-launcher-atoms-v1.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Physics/Core1B/golden/moving-launcher/core1a-authority.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Physics/Core1B/golden/moving-launcher/core1b-unit.json' > /dev/null
          python -m json.tool 'Grade 9/V2/Physics/Core1B/golden/moving-launcher/observed-events.json' > /dev/null
