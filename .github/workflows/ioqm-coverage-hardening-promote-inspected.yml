name: Promote inspected IOQM coverage-hardening artifact

on:
  push:
    branches:
      - ioqm-g9-coverage-proof-euclid-euler

permissions:
  actions: read
  contents: write

jobs:
  promote:
    if: "${{ !contains(github.event.head_commit.message, '[artifact-custody]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download exact inspected run-4 artifact
        uses: actions/download-artifact@v4
        with:
          name: ioqm-coverage-hardening-pdf-audit
          path: inspected-artifact
          run-id: 33771692797
          github-token: ${{ github.token }}

      - name: Promote exact inspected PDF bytes
        run: |
          cp inspected-artifact/NT01/NT01_Student_Pack_v1.pdf "Grade 9/Mathematics/IOQM/03_Main_Topics/NT-01_Divisibility_GCD_LCM/PDFs/NT01_Student_Pack_v1.pdf"
          cp inspected-artifact/NT01/NT01_Teacher_Key_v1.pdf "Grade 9/Mathematics/IOQM/03_Main_Topics/NT-01_Divisibility_GCD_LCM/PDFs/NT01_Teacher_Key_v1.pdf"
          cp inspected-artifact/NT02/NT02_Student_Pack_v1.pdf "Grade 9/Mathematics/IOQM/03_Main_Topics/NT-02_Modular_Arithmetic_Residues/PDFs/NT02_Student_Pack_v1.pdf"
          cp inspected-artifact/NT02/NT02_Teacher_Key_v1.pdf "Grade 9/Mathematics/IOQM/03_Main_Topics/NT-02_Modular_Arithmetic_Residues/PDFs/NT02_Teacher_Key_v1.pdf"
          sha256sum inspected-artifact/NT01/*.pdf inspected-artifact/NT02/*.pdf

      - name: Commit inspected artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Grade 9/Mathematics/IOQM/03_Main_Topics/NT-01_Divisibility_GCD_LCM/PDFs" \
                  "Grade 9/Mathematics/IOQM/03_Main_Topics/NT-02_Modular_Arithmetic_Residues/PDFs"
          if git diff --cached --quiet; then
            echo "No PDF changes to promote"
            exit 0
          fi
          git commit -m "artifact-custody: promote inspected coverage PDFs [artifact-custody]"
          git push origin HEAD:ioqm-g9-coverage-proof-euclid-euler
