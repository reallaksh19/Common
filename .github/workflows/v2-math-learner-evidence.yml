name: V2 Mathematics Learner Evidence M-E
on:
  pull_request:
    paths:
      - 'Grade 9/V2/Mathematics/LearnerIntelligence/**'
      - 'Grade 9/V2/Mathematics/AssessmentIntake/**'
      - 'Grade 9/V2/Mathematics/AssessmentReview/**'
      - 'Grade 9/V2/Mathematics/AssessmentScope/**'
      - 'Grade 9/V2/Mathematics/ProblemSemantics/**'
      - '.github/workflows/v2-math-learner-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math-learner-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.20,<5'
      - name: Validate M-E contracts against merged Mathematics authorities
        run: python 'Grade 9/V2/Mathematics/LearnerIntelligence/contracts/validate_contracts.py'
      - name: Run M-E learner-evidence falsifiers
        run: python 'Grade 9/V2/Mathematics/LearnerIntelligence/tests/test_math_learner_intelligence.py'
      - name: Deterministic attempt-present replay
        run: |
          L='Grade 9/V2/Mathematics/LearnerIntelligence'
          M='Grade 9/V2/Mathematics'
          run_me() {
            python "$L/engine/derive_math_learner_state.py" \
              --questions "$M/AssessmentIntake/fixtures/mixed-grade9-question-set.fixture.json" \
              --reviews "$M/AssessmentReview/registry/assessment-item-validity-registry.json" \
              --authority "$M/AssessmentScope/authority/math-assessment-scope-authority.json" \
              --item-semantics "$M/ProblemSemantics/registry/mixed-grade9-item-semantics.json" \
              --observation-registry "$L/registry/math-observation-type-registry.json" \
              --attempts "$M/AssessmentIntake/fixtures/mixed-grade9-attempt-set.fixture.json" \
              --reviewed-observations "$L/fixtures/reviewed-observations.fixture.json" \
              --out "$1"
          }
          run_me /tmp/me-a.json
          run_me /tmp/me-b.json
          cmp /tmp/me-a.json /tmp/me-b.json
      - name: Prove no-attempt branch and scope invariance
        run: |
          L='Grade 9/V2/Mathematics/LearnerIntelligence'
          M='Grade 9/V2/Mathematics'
          python "$L/engine/derive_math_learner_state.py" \
            --questions "$M/AssessmentIntake/fixtures/mixed-grade9-question-set.fixture.json" \
            --reviews "$M/AssessmentReview/registry/assessment-item-validity-registry.json" \
            --authority "$M/AssessmentScope/authority/math-assessment-scope-authority.json" \
            --item-semantics "$M/ProblemSemantics/registry/mixed-grade9-item-semantics.json" \
            --observation-registry "$L/registry/math-observation-type-registry.json" \
            --out /tmp/me-none.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/me-a.json'))['learner_state_snapshot']
          n=json.load(open('/tmp/me-none.json'))['learner_state_snapshot']
          assert a['scope_fingerprint']==n['scope_fingerprint']
          assert n['attempt_mode']=='ABSENT'
          assert all(x['readiness']=='UNKNOWN' for x in n['capability_states'])
          print('MATH M-E scope invariance + NO_ATTEMPT != WEAK PASS')
          PY
