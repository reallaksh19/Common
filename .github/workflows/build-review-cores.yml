name: Build Review Cores PDFs

on:
  push:
    paths:
      - 'Review Cores/build_review_cores.py'
      - '.github/workflows/build-review-cores.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: pip install reportlab pypdf
      - name: Build six-layer review pack
        run: python 'Review Cores/build_review_cores.py'
      - name: Commit generated PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Review Cores/'*.pdf
          if git diff --cached --quiet; then
            echo 'No PDF changes.'
          else
            git commit -m 'Build six-layer Review Cores sample PDFs [skip ci]'
            git push
          fi
