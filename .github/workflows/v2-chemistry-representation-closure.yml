name: V2 Chemistry Representation Closure C-H

on:
  push:
    branches:
      - chemistry-v2-c-h-representation-closure
    paths:
      - 'Grade 9/V2/Chemistry/Representation/**'
      - '.github/workflows/v2-chemistry-representation-closure.yml'
  pull_request:
    paths:
      - 'Grade 9/V2/Chemistry/Representation/**'
      - 'Grade 9/V2/Chemistry/CoreAuthoring/**'
      - 'Grade 9/V2/Chemistry/LearnerStudy/**'
      - 'Grade 9/V2/Chemistry/ReasoningSemantics/**'
      - '.github/workflows/v2-chemistry-representation-closure.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema
      - name: Validate C-H contracts and registries
        run: python 'Grade 9/V2/Chemistry/Representation/contracts/validate_contracts.py'
      - name: Run C-H representation falsifiers
        run: python 'Grade 9/V2/Chemistry/Representation/tests/test_chemistry_representations.py'
