name: V2 Chemistry Learning Blueprint v7 Product Assurance

on:
  pull_request:
    paths:
      - 'Grade 9/V2/Chemistry/LearningBlueprint/**'
      - '.github/workflows/v2-chemistry-learning-blueprint-v7.yml'
  workflow_dispatch:

jobs:
  validate-v7-product-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engineering validation dependencies
        run: pip install jsonschema

      - name: Validate v7 JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('Grade 9/V2/Chemistry/LearningBlueprint')
          paths = [
              root/'policies/v7-product-assurance-policy.json',
              root/'policies/v7-core1a-study-note-sufficiency-policy.json',
              root/'policies/chemistry-technical-engineering-gates.v1.json',
              root/'policies/chemistry-redox-source-audit.v1.json',
              root/'contracts/chemistry-technical-engineering-gate.schema.json',
              root/'contracts/chemistry-gate-source-audit.schema.json',
              root/'contracts/content-bill-of-materials-v7.schema.json',
              root/'contracts/core1a-study-note-authority-v7.schema.json',
              root/'contracts/question-custody-v7.schema.json',
              root/'contracts/product-assurance-v7.schema.json',
              root/'contracts/badge-taxonomy-v7.schema.json',
              root/'PRODUCT_ASSURANCE_INVARIANTS_V7.json',
              *sorted((root/'golden/v7').glob('*.json')),
          ]
          for p in paths:
              json.loads(p.read_text(encoding='utf-8'))
              print('JSON OK', p)
          PY

      - name: Validate Chemistry Technical Engineering Gate Registry and falsifiers
        run: python "Grade 9/V2/Chemistry/LearningBlueprint/tests/test_chemistry_engineering_gates.py"

      - name: Validate Redox source hardening and grade-scope custody
        run: python "Grade 9/V2/Chemistry/LearningBlueprint/tests/test_chemistry_redox_source_hardening.py"

      - name: Run v7 assurance falsifiers
        run: |
          python -m unittest 'Grade 9/V2/Chemistry/LearningBlueprint/tests/test_blueprint_v7_product_assurance.py' -v
          python -m unittest 'Grade 9/V2/Chemistry/LearningBlueprint/tests/test_core1a_study_note_v7.py' -v

      - name: Validate CCBOM and Core1A study-note authority
        run: |
          ROOT='Grade 9/V2/Chemistry/LearningBlueprint'
          V="$ROOT/engine/validate_blueprint_v7.py"
          P="$ROOT/policies/v7-product-assurance-policy.json"
          python "$V" --policy "$P" --ccbom "$ROOT/golden/v7/ccbom-redox.json"
          python "$ROOT/engine/validate_core1a_study_note_v7.py" \
            --policy "$ROOT/policies/v7-core1a-study-note-sufficiency-policy.json" \
            --authority "$ROOT/golden/v7/core1a-study-note-redox-authority.json" \
            --ccbom "$ROOT/golden/v7/ccbom-redox.json"

      - name: Validate differentiation goldens
        run: |
          ROOT='Grade 9/V2/Chemistry/LearningBlueprint'
          V="$ROOT/engine/validate_blueprint_v7.py"
          P="$ROOT/policies/v7-product-assurance-policy.json"
          python "$V" --policy "$P" --similarity "$ROOT/golden/v7/similarity-redox.json"

      - name: Validate separate difficulty namespaces
        run: |
          ROOT='Grade 9/V2/Chemistry/LearningBlueprint'
          V="$ROOT/engine/validate_blueprint_v7.py"
          P="$ROOT/policies/v7-product-assurance-policy.json"
          python "$V" --policy "$P" --difficulty "$ROOT/golden/v7/difficulty-core1b-redox.json"
          python "$V" --policy "$P" --difficulty "$ROOT/golden/v7/difficulty-core2b-redox.json"

      - name: Validate Core purpose contracts
        run: |
          ROOT='Grade 9/V2/Chemistry/LearningBlueprint'
          V="$ROOT/engine/validate_blueprint_v7.py"
          P="$ROOT/policies/v7-product-assurance-policy.json"
          python "$V" --policy "$P" --purpose "$ROOT/golden/v7/purpose-core1b-redox.json"
          python "$V" --policy "$P" --purpose "$ROOT/golden/v7/purpose-core2b-redox.json"

      - name: Validate learner fit through both conditioning routes
        run: |
          ROOT='Grade 9/V2/Chemistry/LearningBlueprint'
          V="$ROOT/engine/validate_blueprint_v7.py"
          P="$ROOT/policies/v7-product-assurance-policy.json"
          python "$V" --policy "$P" --learner-fit "$ROOT/golden/v7/learner-fit-core2b-redox.json"
          python "$V" --policy "$P" --learner-fit "$ROOT/golden/v7/learner-fit-owner-core2a-redox.json"

      - name: Validate question custody and learner badges
        run: |
          ROOT='Grade 9/V2/Chemistry/LearningBlueprint'
          V="$ROOT/engine/validate_blueprint_v7.py"
          P="$ROOT/policies/v7-product-assurance-policy.json"
          python "$V" --policy "$P" --question-custody "$ROOT/golden/v7/question-custody-source-u2q15c.json"
          python "$V" --policy "$P" --badges "$ROOT/golden/v7/badges-core1b-redox.json"
          python "$V" --policy "$P" --badges "$ROOT/golden/v7/badges-core2b-redox.json"

      - name: Assert v7 release doctrine
        run: |
          grep -q 'mandatory_closed / mandatory_total = 1.00' 'Grade 9/V2/Chemistry/LearningBlueprint/V7_PRODUCT_ASSURANCE.md'
          grep -q 'Differentiation is checked against structured pedagogical fingerprints' 'Grade 9/V2/Chemistry/LearningBlueprint/V7_PRODUCT_ASSURANCE.md'
          grep -q 'Every question is source-visible and answer-closed' 'Grade 9/V2/Chemistry/LearningBlueprint/V7_PRODUCT_ASSURANCE.md'
          grep -q 'Core1A study-note sufficiency' 'Grade 9/V2/Chemistry/LearningBlueprint/V7_CORE1A_STUDY_NOTE_SUFFICIENCY.md'
