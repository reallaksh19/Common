name: Chemistry Exact Product Audit Export

on:
  push:
    branches:
      - audit/chemistry-exact-product-artifacts

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Render exact frozen learner products
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Grade 9/V2/Chemistry/ExactProduct/candidates/CHEM-C-L-EXACT-CANDIDATE-A"
          OUT="audit-export"
          mkdir -p "$OUT/core1" "$OUT/core2" "$OUT/meta"

          sha256sum "$ROOT/core-study-guide.pdf" "$ROOT/examside-solution-transfer-book.pdf" > "$OUT/meta/sha256.txt"
          pdfinfo "$ROOT/core-study-guide.pdf" > "$OUT/meta/core1-pdfinfo.txt"
          pdfinfo "$ROOT/examside-solution-transfer-book.pdf" > "$OUT/meta/core2-pdfinfo.txt"
          pdffonts "$ROOT/core-study-guide.pdf" > "$OUT/meta/core1-fonts.txt"
          pdffonts "$ROOT/examside-solution-transfer-book.pdf" > "$OUT/meta/core2-fonts.txt"
          pdfimages -list "$ROOT/core-study-guide.pdf" > "$OUT/meta/core1-images.txt"
          pdfimages -list "$ROOT/examside-solution-transfer-book.pdf" > "$OUT/meta/core2-images.txt"
          pdftotext -layout "$ROOT/core-study-guide.pdf" "$OUT/core1.txt"
          pdftotext -layout "$ROOT/examside-solution-transfer-book.pdf" "$OUT/core2.txt"

          python - <<'PY'
          import json, sys
          from pathlib import Path
          repo = Path(".").resolve()
          chem = repo / "Grade 9/V2/Chemistry"
          sys.path.insert(0, str(chem / "ColdStart" / "engine"))
          from chemistry_cold_start_runner import run_cold_start
          def load(p):
              return json.loads(Path(p).read_text(encoding="utf-8"))
          f = chem / "AssessmentIntake" / "fixtures"
          report, internal = run_cold_start(
              load(f / "mixed-chemistry-source.fixture.json"),
              load(f / "mixed-chemistry-question-set.fixture.json"),
              load(f / "mixed-chemistry-external-corpus.fixture.json"),
              load(f / "mixed-chemistry-topic-scope.fixture.json"),
              repo_root=repo,
              run_id="CHEM-C-L-AUDIT-SEMANTICS",
          )
          out = Path("audit-export/meta")
          for name, obj in {
              "audit-study-model.json": internal["study_model"],
              "audit-source-ledger.json": internal["source_ledger"],
              "audit-core1.json": internal["core1"],
              "audit-core2.json": internal["core2"],
          }.items():
              (out / name).write_text(json.dumps(obj, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          pdftoppm -png -r 144 "$ROOT/core-study-guide.pdf" "$OUT/core1/page"
          pdftoppm -png -r 144 "$ROOT/examside-solution-transfer-book.pdf" "$OUT/core2/page"

          test "$(find "$OUT/core1" -name 'page-*.png' | wc -l)" -eq 37
          test "$(find "$OUT/core2" -name 'page-*.png' | wc -l)" -eq 12

      - name: Upload exact render audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-exact-product-audit-export
          path: audit-export/
          if-no-files-found: error
          retention-days: 7
