name: V2 Publication Realization

on:
  pull_request:
    paths:
      - "Grade 9/V2/PublicationRealization/**"
      - ".github/workflows/v2-publication-realization.yml"
  workflow_dispatch:

jobs:
  publication-realization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Validate V2-06 contracts and generated artifacts
        run: python "Grade 9/V2/PublicationRealization/contracts/validate_contracts.py"
      - name: Run Publication Realization falsifiers
        run: python "Grade 9/V2/PublicationRealization/tests/test_publication_realization.py"
      - name: Render exact synthetic candidate
        run: |
          ROOT="Grade 9/V2/PublicationRealization"
          python "$ROOT/engine/realize_publication.py" --product "$ROOT/fixtures/learner_semantic_product.synthetic.json" --target "$ROOT/fixtures/publication_target.synthetic.json" --policy "$ROOT/fixtures/publication_realization_policy.synthetic.json" --out /tmp/v2-06-candidate
      - name: Independently validate exact candidate bytes
        run: |
          ROOT="Grade 9/V2/PublicationRealization"
          python "$ROOT/validator/validate_publication.py" --out /tmp/v2-06-candidate --product "$ROOT/fixtures/learner_semantic_product.synthetic.json" --target "$ROOT/fixtures/publication_target.synthetic.json"
      - name: Deterministic exact-artifact replay
        run: |
          ROOT="Grade 9/V2/PublicationRealization"
          python "$ROOT/engine/realize_publication.py" --product "$ROOT/fixtures/learner_semantic_product.synthetic.json" --target "$ROOT/fixtures/publication_target.synthetic.json" --policy "$ROOT/fixtures/publication_realization_policy.synthetic.json" --out /tmp/v2-06-replay
          cmp /tmp/v2-06-candidate/candidate.pdf /tmp/v2-06-replay/candidate.pdf
          cmp /tmp/v2-06-candidate/publication_manifest.json /tmp/v2-06-replay/publication_manifest.json
      - name: Upload synthetic custody proof
        uses: actions/upload-artifact@v4
        with:
          name: v2-06-synthetic-custody-proof
          path: /tmp/v2-06-candidate/**
          if-no-files-found: error
