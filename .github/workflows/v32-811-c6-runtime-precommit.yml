name: v32-811-c6-runtime-precommit

on:
  pull_request:
    paths:
      - '.github/v32-evidence-spine/811-c6-*'
      - '.github/v32-evidence-spine/test_811_c6_*'
      - '.github/workflows/v32-811-c6-runtime-precommit.yml'
  push:
    branches:
      - 'v32/811-c6-native-production-handover'
    paths:
      - '.github/v32-evidence-spine/811-c6-*'
      - '.github/v32-evidence-spine/test_811_c6_*'
      - '.github/workflows/v32-811-c6-runtime-precommit.yml'

permissions:
  contents: read

jobs:
  actual-runtime-red-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing V3.2 test schema dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Enforce independent golden-before-test ancestry
        run: |
          git merge-base --is-ancestor ae4c297841e437d2424c42e09f53462c4cc90938 HEAD
      - name: Verify legacy PLAN_HANDOVER compatibility and explicit C6 source opt-in
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m unittest discover -s .github/v32-evidence-spine -p 'test_811_c6_runtime_precommit.py' -v 2>&1 | tee artifacts/811-c6-runtime-red.log
          python - <<'PY'
          from pathlib import Path
          text=Path("artifacts/811-c6-runtime-red.log").read_text(encoding="utf-8")
          missing=[f"test_r{i:02d}_" for i in range(1,6) if f"test_r{i:02d}_" not in text]
          if missing or "Ran 5 tests" not in text or "OK" not in text:
              raise SystemExit(f"C6_LEGACY_OR_SOURCE_TRANSITION_NOT_VERIFIED: {missing}")
          print("C6_LEGACY_COMPAT_AND_OPT_IN=5_CASES_PASS")
          print("C6_SOURCE_PRODUCT_CANDIDATE=REQUIRES_INDEPENDENT_REVIEW")
          print("C6_FROZEN_PATH_AUTHORIZATION=BASE_RESIDENT_EXACT_PATHS")
          PY
