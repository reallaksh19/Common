name: Grade 9 Two-Core Contracts v1

on:
  push:
    paths:
      - 'Grade 9/Architecture/contracts/v1/**'
      - 'Grade 9/Architecture/core1/**'
      - '.github/workflows/grade9-two-core-contracts-v1.yml'
  pull_request:
    paths:
      - 'Grade 9/Architecture/contracts/v1/**'
      - 'Grade 9/Architecture/core1/**'
      - '.github/workflows/grade9-two-core-contracts-v1.yml'
  workflow_dispatch:

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator dependency
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Validate frozen v1 schemas and fixtures
        run: python 'Grade 9/Architecture/contracts/v1/validate_contracts.py'
      - name: Validate example Core1 to Core2 handoff closure
        run: >-
          python 'Grade 9/Architecture/contracts/v1/validate_handoff.py'
          --exam-demand 'Grade 9/Architecture/contracts/v1/examples/exam-demand-profile.example.json'
          --question-content-ledger 'Grade 9/Architecture/contracts/v1/examples/question-content-ledger.example.json'
          --question-occurrence-ledger 'Grade 9/Architecture/contracts/v1/examples/question-occurrence-ledger.example.json'
          --question-ledger 'Grade 9/Architecture/contracts/v1/examples/question-evidence-ledger.example.json'
