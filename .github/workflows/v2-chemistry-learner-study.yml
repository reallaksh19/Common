name: V2 Chemistry Learner Study C-F

on:
  push:
    branches:
      - chemistry-v2-c-f-learner-study-model
    paths:
      - 'Grade 9/V2/Chemistry/LearnerStudy/**'
      - '.github/workflows/v2-chemistry-learner-study.yml'
  pull_request:
    paths:
      - 'Grade 9/V2/Chemistry/LearnerStudy/**'
      - 'Grade 9/V2/Chemistry/LearnerEvidence/**'
      - 'Grade 9/V2/Chemistry/ReasoningSemantics/**'
      - 'Grade 9/V2/Chemistry/AssessmentScope/**'
      - '.github/workflows/v2-chemistry-learner-study.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install jsonschema
      - name: Validate C-F contracts and policy
        run: python 'Grade 9/V2/Chemistry/LearnerStudy/contracts/validate_contracts.py'
      - name: Run C-F scope, treatment and longitudinal falsifiers
        run: python 'Grade 9/V2/Chemistry/LearnerStudy/tests/test_chemistry_learner_study_model.py'
