$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, id, command, actor, status, created_at, updated_at, operations, applied]
properties:
  schema_version: {const: relay-v3-transaction}
  id: {type: string, pattern: '^TX-'}
  command:
    enum: [ACTIVATE_LEASE, RELEASE_LEASE, ACCEPT_CHECKPOINT, RESOLVE_CONTROL, PUBLISH_HANDOVER, EXPORT_LOCAL_EXECUTION, SYNC_DELIVERY, CLOSE_TASK, PLAN_HANDOVER]
  actor: {type: string, minLength: 1}
  status: {enum: [PREPARED, APPLYING, COMMITTED, ROLLED_BACK, RECOVERY_REQUIRED]}
  created_at: {type: string, format: date-time}
  updated_at: {type: string, format: date-time}
  operations:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [path, before_exists, before_digest, after_digest, staged_path, backup_path]
      properties:
        path: {type: string, minLength: 1}
        before_exists: {type: boolean}
        before_digest: {type: [string, 'null'], pattern: '^sha256:[0-9a-fA-F]{64}$'}
        after_digest: {type: string, pattern: '^sha256:[0-9a-fA-F]{64}$'}
        staged_path: {type: string, minLength: 1}
        backup_path: {type: [string, 'null']}
  applied:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  recovery:
    type: object
    additionalProperties: false
    required: [strategy, basis]
    properties:
      strategy: {enum: [CONFIRM_COMMIT, ROLLBACK]}
      basis:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
additionalProperties: false
