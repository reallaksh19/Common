$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, authority, provider, repository, kind, number, title, url, state, observed_at, provider_ref]
properties:
  schema_version: {const: relay-v3-handover-target}
  authority: {const: PROVIDER_READBACK}
  provider: {const: GITHUB}
  repository: {type: string, pattern: '^[^/\s]+/[^/\s]+$'}
  kind: {enum: [ISSUE, PULL_REQUEST]}
  number: {type: integer, minimum: 1}
  title: {type: string, minLength: 1}
  url: {type: string, format: uri}
  state: {enum: [OPEN, CLOSED, DRAFT, READY, MERGED, UNKNOWN]}
  observed_at: {type: string, format: date-time}
  provider_ref: {type: string, minLength: 1}
additionalProperties: false
