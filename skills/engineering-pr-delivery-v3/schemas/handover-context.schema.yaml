$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, authority, frozen_at, frozen_basis, target, blind_context, reality_context, accumulated_learning, generator_contract]
properties:
  schema_version: {const: relay-v3-handover-context}
  authority: {const: DERIVED_HANDOVER_INPUT}
  frozen_at: {type: string, format: date-time}
  frozen_basis:
    type: object
    additionalProperties: false
    required: [roadmap_revision, state_digest, target_digest, material_head, relevant_paths_digest, dependency_digest, coordination_head, checkpoint, ep, lease]
    properties:
      roadmap_revision: {type: string, minLength: 1}
      state_digest: {type: string, pattern: '^sha256:[0-9a-fA-F]{64}$'}
      target_digest: {type: string, pattern: '^sha256:[0-9a-fA-F]{64}$'}
      material_head: {type: string, minLength: 7}
      relevant_paths_digest: {type: string, pattern: '^sha256:[0-9a-fA-F]{64}$'}
      dependency_digest: {type: string, pattern: '^sha256:[0-9a-fA-F]{64}$'}
      coordination_head: {type: string, minLength: 7}
      checkpoint: {type: [string, 'null']}
      ep: {type: [string, 'null']}
      lease: {type: [string, 'null']}
  target: {$ref: handover-target.schema.yaml}
  blind_context:
    type: object
    additionalProperties: false
    required: [programme, local_responsibility, stable_constraints]
    properties:
      programme:
        type: object
        additionalProperties: false
        required: [outcome, current_goal, roadmap_revision, roadmap_title]
        properties:
          outcome: {type: string, minLength: 1}
          current_goal: {type: string, minLength: 1}
          roadmap_revision: {type: string, minLength: 1}
          roadmap_title: {type: string, minLength: 1}
      local_responsibility:
        type: object
        additionalProperties: false
        required: [work_package, title, outcome, acceptance_statements]
        properties:
          work_package: {type: [string, 'null']}
          title: {type: [string, 'null']}
          outcome: {type: [string, 'null']}
          acceptance_statements:
            type: array
            items: {type: string, minLength: 1}
      stable_constraints:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
  reality_context:
    type: object
    additionalProperties: false
    required: [execution, material, evidence, controls, delivery]
    properties:
      execution:
        type: object
        required: [lifecycle, ep, lease, executor, branch]
      material:
        type: object
        required: [base, head, relevant_paths_digest, dependency_digest, coordination_head]
      evidence:
        type: object
        required: [latest_checkpoint, latest_material_validation]
      controls:
        type: object
        required: [execution_blockers, handover_blockers, delivery_blockers, informational]
      delivery:
        type: object
        required: [issue, pr, lifecycle, merge_authorized]
  accumulated_learning:
    type: object
    additionalProperties: false
    required: [checkpoint, discoveries, known_limitations, what_changed, what_is_true_now, what_remains_uncertain, do_not_break, attempted_and_rejected, resume_from, first_successor_action]
    properties:
      checkpoint: {type: [string, 'null']}
      discoveries:
        type: array
        items: {type: string}
      known_limitations:
        type: array
        items: {type: string}
      what_changed:
        type: array
        items: {type: string}
      what_is_true_now:
        type: array
        items: {type: string}
      what_remains_uncertain:
        type: array
        items: {type: string}
      do_not_break:
        type: array
        items: {type: string}
      attempted_and_rejected:
        type: array
        items: {type: string}
      resume_from:
        type: array
        items: {type: string}
      first_successor_action: {type: [string, 'null']}
  generator_contract:
    type: object
    additionalProperties: false
    required: [canonical_launcher, canonical_schema, canonical_validator, protocol_revision_at_freeze, generator_mode, live_main_fetch_required, prompt_sequence, complex_mode, prompt1_q1_q5_required]
    properties:
      canonical_launcher: {const: skills/three-pass-prompt-generator/SKILL.md}
      canonical_schema: {const: skills/three-pass-prompt-generator/schema.md}
      canonical_validator: {const: skills/three-pass-prompt-generator/validate.py}
      protocol_revision_at_freeze: {type: string, pattern: '^TPG-'}
      generator_mode: {const: THREE_PASS_ONLY}
      live_main_fetch_required: {const: true}
      prompt_sequence:
        type: array
        minItems: 5
        maxItems: 5
        prefixItems:
          - {const: PROMPT_0_5}
          - {const: PROMPT_1}
          - {const: PROMPT_2}
          - {const: PROMPT_2_5}
          - {const: PROMPT_3}
        items: false
      complex_mode: {type: boolean}
      prompt1_q1_q5_required: {type: boolean}
additionalProperties: false
