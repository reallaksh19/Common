$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, id, work_package, outcome, basis, scope, acceptance, quality_policy, next]
properties:
  schema_version: {const: relay-v3-ep}
  id: {type: string, pattern: '^EP-'}
  work_package: {type: string, pattern: '^WP-'}
  outcome:
    type: object
    additionalProperties: false
    required: [statement]
    properties:
      statement: {type: string, minLength: 1}
  basis:
    type: object
    additionalProperties: false
    required: [predecessor_checkpoint, material_base, protocol_basis, semantic_dependencies]
    properties:
      predecessor_checkpoint: {type: [string, 'null'], pattern: '^CP-'}
      material_base: {type: string, minLength: 7}
      protocol_basis: {type: string, minLength: 1}
      semantic_dependencies:
        type: array
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [path, reason]
          properties:
            path: {type: string, minLength: 1}
            reason: {type: string, minLength: 1}
  scope:
    type: object
    additionalProperties: false
    required: [write, read, protect, prohibit]
    properties:
      write:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      read:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      protect:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      prohibit:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
  acceptance:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, statement, evidence_requirements]
      properties:
        id: {type: string, pattern: '^AC-'}
        statement: {type: string, minLength: 1}
        evidence_requirements:
          type: array
          minItems: 1
          items:
            type: object
            minProperties: 1
            maxProperties: 1
            additionalProperties: false
            properties:
              test: {type: string, minLength: 1}
              oracle: {type: string, minLength: 1}
            anyOf:
              - required: [test]
              - required: [oracle]
  quality_policy:
    type: object
    additionalProperties: false
    required: [level, independent_review]
    properties:
      level: {enum: [LOW, STANDARD, HIGH_RISK, CRITICAL]}
      independent_review: {enum: [OPTIONAL, REQUIRED]}
  next:
    type: object
    additionalProperties: false
    required: [first_action, stop_conditions]
    properties:
      first_action: {type: string, minLength: 1}
      stop_conditions:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
allOf:
  - if:
      properties:
        quality_policy:
          properties:
            level: {enum: [HIGH_RISK, CRITICAL]}
    then:
      properties:
        quality_policy:
          properties:
            independent_review: {const: REQUIRED}
additionalProperties: false
