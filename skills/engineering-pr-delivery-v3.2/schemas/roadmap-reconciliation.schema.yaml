$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, authority, expected_revision, disposition, basis, roadmap_after]
properties:
  schema_version: {const: relay-v3.1-roadmap-reconciliation}
  authority: {const: PROPOSED_RECONCILIATION}
  expected_revision: {type: string, minLength: 1}
  disposition:
    enum: [NO_CHANGE, UPDATE_WORK_PACKAGE, ADD_WORK_PACKAGE, SPLIT_WORK_PACKAGE, CHANGE_DEPENDENCY, BLOCK_WORK_PACKAGE, COMPLETE_WORK_PACKAGE, REMOVE_WORK_PACKAGE, OWNER_DECISION_REQUIRED]
  basis:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  roadmap_after: {type: object}
additionalProperties: false
