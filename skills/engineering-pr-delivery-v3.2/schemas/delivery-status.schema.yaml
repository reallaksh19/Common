$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, authority, vehicle, observed_at, provider_ref, lifecycle, checks, review, mergeability]
properties:
  schema_version: {const: relay-v3.1-delivery-status}
  authority: {const: PROVIDER_READBACK}
  vehicle:
    type: object
    additionalProperties: false
    required: [provider, kind, number]
    properties:
      provider: {const: GITHUB}
      kind: {enum: [PULL_REQUEST, ISSUE]}
      number: {type: integer, minimum: 1}
  observed_at: {type: string, format: date-time}
  provider_ref: {type: string, minLength: 1}
  lifecycle: {enum: [DRAFT, OPEN, READY, MERGED, CLOSED, UNKNOWN]}
  checks: {enum: [PASS, FAIL, PENDING, NOT_APPLICABLE, UNKNOWN]}
  review: {enum: [APPROVED, CHANGES_REQUESTED, PENDING, NOT_APPLICABLE, UNKNOWN]}
  mergeability: {enum: [MERGEABLE, CONFLICTING, BLOCKED, NOT_APPLICABLE, UNKNOWN]}
additionalProperties: false
