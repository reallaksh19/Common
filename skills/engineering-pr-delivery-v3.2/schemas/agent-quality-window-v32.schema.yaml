$schema: https://json-schema.org/draft/2020-12/schema
$id: relay-v3.2-agent-quality-metrics
title: V3.2 agent/reviewer quality observation window and derived result
description: >-
  Pure evidence-derived quality metrics. These records carry no progress, candidate verdict,
  review, admission, merge, release, title or LIVE_STATUS authority.
$defs:
  digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
  ratio:
    type: object
    additionalProperties: false
    required: [state, numerator, denominator, value]
    properties:
      state: {enum: [OBSERVED, UNKNOWN]}
      numerator: {type: integer, minimum: 0}
      denominator: {type: integer, minimum: 0}
      value: {type: [number, "null"], minimum: 0, maximum: 1}
  observation:
    type: object
    additionalProperties: false
    required: [id, class, critical, disposition, repairs, evidence_refs]
    properties:
      id: {type: string, minLength: 1}
      class: {enum: [MUTATION, CLEAN_CONTROL]}
      critical: {type: boolean}
      disposition: {enum: [DETECTED, MISSED, CLEAN_ACCEPTED, FALSE_POSITIVE, UNKNOWN]}
      impact_expected: {type: [integer, "null"], minimum: 1}
      impact_covered: {type: [integer, "null"], minimum: 0}
      repairs: {type: integer, minimum: 0}
      evidence_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
    allOf:
      - if:
          properties: {class: {const: MUTATION}}
          required: [class]
        then:
          properties:
            disposition: {enum: [DETECTED, MISSED, UNKNOWN]}
      - if:
          properties: {class: {const: CLEAN_CONTROL}}
          required: [class]
        then:
          properties:
            disposition: {enum: [CLEAN_ACCEPTED, FALSE_POSITIVE, UNKNOWN]}
  window:
    type: object
    additionalProperties: false
    required: [schema, window_id, observations]
    properties:
      schema: {const: relay-v3.2-agent-quality-window}
      window_id: {type: string, minLength: 1}
      observations:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/observation'}
  result:
    type: object
    additionalProperties: false
    required:
      - schema
      - authority
      - window_id
      - input_digest
      - evidence_digest
      - observation_count
      - unknown_observation_count
      - metrics
      - evidence_refs
      - authority_effects
    properties:
      schema: {const: relay-v3.2-agent-quality-result}
      authority: {const: DERIVED_AGENT_QUALITY_OBSERVATION_ONLY}
      window_id: {type: string, minLength: 1}
      input_digest: {$ref: '#/$defs/digest'}
      evidence_digest: {$ref: '#/$defs/digest'}
      observation_count: {type: integer, minimum: 0}
      unknown_observation_count: {type: integer, minimum: 0}
      metrics:
        type: object
        additionalProperties: false
        required:
          - mutation_tpr
          - clean_tnr
          - balanced_accuracy
          - critical_mutation_recall
          - impact_coverage
          - critical_unknown_count
          - repair_count
        properties:
          mutation_tpr: {$ref: '#/$defs/ratio'}
          clean_tnr: {$ref: '#/$defs/ratio'}
          balanced_accuracy: {$ref: '#/$defs/ratio'}
          critical_mutation_recall: {$ref: '#/$defs/ratio'}
          impact_coverage: {$ref: '#/$defs/ratio'}
          critical_unknown_count: {type: integer, minimum: 0}
          repair_count: {type: integer, minimum: 0}
      evidence_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      authority_effects:
        type: array
        maxItems: 0
oneOf:
  - {$ref: '#/$defs/window'}
  - {$ref: '#/$defs/result'}
