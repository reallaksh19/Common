$schema: https://json-schema.org/draft/2020-12/schema
$id: relay-v3.2-agent-quality-trajectory
title: V3.2 agent/reviewer quality trajectory input and derived result
description: >-
  Threshold-free trajectory classification over exact R-M1 quality results.
  Carries no progress, candidate/review verdict, admission, merge, release, title or LIVE_STATUS authority.
$defs:
  digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  fraction:
    type: object
    additionalProperties: false
    required: [numerator, denominator]
    properties:
      numerator: {type: integer, minimum: 0}
      denominator: {type: integer, minimum: 1}
  ratio:
    type: object
    additionalProperties: false
    required: [state, numerator, denominator, value]
    properties:
      state: {enum: [OBSERVED, UNKNOWN]}
      numerator: {type: integer, minimum: 0}
      denominator: {type: integer, minimum: 0}
      value: {type: [number, "null"], minimum: 0, maximum: 1}
  m1_result:
    type: object
    additionalProperties: false
    required:
      [schema, authority, window_id, input_digest, evidence_digest, observation_count,
       unknown_observation_count, metrics, evidence_refs, authority_effects]
    properties:
      schema: {const: relay-v3.2-agent-quality-result}
      authority: {const: DERIVED_AGENT_QUALITY_OBSERVATION_ONLY}
      window_id: {type: string, minLength: 1}
      input_digest: {$ref: '#/$defs/digest'}
      evidence_digest: {$ref: '#/$defs/digest'}
      observation_count: {type: integer, minimum: 1}
      unknown_observation_count: {type: integer, minimum: 0}
      metrics:
        type: object
        additionalProperties: false
        required:
          [mutation_tpr, clean_tnr, balanced_accuracy, critical_mutation_recall,
           impact_coverage, critical_unknown_count, repair_count]
        properties:
          mutation_tpr: {$ref: '#/$defs/ratio'}
          clean_tnr: {$ref: '#/$defs/ratio'}
          balanced_accuracy: {$ref: '#/$defs/ratio'}
          critical_mutation_recall: {$ref: '#/$defs/ratio'}
          impact_coverage: {$ref: '#/$defs/ratio'}
          critical_unknown_count: {type: integer, minimum: 0}
          repair_count: {type: integer, minimum: 0}
      evidence_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      authority_effects:
        type: array
        maxItems: 0
  component:
    type: object
    additionalProperties: false
    required: [direction, first, last]
    properties:
      direction: {enum: [STABLE, IMPROVING, DEGRADING, MIXED, INSUFFICIENT_DATA]}
      first: {oneOf: [{$ref: '#/$defs/fraction'}, {type: "null"}]}
      last: {oneOf: [{$ref: '#/$defs/fraction'}, {type: "null"}]}
type: object
oneOf:
  - additionalProperties: false
    required: [schema, trajectory_id, windows]
    properties:
      schema: {const: relay-v3.2-agent-quality-trajectory-input}
      trajectory_id: {type: string, minLength: 1}
      windows:
        type: array
        minItems: 2
        items:
          type: object
          additionalProperties: false
          required: [sequence, result]
          properties:
            sequence: {type: integer, minimum: 1}
            result: {$ref: '#/$defs/m1_result'}
  - additionalProperties: false
    required:
      [schema, authority, trajectory_id, input_digest, trajectory_digest, trajectory,
       reason, windows, components, authority_effects]
    properties:
      schema: {const: relay-v3.2-agent-quality-trajectory-result}
      authority: {const: DERIVED_AGENT_QUALITY_TRAJECTORY_ONLY}
      trajectory_id: {type: string, minLength: 1}
      input_digest: {$ref: '#/$defs/digest'}
      trajectory_digest: {$ref: '#/$defs/digest'}
      trajectory: {enum: [STABLE, IMPROVING, DEGRADING, INSUFFICIENT_DATA]}
      reason:
        enum:
          [ALL_COMPONENTS_STABLE, MONOTONIC_IMPROVEMENT, MONOTONIC_DEGRADATION,
           MIXED_SIGNAL, INCOMPLETE_SIGNAL, CONFLICTING_SIGNAL]
      windows:
        type: array
        minItems: 2
        items:
          type: object
          additionalProperties: false
          required: [sequence, window_id, input_digest, evidence_digest, result_digest]
          properties:
            sequence: {type: integer, minimum: 1}
            window_id: {type: string, minLength: 1}
            input_digest: {$ref: '#/$defs/digest'}
            evidence_digest: {$ref: '#/$defs/digest'}
            result_digest: {$ref: '#/$defs/digest'}
      components:
        type: object
        additionalProperties: false
        required:
          [mutation_tpr, clean_tnr, balanced_accuracy, critical_mutation_recall,
           impact_coverage, critical_unknown_rate, repair_rate]
        properties:
          mutation_tpr: {$ref: '#/$defs/component'}
          clean_tnr: {$ref: '#/$defs/component'}
          balanced_accuracy: {$ref: '#/$defs/component'}
          critical_mutation_recall: {$ref: '#/$defs/component'}
          impact_coverage: {$ref: '#/$defs/component'}
          critical_unknown_rate: {$ref: '#/$defs/component'}
          repair_rate: {$ref: '#/$defs/component'}
      authority_effects:
        type: array
        maxItems: 0
