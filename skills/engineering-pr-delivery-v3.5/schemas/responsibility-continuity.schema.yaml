$id: relay-v3.2-responsibility-continuity
type: object
required: [schema, authority, responsibility, state, progress, frontier, units, recovery, observability]
properties:
  schema:
    const: relay-v3.2-responsibility-continuity
  authority:
    const: DERIVED_CONTINUITY_ONLY
  projection_mode:
    enum: [LEGACY_AGENT_ASSERTED, DERIVED_FROM_FACTS]
    description: >-
      DERIVED_FROM_FACTS (all new responsibilities): unit.evidenced is computed from evidence_refs plus an
      evidence_candidate equal to the observed material head; agents never assert it and never write the
      issue title (the DELP runner is the only title writer). LEGACY_AGENT_ASSERTED is readable history only;
      a missing value is read as LEGACY_AGENT_ASSERTED.
  responsibility:
    type: string
    minLength: 1
  protocol_ref:
    type: [string, "null"]
    description: Exact successor-verifiable protocol source/ref; UNKNOWN/null is compatibility-only for older snapshots.
  state:
    enum: [PLANNING, IMPLEMENTING, RECOVERING, EVIDENCING, VERIFYING, OWNER_DECISION, BLOCKED_EXTERNAL, DELIVERY_READY, COMPLETE, SUPERSEDED]
  plan_ref:
    type: [string, "null"]
  progress:
    type: object
    required: [denominator, completed_units, evidenced_units, progress_percent, evidence_percent]
  frontier:
    type: object
    required: [material_head, semantic_evidence_head, relation, recovery_reconciliation_needed]
    properties:
      recovery_reconciliation_needed:
        type: boolean
        description: Passive frontier discrepancy; does not itself impose a recovery publication on the current uninterrupted executor.
  units:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, complete, evidenced]
      properties:
        id: {type: string, minLength: 1}
        complete: {type: boolean}
        evidenced:
          type: boolean
          description: Derived in DERIVED_FROM_FACTS mode (never an agent input); agent-asserted only in LEGACY_AGENT_ASSERTED mode.
        weight: {type: integer, minimum: 1}
        evidence_refs:
          type: array
          items: {type: string, minLength: 1}
        evidence_candidate:
          type: [string, "null"]
          pattern: "^[0-9a-f]{40}$"
  recovery:
    type: object
    required: [stream_loss_count, recovery_evidence_required, handover_plan_triggered_this_lifecycle, plan_for_handover_now]
    properties:
      mode:
        enum: [NONE, INTERRUPTED_EXECUTOR, FRONTIER_RECONCILIATION]
      recovery_evidence_required:
        type: boolean
        description: Active recovery obligation after stream-loss or recovery-start; distinct from passive frontier reconciliation need.
  observability:
    type: object
    required: [provider_sync_required, provider_sync_failure_blocks_engineering, update_reason]
  provider:
    type: object
additionalProperties: true
