$schema: https://json-schema.org/draft/2020-12/schema
$id: relay-v3.5-delp-live-status
title: LIVE_STATUS_V1 (derived provider projection)
description: >-
  One managed, disposable status comment per node. It is a pure function of the execution graph, the accepted
  CHECKPOINT_FACTS_V1 ledger and observed material truth. It is never authority, agents do not edit it, and if
  every status comment and title disappeared it could be rebuilt from durable inputs.
$defs:
  finding:
    type: object
    required: [code, detail]
    properties:
      code: {type: string}
      detail: {type: string}
  responsibility_condition:
    type: object
    additionalProperties: false
    required: [type, status, reason, message, observed_generation, candidate_sha, source_refs]
    properties:
      type:
        enum: [PlanReady, SpecCurrent, MaterialObserved, EvidenceCurrent, DependenciesReady, CustodySafe, AssuranceSatisfied, ProviderVisible]
      status: {enum: ["TRUE", "FALSE", "UNKNOWN", "NOT_APPLICABLE"]}
      reason: {type: string, minLength: 1, pattern: '.*\S.*'}
      message: {type: string, minLength: 1, pattern: '.*\S.*'}
      observed_generation: {type: [integer, "null"], minimum: 1}
      candidate_sha: {type: [string, "null"], pattern: '^[0-9a-f]{40}$'}
      source_refs:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1, pattern: '.*\S.*'}
  actual_next:
    type: object
    additionalProperties: false
    required: [authority, action, reason, source_basis, detail]
    properties:
      authority: {const: DERIVED_ACTUAL_NEXT_ONLY}
      action:
        enum: [NONE, FIX_PLAN, RECONCILE_SPEC, RECOVER_CUSTODY, MATERIALIZE_FACTS, WAIT_PROVIDER, RECOVER_EVIDENCE, RECONCILE_HANDOFF, WAIT_DEPENDENCY, REMEDIATE_FINDING, REVIEW_CANDIDATE, WAIT_OWNER, CONTINUE_UNIT, PUBLISH_RESULT]
      reason: {type: string, minLength: 1, pattern: '.*\S.*'}
      source_basis:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1, pattern: '.*\S.*'}
      detail: {type: [string, "null"]}
type: object
required: [schema, authority, node, projection]
properties:
  schema:
    const: relay-v3.5-delp-live-status
  authority:
    const: DERIVED_PROJECTION_ONLY
  programme: {type: [string, "null"]}
  node:
    type: object
    required: [ref, kind, state, progress, identity, currentness]
    properties:
      ref: {type: string}
      kind: {enum: [ROOT, INTERMEDIATE, LEAF]}
      lifecycle: {type: string}
      state:
        enum: [ACTIVE, HANDOFF, RECONSTRUCTING, WAITING, WAITING_CI, WAITING_TOOL, WAITING_EXTERNAL, WAITING_PROVIDER_VISIBILITY, WAITING_DEPENDENCY, RECOVERING, QUIET, EVIDENCE_GAP, EVIDENCE_STALE, UNMATERIALIZED, NOT_RELEASEABLE, PLAN_GAP, STALE, COMPLETE, SUPERSEDED, NOT_STARTED, PAUSED, IDLE]
      light: {enum: ["🟢", "🟡", "🔵", "🔴", "✅", "⚪"]}
      identity:
        type: object
        required: [root, lineage]
        properties:
          programme: {type: [string, "null"]}
          root: {type: string}
          lineage: {type: array, items: {type: string}}
          responsibility_id: {type: [string, "null"]}
          spec_generation: {type: [integer, "null"], minimum: 1}
          contract_digest:
            type: [string, "null"]
            pattern: '^sha256:[0-9a-f]{64}$'
      currentness:
        type: object
        additionalProperties: false
        required: [mode, graph_generation, graph_digest, spec_generation, contract_digest, fact_binding_required]
        description: >-
          Derived plan/currentness identity. It is never agent-authored and never moves progress by itself.
          STABLE mode requires exact Responsibility fact bindings; LEGACY preserves the historical locator-only contract.
        properties:
          mode: {enum: [STABLE, LEGACY]}
          graph_generation: {type: integer, minimum: 1}
          graph_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
          spec_generation: {type: [integer, "null"], minimum: 1}
          contract_digest:
            type: [string, "null"]
            pattern: '^sha256:[0-9a-f]{64}$'
          fact_binding_required: {type: boolean}
      progress:
        type: object
        description: "LEAF: P/E/D/DE. ROOT/INTERMEDIATE: D/E. Integers 0..100 plus exact ratios; recomputed, never incremented."
      material:
        type: object
        description: Provider-observed material of a LEAF. Every field after candidate_sha is present only when observed.
        properties:
          primary_pr: {type: [string, "null"]}
          candidate_sha: {type: [string, "null"]}
          base_sha: {type: string, pattern: '^[0-9a-f]{40}$', description: Head of programme.base_ref when it was observed.}
          pr_state: {enum: [OPEN, MERGED, CLOSED]}
          ahead_by: {type: integer, minimum: 0, description: Commits of a branch-only candidate beyond the base.}
          behind_by: {type: integer, minimum: 0, description: Commits the base has that a branch-only candidate lacks.}
      evidence:
        type: object
        properties:
          health: {enum: [CURRENT, GAP, STALE_CANDIDATE, UNVERIFIABLE]}
          gaps: {type: array}
      frontier: {type: object}
      dependencies:
        type: object
        description: Derived readiness of plan-declared depends_on predecessors; never agent-authored and never progress authority.
        required: [declared, ready, blocking]
        properties:
          declared: {type: array, items: {type: string}}
          ready: {type: boolean}
          blocking:
            type: array
            items:
              type: object
              required: [ref, state, lifecycle]
              properties:
                ref: {type: string}
                state: {type: string}
                lifecycle: {type: string}
      successor_policy:
        type: [object, "null"]
        description: Plan-owned policy for the current active unit; never progress authority.
      handover:
        type: object
        description: Derived custody/reconstruction projection from accepted handover facts.
        properties:
          status: {enum: [HANDOFF, RECONSTRUCTING, RECONCILED]}
          mode: {enum: [CONTINUITY, INDEPENDENT_RECONSTRUCTION]}
          decision_at_risk: {type: string}
          frontier_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
          predecessor_ref: {type: [string, "null"]}
          result: {type: [string, "null"]}
          matched: {type: boolean}
      health:
        type: object
        description: >-
          Advisory delivery-continuity health, present only when programme.health_policy.mode is ADVISORY and the leaf has started
          (not NOT_STARTED, COMPLETE or SUPERSEDED). LEAF: the verdict, its light, the seven components and the reasons. ROOT/INTERMEDIATE:
          the worst verdict over the started leaves below, with counts. Observed or derived, never declared; it never moves a number,
          a state or a title. UNOBSERVED means nothing was observed and is never read as healthy.
        required: [mode, verdict, light, advisory]
        properties:
          mode: {const: ADVISORY}
          verdict: {enum: [HEALTHY, UNOBSERVED, WATCH, AT_RISK]}
          light: {enum: ["🟢", "⚪", "🟡", "🔴"]}
          advisory: {const: true}
          components:
            type: object
            propertyNames: {enum: [materialization, evidence, checkpoint_distance, size, base_drift, interruptions, liveness]}
            additionalProperties:
              type: object
              required: [status, detail]
              properties:
                status: {enum: [OK, UNOBSERVED, WATCH, AT_RISK]}
                detail: {type: string}
          reasons: {type: array, items: {type: string}}
          leaves: {type: integer, minimum: 1}
          counts: {type: object, propertyNames: {enum: [HEALTHY, UNOBSERVED, WATCH, AT_RISK]}, additionalProperties: {type: integer, minimum: 1}}
          at_risk: {type: array, items: {type: string}}
      materialization:
        type: object
        description: >-
          Present only when the provider shows work that the facts ledger lacks, so the numbers are a lower bound and not
          the truth. LEAF: the observed signal (PR_OPEN, PR_MERGED, PR_CLOSED, BRANCH_AHEAD_<n>). ROOT/INTERMEDIATE: the
          unmaterialized leaves below. Unknown is never shown as zero progress.
        required: [status]
        properties:
          status: {const: UNMATERIALIZED}
          provider_signal: {type: string, pattern: '^(?:PR_(?:OPEN|MERGED|CLOSED)|BRANCH_AHEAD_[1-9][0-9]*)$'}
          leaves: {type: array, items: {type: string}}
      plan:
        type: object
        description: >-
          Decomposition gate result, present only when programme.decomposition_policy.mode is ADVISORY or ENFORCED.
          LEAF: releasable plus blockers and advisories. ROOT/INTERMEDIATE: how many leaves below are not releasable.
          It is derived from the plan alone and never moves a percentage.
        required: [mode]
        properties:
          mode: {enum: [ADVISORY, ENFORCED]}
          releasable: {type: boolean}
          blockers: {type: array, items: {$ref: '#/$defs/finding'}}
          advisories: {type: array, items: {$ref: '#/$defs/finding'}}
          not_releasable: {type: integer, minimum: 0}
          leaves: {type: array, items: {type: string}}
      conditions:
        type: array
        minItems: 8
        maxItems: 8
        items: {$ref: '#/$defs/responsibility_condition'}
      actual_next: {$ref: '#/$defs/actual_next'}
      execution_provenance:
        type: object
        additionalProperties: false
        description: >-
          Derived visibility of execution/custody provenance carried by accepted facts. B1 does not classify any
          binding as current or stale and this field has no progress, title, frontier or admission authority.
        required: [bound_fact_count, unbound_fact_count, bindings]
        properties:
          bound_fact_count: {type: integer, minimum: 0}
          unbound_fact_count: {type: integer, minimum: 0}
          bindings:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [ep, lease, executor, custody_epoch, source_refs]
              properties:
                ep:
                  type: string
                  pattern: '^(?:EP-[A-Za-z0-9][A-Za-z0-9._-]*|EP\.(?:[1-9][0-9]*|REPO|INTERNAL)\.[1-9][0-9]*)$'
                lease:
                  type: string
                  pattern: '^(?:LEASE-[A-Za-z0-9][A-Za-z0-9._-]*|LEASE\.(?:[1-9][0-9]*|REPO|INTERNAL)\.[1-9][0-9]*)$'
                executor: {type: string, minLength: 1, pattern: '.*\S.*'}
                custody_epoch: {type: integer, minimum: 1}
                source_refs:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {type: string, minLength: 1}
      custody_fence:
        type: object
        additionalProperties: false
        description: >-
          Derived B2 visibility of the active STATE/LEASE fence applied to current semantic facts. Fenced facts
          remain auditable outside the effective semantic stream; this block does not itself authorize recovery.
        required: [active_execution, granted_at, effective_fact_count, fenced_fact_count, fenced_sources]
        properties:
          active_execution:
            type: object
            additionalProperties: false
            required: [ep, lease, executor, custody_epoch]
            properties:
              ep:
                type: string
                pattern: '^(?:EP-[A-Za-z0-9][A-Za-z0-9._-]*|EP\.(?:[1-9][0-9]*|REPO|INTERNAL)\.[1-9][0-9]*)$'
              lease:
                type: string
                pattern: '^(?:LEASE-[A-Za-z0-9][A-Za-z0-9._-]*|LEASE\.(?:[1-9][0-9]*|REPO|INTERNAL)\.[1-9][0-9]*)$'
              executor: {type: string, minLength: 1, pattern: '.*\S.*'}
              custody_epoch: {type: integer, minimum: 1}
          granted_at: {type: string, format: date-time}
          effective_fact_count: {type: integer, minimum: 0}
          fenced_fact_count: {type: integer, minimum: 0}
          fenced_sources:
            type: array
            uniqueItems: true
            items: {type: string, minLength: 1}
      activity_epoch: {type: integer, minimum: 0}
      warnings: {type: array, items: {type: string}}
    allOf:
      - if:
          properties: {kind: {const: LEAF}}
          required: [kind]
        then:
          required: [conditions, actual_next, execution_provenance]
  projection:
    type: object
    required: [version, input_digest]
    properties:
      version:
        type: integer
        minimum: 0
        description: Compare-and-swap version of this provider surface. A write succeeds only from the version it read.
      input_digest:
        type: string
        pattern: '^sha256:[0-9a-f]{64}$'
