      sample: {type: array, maxItems: 100, items: {type: string}}
      outside_surface_count: {type: [integer, 'null'], minimum: 0}
      outside_surface_digest: {type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$'}
      outside_sample: {type: array, maxItems: 100, items: {type: string}}
  path_impact: {enum: [LOCAL, BOUNDED_MULTI_STAGE, CROSS_CUTTING, UNKNOWN]}
  change_impact: {enum: [CROSS_CUTTING, UNKNOWN]}
  static_dependency_visibility: {const: UNAVAILABLE}
}
