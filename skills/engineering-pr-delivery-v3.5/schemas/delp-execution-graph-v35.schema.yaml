$schema: https://json-schema.org/draft/2020-12/schema
$id: relay-v3.5-delp-execution-graph
title: DELP execution graph (the Coordinator's plan)
description: >-
  Plan authority: lineage, denominators and weights live here and only here. Agents never author it through facts.
  Programme (ROOT) -> INTERMEDIATE responsibilities -> LEAF execution responsibilities. A LEAF owns declared
  weighted units, at most one primary PR (or a candidate_ref when no PR exists yet) and optional delivery gates.
  Parent issues are not execution workspaces: material work is always a LEAF.
  The decomposition contract (outcome, size_budget, write_surface, depends_on, unit verify steps) is judged by the
  decomposition gate against programme.decomposition_policy; the progress maths never reads it.
$defs:
  ref: {type: string, pattern: '^(?:[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?#)?[1-9][0-9]*$'}
  item_key: {type: string, pattern: '^[^:\s]+:(?:gate:)?[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}
  claim_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}
  acceptance_claim:
    type: object
    additionalProperties: false
    required: [id, claim, kind]
    properties:
      id: {$ref: '#/$defs/claim_id'}
      claim: {type: string, minLength: 1, pattern: '.*\S.*'}
      kind: {enum: [SEMANTIC, DELIVERY_GATE]}
      shared: {type: boolean, default: false}
  claim_relationship:
    type: object
    additionalProperties: false
    required: [claim_id, relation]
    properties:
      claim_id: {$ref: '#/$defs/claim_id'}
      relation: {enum: [OWN, ENABLES, GATE]}
  stable_cut:
    type: object
    additionalProperties: false
    required: [output_contract, independent_oracle, consumer_stable, risk_reduction, handoff_economy]
    properties:
      output_contract: {type: boolean}
      independent_oracle: {type: boolean}
      consumer_stable: {type: boolean}
      risk_reduction: {type: boolean}
      handoff_economy: {type: boolean}
  topology_assessment:
    type: object
    additionalProperties: false
    required:
      - id
      - proposal_kind
      - responsibility_ids
      - semantic_cohesion
      - dependency_closure
      - verification_closure
      - uncertainty
      - change_impact
      - execution_horizon
      - mutation_domains
      - recovery_radius
      - handoff_cost
      - cross_child_cohesion
      - stable_cut
      - source_refs
    properties:
      id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}
      proposal_kind: {enum: [LEAF, ADJACENT_CHILDREN]}
      responsibility_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1, pattern: '.*\S.*'}
      semantic_cohesion: {enum: [COHESIVE, MIXED, UNKNOWN]}
      dependency_closure: {enum: [CLOSED, OPEN, UNKNOWN]}
      verification_closure: {enum: [CLOSED, DEFERRED, UNKNOWN]}
      uncertainty: {enum: [LOW, MATERIAL, BLOCKING]}
      change_impact: {enum: [LOCAL, BOUNDED_MULTI_STAGE, CROSS_CUTTING, UNKNOWN]}
      execution_horizon: {enum: [SHORT, MULTI_STEP, LONG_OR_AMBIGUOUS]}
      mutation_domains:
        type: array
        uniqueItems: true
        items:
          enum: [LOCAL_FILES, GIT_HISTORY, REMOTE_BRANCH, GITHUB_ISSUE, GITHUB_PR, CI, BROWSER, EXTERNAL_SERVICE]
      recovery_radius: {enum: [SMALL, MULTI_SURFACE, AMBIGUOUS_EXTERNAL]}
      handoff_cost: {enum: [LOW, MATERIAL, HIGH]}
      cross_child_cohesion: {enum: [LOW, HIGH]}
      stable_cut: {$ref: '#/$defs/stable_cut'}
      source_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1, pattern: '.*\S.*'}
  size_budget:
    type: object
    additionalProperties: false
    properties:
      target_loc: {type: integer, minimum: 1}
      hard_loc: {type: integer, minimum: 1}
      target_minutes: {type: integer, minimum: 1}
      hard_minutes: {type: integer, minimum: 1}
type: object
required: [programme, nodes]
properties:
  schema:
    const: relay-v3.5-delp-execution-graph
  programme:
    type: object
    required: [root]
    properties:
      id: {type: string, minLength: 1}
      root: {$ref: '#/$defs/ref'}
      graph_generation:
        type: integer
        minimum: 1
        description: >-
          Monotonic semantic generation of the programme graph. Omitted legacy graphs are read as generation 1.
          A graph that declares this field is in stable-identity mode: every LEAF must declare responsibility_id
          and spec_generation.
      repository:
        type: string
        description: >-
          The repository this plan belongs to. A live sync-github requires it and refuses when it differs from
          --repository, so a plan (or a shipped example, which declares example/delp-demo) can never write elsewhere.
      base_ref:
        type: string
        minLength: 1
        description: Branch that branch-only leaves (candidate_ref) are compared against to prove work exists. Default main.
      fact_authors:
        type: array
        items: {type: string, minLength: 1}
        description: Explicit GitHub logins whose CHECKPOINT_FACTS_V1 comments are trusted. When absent, repository OWNER/MEMBER/COLLABORATOR comments are trusted.
      total_weight:
        type: integer
        minimum: 1
        description: Display scale for unit points (default 10000). Shares are exact fractions; this never changes a percentage.
      acceptance_claims:
        type: array
        uniqueItems: true
        items: {$ref: '#/$defs/acceptance_claim'}
        description: >-
          Parent outcome claims used by the V3.5 Responsibility topology. SEMANTIC claims describe the
          programme/product/architecture outcome; DELIVERY_GATE claims describe qualification/delivery conditions.
      topology_assessments:
        type: array
        uniqueItems: true
        items: {$ref: '#/$defs/topology_assessment'}
        description: >-
          Coordinator/plan-authority semantic topology basis keyed by stable Responsibility ids.
          These records are planning/admission metadata: they may move graph identity but do not themselves
          change a leaf product contract or mint progress/evidence.
      health_policy:
        type: object
        additionalProperties: false
        description: >-
          Advisory delivery-continuity health (mode OFF by default; ADVISORY adds a health block to started leaves and their
          ancestors). Health is observed or derived, never declared, and never moves a number, a state or a title or blocks work.
          Defaults are the programme's written rules: checkpoint trigger 250 / hard ceiling 500 newly authored lines (400 / 700 changed),
          and a handover is planned at the third stream loss in one executor lifecycle. Elapsed time alone is not a rule.
        properties:
          mode: {enum: [OFF, ADVISORY]}
          checkpoint:
            type: object
            additionalProperties: false
            properties:
              watch_added_loc: {type: integer, minimum: 1}
              at_risk_added_loc: {type: integer, minimum: 1}
              watch_changed_loc: {type: integer, minimum: 1}
              at_risk_changed_loc: {type: integer, minimum: 1}
          drift:
            type: object
            additionalProperties: false
            properties:
              watch_behind: {type: integer, minimum: 1}
              at_risk_behind: {type: integer, minimum: 1}
          interruptions:
            type: object
            additionalProperties: false
            properties:
              watch: {type: integer, minimum: 1}
              at_risk: {type: integer, minimum: 1}
      decomposition_policy:
        type: object
        additionalProperties: false
        description: >-
          Omitted means mode OFF (behaviour identical to a graph without it). ADVISORY reports findings only.
          ENFORCED turns a leaf with blockers into NOT_RELEASEABLE and makes every continuation answer FIX_PLAN.
        properties:
          mode: {enum: [OFF, ADVISORY, ENFORCED]}
          units:
            type: object
            additionalProperties: false
            properties:
              min: {type: integer, minimum: 1}
              max: {type: integer, minimum: 1}
              max_share_percent: {type: integer, minimum: 1, maximum: 100}
          leaf_budget:
            type: object
            additionalProperties: false
            properties:
              target_loc: {type: integer, minimum: 1}
              hard_loc: {type: integer, minimum: 1}
              target_minutes: {type: integer, minimum: 1}
              hard_minutes: {type: integer, minimum: 1}
          min_leaf_target_loc: {type: integer, minimum: 0}
          require:
            type: object
            additionalProperties: false
            properties:
              outcome: {type: boolean}
              verify: {type: boolean}
              write_surface: {type: boolean}
              size_budget: {type: boolean}
              transformation_boundaries: {type: boolean}
  plan_updates:
    type: array
    description: >-
      Append-only record of deliberate scope, weight and policy changes. A re-plan that moves any unit or gate away from
      its exact programme share must be covered by a NEW update here (graph-diff). owner_authorized is a record for review,
      not proof of identity.
    items:
      type: object
      required: [id, kind, reason]
      properties:
        id: {type: string, minLength: 1}
        kind: {enum: [SCOPE_EXPANSION, SCOPE_REDUCTION, UNIT_REWEIGHT, UNIT_DROPPED, POLICY_CHANGE]}
        reason: {type: string, minLength: 1}
        owner_authorized: {type: boolean}
        owner_basis: {type: string}
        units:
          type: array
          items: {$ref: '#/$defs/item_key'}
        nodes:
          type: array
          items: {$ref: '#/$defs/ref'}
      allOf:
        - if: {properties: {kind: {not: {const: POLICY_CHANGE}}}}
          then:
            anyOf:
              - {required: [units], properties: {units: {minItems: 1}}}
              - {required: [nodes], properties: {nodes: {minItems: 1}}}
  nodes:
    type: array
    minItems: 1
    items:
      type: object
      required: [ref, kind]
      properties:
        ref: {type: string, pattern: '^(?:[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?#)?[1-9][0-9]*$'}
        kind: {enum: [ROOT, INTERMEDIATE, LEAF]}
        parent: {type: string}
        weight:
          type: integer
          minimum: 1
          description: Weight among siblings. Fixed by the plan; a split must conserve it.
        reserve_weight:
          type: integer
          minimum: 0
          description: Undecomposed reserve on ROOT/INTERMEDIATE; counts as zero progress and blocks COMPLETE.
        responsibility_id:
          type: string
          minLength: 1
          description: Stable semantic Responsibility identity; never synthesized from the GitHub issue locator.
        spec_generation:
          type: integer
          minimum: 1
          description: Monotonic generation of this Responsibility's semantic/execution contract.
        primary_pr: {type: string}
        candidate_ref: {type: string, description: Branch/tag whose head is the candidate when there is no PR yet.}
        critical: {type: boolean}
        verification:
          type: array
          items: {enum: [VERIFIED, PARTIAL, FAILED, NOT_RUN, PENDING]}
        contract_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Legacy compatibility assertion; stable-identity mode derives the current digest mechanically.
        work_class:
          enum: [PRODUCT, MECHANICAL, GATE]
          description: PRODUCT (default) is held to the unit-count floor and share cap; MECHANICAL and GATE leaves are exempt from those two rules only.
        outcome: {type: string, description: One sentence - what is observably true when the leaf is done.}
        size_budget: {$ref: '#/$defs/size_budget'}
        write_surface:
          type: array
          description: Repo-relative file paths or directory prefixes ending in '/'. No globs, no '..', no absolute paths.
          items: {type: string, minLength: 1, pattern: '^[^*?\[\]\\]+$'}
        depends_on:
          type: array
          items: {$ref: '#/$defs/ref'}
          description: Leaves that must finish first. Orders leaves whose write surfaces overlap.
        parallel_ok:
          type: array
          items: {$ref: '#/$defs/ref'}
          description: Leaves whose overlapping write surface is safe to edit in parallel; needs parallel_ok_basis.
        parallel_ok_basis: {type: string}
        claim_relationships:
          type: array
          uniqueItems: true
          items: {$ref: '#/$defs/claim_relationship'}
          description: >-
            Relationship from this LEAF Responsibility to a declared parent acceptance claim.
            OWN directly satisfies a claim; ENABLES establishes a durable prerequisite/capability;
            GATE verifies or qualifies the claim and is not semantic ownership.
        transformation_boundaries:
          type: array
          uniqueItems: true
          description: >-
            Independently falsifiable transformation/authority boundaries crossed by this leaf.
            Ordinary atomic leaves normally declare exactly one boundary when the programme requires it.
          items:
            enum:
              - WIRE_SCHEMA
              - ENGINE_VALIDATION
              - COMPATIBILITY_NORMALIZATION
              - PROVIDER_ADAPTER
              - AUTHORITY_POLICY
              - DERIVED_RECONCILIATION
              - ACTUATION_UI_PROJECTION
              - CUSTODY_FENCING
              - ASSURANCE_POLICY
              - MIGRATION
              - QUALIFICATION_DOCS
              - PRODUCT_IMPLEMENTATION
        integration_basis:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Exceptional justification for intentionally keeping multiple independently falsifiable boundaries in one leaf.
        units:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, weight]
            properties:
              id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}
              weight: {type: integer, minimum: 1}
              verify: {type: string, description: The check, command or evidence that proves this unit.}
              outcome: {type: string}
              moved_from: {$ref: '#/$defs/ref', description: The leaf this unit used to live in (same unit id). Only meaningful in the plan that moves it.}
        coder_weight: {type: integer, minimum: 1}
        delivery_gates:
          type: array
          items:
            type: object
            required: [id, weight]
            properties:
              id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}
              weight: {type: integer, minimum: 1}
      allOf:
        - if: {properties: {kind: {const: LEAF}}}
          then: {required: [parent, weight, units]}
        - if: {properties: {kind: {const: INTERMEDIATE}}}
          then: {required: [parent, weight]}

allOf:
  - if:
      properties:
        programme:
          required: [graph_generation]
    then:
      properties:
        nodes:
          items:
            allOf:
              - if: {properties: {kind: {const: LEAF}}}
                then: {required: [responsibility_id, spec_generation]}
