      action: {type: string, maxLength: 200, pattern: '^[^\n]*$'}
  blocker: {type: string, maxLength: 200, pattern: '^[^\n]*$'}
  owner_action: {type: string, maxLength: 200, pattern: '^[^\n]*$'}
  result:
    type: object
    additionalProperties: false
    required: [scope]
    properties:
      scope: {enum: [STEP, PRODUCT, RESPONSIBILITY]}
      responsibility_complete: {enum: ['YES', 'NO', UNKNOWN]}
      superseded_by:
        type: string
        pattern: '^(?:[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?#)?[1-9][0-9]*$'
