$schema: https://json-schema.org/draft/2020-12/schema
$id: relay-v3.5-delp-checkpoint-facts
title: CHECKPOINT_FACTS_V1
description: >-
  The ONLY thing an engineering agent publishes about progress. It states facts about the agent's own leaf
  responsibility: which declared units it reports complete, the verification result, the durable evidence refs,
  the candidate those refs cover, and the next unit. It carries no percentage, title, weight, frontier count,
  activity epoch, parent/programme number or evidence-health verdict: every such field is rejected
  (additionalProperties: false), because those are derived by the DELP projector.
type: object
additionalProperties: false
required: [responsibility, material]
properties:
  schema:
    const: relay-v3.5-delp-checkpoint-facts
  responsibility:
    type: object
    additionalProperties: false
    required: [issue]
    properties:
      issue:
        type: string
        description: The leaf issue this record is evidence for. Must be a LEAF in the execution graph.
        pattern: '^(?:[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?#)?[1-9][0-9]*$'
      id:
        type: string
        minLength: 1
        description: Stable Responsibility identity. Required by admission when the execution graph is in stable-identity mode.
      spec_generation:
        type: integer
        minimum: 1
        description: Exact Responsibility semantic-contract generation this facts record was produced against.
      contract_digest:
        type: string
        pattern: '^sha256:[0-9a-f]{64}$'
        description: Exact mechanically derived Responsibility contract digest this facts record was produced against.
  material:
    type: object
    additionalProperties: false
    required: [candidate_sha]
    properties:
      pr:
        type: string
        pattern: '^(?:[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?#)?[1-9][0-9]*$'
      candidate_sha:
        type: string
        pattern: '^[0-9a-f]{40}$'
        description: Exact candidate commit the evidence in this record covers.
      base_sha:
        type: string
        pattern: '^[0-9a-f]{40}$'
  units:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, state]
      properties:
        id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}
        state: {enum: [COMPLETE, IN_PROGRESS, NOT_STARTED]}
        result: {enum: [VERIFIED, PARTIAL, FAILED, NOT_RUN, PENDING]}
        evidence_refs:
          type: array
          items: {type: string, minLength: 1}
        candidate_sha:
          type: string
          pattern: '^[0-9a-f]{40}$'
          description: Defaults to material.candidate_sha.
        contract_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
  gates:
    type: array
    description: Delivery-gate facts published by the reviewer / super-reviewer for this leaf.
    items:
      type: object
      additionalProperties: false
      required: [id, result]
      properties:
        id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}
        result: {enum: [PASSED, FAILED, NOT_RUN]}
        evidence_refs:
          type: array
          items: {type: string, minLength: 1}
        candidate_sha:
          type: string
          pattern: '^[0-9a-f]{40}$'
  activity:
    enum: [ACTIVE, WAITING_CI, WAITING_TOOL, WAITING_EXTERNAL, WAITING_PROVIDER_VISIBILITY, RECOVERING, PAUSED]
    description: QUIET and STALE are observed by a watcher and can never be declared by the executor.
  entry:
    type: object
    additionalProperties: false
    description: >-
      Optional takeover/lateral-entry evidence inside TASK_EVIDENCE. PREPARED binds the current Owner entry session to
      the graph and bounded child before coding; EXECUTION_END closes that child before the session advances. It carries
      no progress or authority.
    required: [event, mode, session_digest, plan_digest, child_ref, sequence, evidence_refs]
    properties:
      event: {enum: [PREPARED, EXECUTION_END]}
      mode: {const: TAKEOVER_RECONCILE}
      session_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}    required: [event, mode, frontier_digest, decision_at_risk]
    properties:
      event: {enum: [OFFERED, ACCEPTED]}
      mode: {enum: [CONTINUITY, INDEPENDENT_RECONSTRUCTION]}
      predecessor_ref: {type: [string, "null"], minLength: 1}
      frontier_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      decision_at_risk: {type: string, minLength: 1, maxLength: 200, pattern: '^[^\\n]*$'}
      result: {enum: [RECONCILED, DRIFT_FOUND, INSUFFICIENT_GROUNDING, OWNER_DECISION_REQUIRED]}
    description: >-
      Optional custody/reconstruction fact inside TASK_EVIDENCE. It never carries progress or title authority.
      OFFERED begins a handover frontier. ACCEPTED references the predecessor publication and may remain unreconciled.
  next:
    type: object
    additionalProperties: false
    properties:
      unit: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}
      action: {type: string, maxLength: 200, pattern: '^[^\n]*$'}
  blocker: {type: string, maxLength: 200, pattern: '^[^\n]*$'}
  owner_action: {type: string, maxLength: 200, pattern: '^[^\n]*$'}
  result:
    type: object
    additionalProperties: false
    required: [scope]
    properties:
      scope: {enum: [STEP, PRODUCT, RESPONSIBILITY]}
      responsibility_complete: {enum: ['YES', 'NO', UNKNOWN]}
      superseded_by:
        type: string
        pattern: '^(?:[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?#)?[1-9][0-9]*$'
}
      plan_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}    required: [event, mode, frontier_digest, decision_at_risk]
    properties:
      event: {enum: [OFFERED, ACCEPTED]}
      mode: {enum: [CONTINUITY, INDEPENDENT_RECONSTRUCTION]}
      predecessor_ref: {type: [string, "null"], minLength: 1}
      frontier_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      decision_at_risk: {type: string, minLength: 1, maxLength: 200, pattern: '^[^\\n]*$'}
      result: {enum: [RECONCILED, DRIFT_FOUND, INSUFFICIENT_GROUNDING, OWNER_DECISION_REQUIRED]}
    description: >-
      Optional custody/reconstruction fact inside TASK_EVIDENCE. It never carries progress or title authority.
      OFFERED begins a handover frontier. ACCEPTED references the predecessor publication and may remain unreconciled.
  next:
    type: object
    additionalProperties: false
    properties:
      unit: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}
      action: {type: string, maxLength: 200, pattern: '^[^\n]*$'}
  blocker: {type: string, maxLength: 200, pattern: '^[^\n]*$'}
  owner_action: {type: string, maxLength: 200, pattern: '^[^\n]*$'}
  result:
    type: object
    additionalProperties: false
    required: [scope]
    properties:
      scope: {enum: [STEP, PRODUCT, RESPONSIBILITY]}
      responsibility_complete: {enum: ['YES', 'NO', UNKNOWN]}
      superseded_by:
        type: string
        pattern: '^(?:[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?#)?[1-9][0-9]*$'
}
      child_ref:
        type: string
        pattern: '^(?:[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?#)?[1-9][0-9]*    required: [event, mode, frontier_digest, decision_at_risk]
    properties:
      event: {enum: [OFFERED, ACCEPTED]}
      mode: {enum: [CONTINUITY, INDEPENDENT_RECONSTRUCTION]}
      predecessor_ref: {type: [string, "null"], minLength: 1}
      frontier_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      decision_at_risk: {type: string, minLength: 1, maxLength: 200, pattern: '^[^\\n]*$'}
      result: {enum: [RECONCILED, DRIFT_FOUND, INSUFFICIENT_GROUNDING, OWNER_DECISION_REQUIRED]}
    description: >-
      Optional custody/reconstruction fact inside TASK_EVIDENCE. It never carries progress or title authority.
      OFFERED begins a handover frontier. ACCEPTED references the predecessor publication and may remain unreconciled.
  next:
    type: object
    additionalProperties: false
    properties:
      unit: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}
      action: {type: string, maxLength: 200, pattern: '^[^\n]*$'}
  blocker: {type: string, maxLength: 200, pattern: '^[^\n]*$'}
  owner_action: {type: string, maxLength: 200, pattern: '^[^\n]*$'}
  result:
    type: object
    additionalProperties: false
    required: [scope]
    properties:
      scope: {enum: [STEP, PRODUCT, RESPONSIBILITY]}
      responsibility_complete: {enum: ['YES', 'NO', UNKNOWN]}
      superseded_by:
        type: string
        pattern: '^(?:[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?#)?[1-9][0-9]*$'

      child_contract_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}    required: [event, mode, frontier_digest, decision_at_risk]
    properties:
      event: {enum: [OFFERED, ACCEPTED]}
      mode: {enum: [CONTINUITY, INDEPENDENT_RECONSTRUCTION]}
      predecessor_ref: {type: [string, "null"], minLength: 1}
      frontier_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      decision_at_risk: {type: string, minLength: 1, maxLength: 200, pattern: '^[^\\n]*$'}
      result: {enum: [RECONCILED, DRIFT_FOUND, INSUFFICIENT_GROUNDING, OWNER_DECISION_REQUIRED]}
    description: >-
      Optional custody/reconstruction fact inside TASK_EVIDENCE. It never carries progress or title authority.
      OFFERED begins a handover frontier. ACCEPTED references the predecessor publication and may remain unreconciled.
  next:
    type: object
    additionalProperties: false
    properties:
      unit: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}
      action: {type: string, maxLength: 200, pattern: '^[^\n]*$'}
  blocker: {type: string, maxLength: 200, pattern: '^[^\n]*$'}
  owner_action: {type: string, maxLength: 200, pattern: '^[^\n]*$'}
  result:
    type: object
    additionalProperties: false
    required: [scope]
    properties:
      scope: {enum: [STEP, PRODUCT, RESPONSIBILITY]}
      responsibility_complete: {enum: ['YES', 'NO', UNKNOWN]}
      superseded_by:
        type: string
        pattern: '^(?:[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?#)?[1-9][0-9]*$'
}
      sequence: {type: integer, minimum: 1}
      phase_plan_ref: {type: string, minLength: 1}
      reconciliation_ref: {type: string, minLength: 1}
      previous_leaf_ref:
        type: string
        pattern: '^(?:[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?#)?[1-9][0-9]*    required: [event, mode, frontier_digest, decision_at_risk]
    properties:
      event: {enum: [OFFERED, ACCEPTED]}
      mode: {enum: [CONTINUITY, INDEPENDENT_RECONSTRUCTION]}
      predecessor_ref: {type: [string, "null"], minLength: 1}
      frontier_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      decision_at_risk: {type: string, minLength: 1, maxLength: 200, pattern: '^[^\\n]*$'}
      result: {enum: [RECONCILED, DRIFT_FOUND, INSUFFICIENT_GROUNDING, OWNER_DECISION_REQUIRED]}
    description: >-
      Optional custody/reconstruction fact inside TASK_EVIDENCE. It never carries progress or title authority.
      OFFERED begins a handover frontier. ACCEPTED references the predecessor publication and may remain unreconciled.
  next:
    type: object
    additionalProperties: false
    properties:
      unit: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}
      action: {type: string, maxLength: 200, pattern: '^[^\n]*$'}
  blocker: {type: string, maxLength: 200, pattern: '^[^\n]*$'}
  owner_action: {type: string, maxLength: 200, pattern: '^[^\n]*$'}
  result:
    type: object
    additionalProperties: false
    required: [scope]
    properties:
      scope: {enum: [STEP, PRODUCT, RESPONSIBILITY]}
      responsibility_complete: {enum: ['YES', 'NO', UNKNOWN]}
      superseded_by:
        type: string
        pattern: '^(?:[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?#)?[1-9][0-9]*$'

      previous_evidence_ref: {type: string, minLength: 1}
      evidence_refs:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
    allOf:
      - if: {properties: {event: {const: PREPARED}}, required: [event]}
        then: {required: [phase_plan_ref, reconciliation_ref]}
      - if: {properties: {sequence: {minimum: 2}}, required: [sequence]}
        then: {required: [previous_leaf_ref, previous_evidence_ref]}
      - if: {properties: {sequence: {const: 1}}, required: [sequence]}
        then:
          not:
            anyOf:
              - {required: [previous_leaf_ref]}
              - {required: [previous_evidence_ref]}
  handover:
    type: object
    additionalProperties: false
    required: [event, mode, frontier_digest, decision_at_risk]
    properties:
      event: {enum: [OFFERED, ACCEPTED]}
      mode: {enum: [CONTINUITY, INDEPENDENT_RECONSTRUCTION]}
      predecessor_ref: {type: [string, "null"], minLength: 1}
      frontier_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      decision_at_risk: {type: string, minLength: 1, maxLength: 200, pattern: '^[^\\n]*$'}
      result: {enum: [RECONCILED, DRIFT_FOUND, INSUFFICIENT_GROUNDING, OWNER_DECISION_REQUIRED]}
    description: >-
      Optional custody/reconstruction fact inside TASK_EVIDENCE. It never carries progress or title authority.
      OFFERED begins a handover frontier. ACCEPTED references the predecessor publication and may remain unreconciled.
