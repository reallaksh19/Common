$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, generated_from, owner, technical]
properties:
  schema_version: {const: relay-v2.5-communication-projection}
  generated_from:
    type: object
    required: [report_projection_digest, report_sources, owner_publication_cursor_digest]
    properties:
      report_projection_digest: {type: string, pattern: '^sha256:'}
      report_sources: {type: object}
      owner_publication_cursor_digest: {type: [string, 'null']}
  owner:
    type: object
    required: [change, status_cadence, capability, current_work, purpose, scope, evidence, quality, control, roadmap, delivery, decisions, next_work, external_actions, stop_conditions]
    properties:
      change:
        type: object
        required: [event_class, changed_dimensions, publication_due, current_digest, details, previous_publication_id, previous_sequence, cursor_path, cursor_present]
        properties:
          event_class:
            enum: [INITIAL_SNAPSHOT, TASK_PROGRESS, TASK_REGRESSION, IMPLEMENTATION_CHANGE, EVIDENCE_PROGRESS, DELIVERY_OR_CUSTODY_PROGRESS, CONTROL_STATE_CHANGE, WAITING_OR_MONITORING, NO_MATERIAL_PROGRESS]
          changed_dimensions:
            type: array
            items: {type: string}
          publication_due: {type: boolean}
          current_digest: {type: string, pattern: '^sha256:'}
          details: {type: object}
          previous_publication_id: {type: [string, 'null']}
          previous_sequence: {type: [integer, 'null']}
          cursor_path: {type: string, minLength: 1}
          cursor_present: {type: boolean}
      status_cadence:
        type: object
        required: [default_after_minutes, required, effective_after_minutes, owner_override]
        properties:
          default_after_minutes: {const: 25}
          required: {type: boolean}
          effective_after_minutes: {type: [integer, 'null']}
          owner_override: {type: [object, 'null']}
      capability:
        type: object
        required: [summary, can_continue, material_authority, active_stop]
      current_work:
        type: object
        required: [objective, phase, work_package, ep_id, progress_basis, overall_percent, phase_percent, work_package_percent, ep_percent, issues, outcome]
        properties:
          progress_basis: {type: object}
          issues: {type: array}
          outcome: {type: object}
      purpose: {type: object}
      scope:
        type: object
        required: [protected, prohibited, owner_reserved, deliberate_non_goals]
      evidence:
        type: object
        required: [state, summary, not_run, acceptance]
      quality:
        type: object
        required: [state, visible_risks, procedure_gaps, known_limitations, known_problems]
      control:
        type: object
        required: [pending_validations, known_issues, delegations, boundary_blockers, active_execution_overrides, execution_custody]
        properties:
          pending_validations: {type: array}
          known_issues: {type: array}
          delegations: {type: array}
          boundary_blockers: {type: object}
          active_execution_overrides: {type: array}
          execution_custody: {type: object}
      roadmap:
        type: object
        required: [summary, progress, last_reconciliation]
      delivery:
        type: object
        required: [applicability, provider, observation_id, observation_path, vehicle, mergeability, checks, review, ready_for_review, technical_ready_to_merge, merge_authorization, unmerged_prs]
      decisions:
        type: object
        required: [required_now, recorded, reserved]
      next_work:
        type: object
        required: [steps]
      external_actions:
        type: array
        items:
          type: object
          required: [id, type, actor, environment, working_directory, required_basis, unavailable_here_reason, expected_evidence, blocks, success_condition, clears, delegation, action, expected_result]
          properties:
            delegation:
              type: object
              required: [mode, prompt, publication, response_check]
      stop_conditions: {type: array}
  technical:
    type: object
    required: [report]
    properties:
      report: {type: object}
additionalProperties: false
