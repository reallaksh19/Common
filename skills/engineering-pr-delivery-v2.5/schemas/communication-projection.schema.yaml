$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, generated_from, owner, technical]
properties:
  schema_version: {const: relay-v2.5-communication-projection}
  generated_from:
    type: object
    required: [report_projection_digest, report_sources]
    properties:
      report_projection_digest: {type: string, pattern: '^sha256:'}
      report_sources: {type: object}
  owner:
    type: object
    required: [capability, current_work, purpose, scope, evidence, quality, roadmap, decisions, next_work, external_actions, stop_conditions]
    properties:
      capability:
        type: object
        required: [summary, can_continue, material_authority, active_stop]
      current_work:
        type: object
        required: [objective, phase, work_package, ep_id, overall_percent, phase_percent, work_package_percent, ep_percent, issues, outcome]
        properties:
          issues: {type: array}
          outcome: {type: object}
      purpose: {type: object}
      scope:
        type: object
        required: [protected, prohibited, owner_reserved, deliberate_non_goals]
      evidence:
        type: object
        required: [state, summary, not_run, acceptance]
      quality:
        type: object
        required: [state, visible_risks, procedure_gaps, known_limitations, known_problems]
      roadmap:
        type: object
        required: [summary, progress, last_reconciliation]
      decisions:
        type: object
        required: [required_now, recorded, reserved]
      next_work:
        type: object
        required: [steps]
      external_actions:
        type: array
        items:
          type: object
          required: [id, type, actor, environment, working_directory, required_basis, unavailable_here_reason, expected_evidence, blocks, success_condition, clears, action, expected_result]
      stop_conditions: {type: array}
  technical:
    type: object
    required: [report]
    properties:
      report: {type: object}
additionalProperties: false
