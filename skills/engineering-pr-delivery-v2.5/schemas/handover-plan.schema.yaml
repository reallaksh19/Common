$schema: https://json-schema.org/draft/2020-12/schema
type: object
required:
  - status
  - schema_version
  - source_report_digest
  - work_contract
  - intent
  - inputs
  - benchmarks
  - expected_outcomes
  - text_requirements
  - owner_core_requirements
  - issue_strategy
  - generator
properties:
  status: {const: READY}
  schema_version: {const: relay-v2.5-handover-plan}
  source_report_digest: {type: string, pattern: '^sha256:'}
  work_contract:
    type: object
    required: [status, kind, id]
    properties:
      status: {const: RESOLVED}
      kind: {enum: [GITHUB_ISSUE, ACTIVE_TASK, ROADMAP_WORK_PACKAGE]}
      id: {type: string, minLength: 1}
      work_package: {type: [string, 'null']}
      issue: {type: object}
      outcome: {type: object}
  intent:
    type: array
    items:
      type: object
      required: [id, kind, what_remains, why_it_remains, basis, done_when]
      properties:
        id: {type: string, minLength: 1}
        kind: {enum: [ACCEPTANCE, EVIDENCE, NEXT_WORK, REMAINING_WORK, OWNER_DECISION]}
        what_remains: {type: string, minLength: 1}
        why_it_remains: {type: string, minLength: 1}
        basis: {type: array}
        done_when: {type: string, minLength: 1}
  inputs:
    type: array
    items: {$ref: '#/$defs/durable_ref'}
  benchmarks:
    type: array
    items: {$ref: '#/$defs/durable_ref'}
  expected_outcomes:
    type: object
    required: [user_visible, engineering, next_results]
  text_requirements:
    type: object
    required: [protected, prohibited, owner_reserved, deliberate_non_goals, known_problems]
  owner_core_requirements:
    type: array
    items: {type: string, minLength: 1}
  issue_strategy:
    type: object
    required:
      - handover_key
      - body_marker
      - reuse_rule
      - relationship_preference
      - relationship_fallback
      - relationship_claim
    properties:
      handover_key: {type: string, pattern: '^sha256:'}
      body_marker: {type: string, minLength: 1}
      reuse_rule: {const: UPDATE_MATCHING_OPEN_HANDOVER_ISSUE_FOR_SAME_KEY_ELSE_CREATE}
      relationship_preference: {const: NATIVE_SUB_ISSUE_IF_SUPPORTED_AND_VERIFIED}
      relationship_fallback: {const: VERIFIED_RECIPROCAL_REFERENCE}
      relationship_claim: {const: UNVERIFIED_UNTIL_PROVIDER_READBACK}
  generator:
    type: object
    required:
      - compatibility_path
      - canonical_launcher
      - canonical_schema
      - mode
      - complex_mode
      - visible_q1_q5
      - target_status
      - authorized_actions_rule
    properties:
      mode: {const: THREE_PASS_ONLY}
      complex_mode: {type: boolean}
      visible_q1_q5: {type: boolean}
      target_status: {enum: [READY, AWAITING_HANDOVER_ISSUE_READBACK]}
      target: {type: [string, 'null']}
      authorized_actions_rule: {const: MUST_NOT_EXCEED_GOVERNING_OWNER_AND_WORK_AUTHORITY}
$defs:
  durable_ref:
    type: object
    required: [id, definition_path, source]
    properties:
      id: {type: [string, 'null']}
      name: {type: [string, 'null']}
      definition_path: {type: [string, 'null']}
      source: {type: [string, 'null']}
      authority: {}
      resolution: {}
additionalProperties: false
