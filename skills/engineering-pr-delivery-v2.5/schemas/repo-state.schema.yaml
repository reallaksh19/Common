$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, relay_state, repository, relay_protocol, roadmap, current_position, execution_policy, active_ep, last_checkpoint, progress, status_planes, projection, relay_readiness, chat_context_required]
properties:
  schema_version: {const: relay-v2.5}
  relay_state: {enum: [INITIALIZING, ACTIVE, PARALLEL, IDLE, TERMINAL]}
  relay_protocol:
    type: object
    required: [version, basis_ref]
    properties:
      version: {const: '2.5'}
      basis_ref: {type: string, minLength: 1}
  roadmap:
    type: object
    required: [id, revision, path]
  current_position:
    type: object
    required: [objective, phase, work_package]
    properties:
      objective: {type: string}
      phase: {type: string}
      work_package: {type: string}
      work_packages:
        type: array
        items: {type: string}
        uniqueItems: true
  execution_policy:
    type: object
    required: [mode]
    properties:
      mode: {enum: [SERIAL, OWNER_APPROVED_PARALLEL]}
      parallel_plan: {type: string}
  active_ep:
    type: object
    required: [id, path, state]
    properties:
      id: {type: [string, 'null']}
      path: {type: [string, 'null']}
      state: {enum: [NONE, EXECUTABLE, ACTIVE, RECONCILING, ROUTER]}
      continuity_receipt: {type: [string, 'null']}
  last_checkpoint:
    type: object
    required: [id, path]
  predecessor_join:
    type: object
    required: [id, path]
    properties:
      id: {type: [string, 'null']}
      path: {type: [string, 'null']}
  predecessor_replan:
    type: object
    required: [id, path]
    properties:
      id: {type: [string, 'null']}
      path: {type: [string, 'null']}
  status_planes:
    type: object
    required: [execution, quality, evidence, stop]
    properties:
      execution:
        type: object
        required: [state, can_continue, material_authority, next_action]
        properties:
          state: {enum: [IDLE, READY, ACTIVE, WAITING, COMPLETE]}
          can_continue: {type: boolean}
          material_authority: {enum: [WRITE, READ_ONLY, NONE]}
          next_action: {type: string, minLength: 1}
      quality:
        type: object
        required: [state, findings]
        properties:
          state: {enum: [CLEAR, NEEDS_ATTENTION, OWNER_REVIEW_REQUIRED]}
          findings: {type: array}
      evidence:
        type: object
        required: [state, summary, not_run]
        properties:
          state: {enum: [COMPLETE, PARTIAL, NOT_RUN, FAILED, NA]}
          summary: {type: string}
          not_run: {type: array}
      stop:
        type: object
        required: [active, category, reason, basis]
        properties:
          active: {type: boolean}
          category: {enum: [NONE, OWNER_DECISION_REQUIRED, ESSENTIAL_INPUT_MISSING, AUTHORITY_VIOLATION, PROTECTED_INVARIANT_FAILURE, WRITE_COLLISION, SUPERSEDED_EP, ROADMAP_CONFLICT, REPOSITORY_STATE_CONFLICT, UNSAFE_ENGINEERING_RESULT]}
          reason: {type: string}
          basis: {type: array}
  projection:
    type: object
    required: [required, state, operation_id, target, roadmap_revision, execution_ref, receipt, basis]
    properties:
      required: {type: boolean}
      state: {enum: [NOT_REQUIRED, PENDING, PUBLISHED_UNCONFIRMED, IN_SYNC, STALE]}
      operation_id: {type: [string, 'null']}
      target: {type: [string, 'null']}
      roadmap_revision: {type: [string, 'null']}
      execution_ref: {type: [string, 'null']}
      receipt: {type: [string, 'null']}
      basis: {type: array}
      observed:
        type: [object, 'null']
        properties:
          operation_id: {type: string, minLength: 1}
          target: {type: string, minLength: 1}
          roadmap_revision: {type: string, minLength: 1}
          execution_ref: {type: string, minLength: 1}
          receipt: {type: string, minLength: 1}
          basis: {type: array, minItems: 1}
      superseded_operations:
        type: array
        items:
          type: object
          required: [operation_id, target, roadmap_revision, execution_ref, disposition, superseded_by, receipt, basis]
          properties:
            operation_id: {type: string, minLength: 1}
            target: {type: string, minLength: 1}
            roadmap_revision: {type: string, minLength: 1}
            execution_ref: {type: string, minLength: 1}
            disposition: {enum: [SUPERSEDED_BEFORE_PUBLICATION, SUPERSEDED_AFTER_PUBLICATION_UNCONFIRMED]}
            superseded_by: {type: string, minLength: 1}
            receipt: {type: [string, 'null']}
            basis: {type: array}
  relay_readiness:
    type: object
    required: [repository_ready, projection_ready, handover_ready, reasons]
    properties:
      repository_ready: {type: boolean}
      projection_ready: {type: boolean}
      handover_ready: {type: boolean}
      reasons: {type: array}
  chat_context_required: {const: false}
additionalProperties: true
