$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, id, decision, effects, impact, affected, required_reconciliation, status]
properties:
  schema_version: {const: relay-v2.5}
  decision:
    type: object
    required: [authority, kind, statement, source]
    properties:
      authority: {const: OWNER}
      kind: {enum: [INTENT_MUTATION, DEFERRAL, AUTHORIZATION, DECLINE, NO_CHANGE_CONFIRMATION]}
      statement: {type: string, minLength: 1}
      source: {type: string, minLength: 1}
  effects:
    type: object
    required: [requirement_disposition, grants_material_write_authority, pending_items]
    properties:
      requirement_disposition: {enum: [NOT_APPLICABLE, SATISFIED, PENDING_NOT_SATISFIED]}
      grants_material_write_authority: {type: boolean}
      pending_items: {type: array, items: {type: string}, uniqueItems: true}
  delivery_authorization:
    type: [object, 'null']
    required: [action, provider, repository, vehicle, number, head_sha, disposition]
    properties:
      action: {const: MERGE}
      provider: {const: GITHUB}
      repository: {type: string, minLength: 1}
      vehicle: {const: PULL_REQUEST}
      number: {type: integer, minimum: 1}
      head_sha: {type: string, minLength: 1}
      disposition: {enum: [GRANTED, REVOKED]}
  execution_override:
    type: [object, 'null']
    required: [disposition, scope, defers, allows, blocks, pending_obligations]
    properties:
      disposition: {enum: [GRANTED, REVOKED]}
      scope:
        type: object
        required: [repository, branch, base_sha, allowed_write_paths]
        properties:
          repository: {type: string, minLength: 1}
          branch: {type: string, minLength: 1}
          base_sha: {type: string, minLength: 7}
          route_key: {type: [string, 'null']}
          issues: {type: array, items: {type: integer, minimum: 1}, uniqueItems: true}
          pull_requests: {type: array, items: {type: integer, minimum: 1}, uniqueItems: true}
          allowed_write_paths: {type: array, items: {type: string, minLength: 1}, minItems: 1, uniqueItems: true}
      defers:
        type: array
        minItems: 1
        uniqueItems: true
        items: {enum: [CANDIDATE_ADMISSION, ROUTE_RECONCILIATION, LOCAL_VALIDATION_ENVIRONMENT, EVIDENCE_COLLECTION]}
      allows:
        type: array
        minItems: 1
        uniqueItems: true
        items: {enum: [BOUNDED_PRODUCT_WRITES, TESTS, DRAFT_PR_UPDATES]}
      blocks:
        type: array
        minItems: 1
        uniqueItems: true
        items: {enum: [PR_READY, MERGE, CHECKPOINT, RELEASE]}
      pending_obligations:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^PEND-'}
  status: {enum: [CAPTURED, APPLIED, SUPERSEDED]}
additionalProperties: true
