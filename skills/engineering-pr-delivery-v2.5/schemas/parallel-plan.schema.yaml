$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, id, owner_approval, ascii_topology, lanes, shared_write_exceptions, integration, risks, stop_conditions]
properties:
  schema_version: {const: relay-v2.5}
  id: {type: string, minLength: 1}
  previous_replan: {type: [string, 'null']}
  previous_replan_path: {type: [string, 'null']}
  owner_approval:
    type: object
    required: [approved, authority, source, approval_token]
    properties:
      approved: {const: true}
      authority: {const: OWNER}
      source: {type: string, minLength: 1}
      approval_token: {type: string, minLength: 1}
  ascii_topology: {type: string, minLength: 10}
  lanes:
    type: array
    minItems: 2
    items:
      type: object
      required: [id, state, work_package, ep_id, ep_path, branch, write_domains, shared_read_domains]
      properties:
        state: {enum: [ACTIVE, WAITING]}
        write_domains: {type: array, minItems: 1, items: {type: string, minLength: 1}}
        shared_read_domains: {type: array, items: {type: string}}
  shared_write_exceptions: {type: array}
  integration:
    type: object
    required: [owner, work_package, planned_ep_id, creation_policy, depends_on_lanes]
    properties:
      creation_policy: {const: WHEN_FRONTIER}
      depends_on_lanes: {type: array, minItems: 2, items: {type: string}, uniqueItems: true}
  risks: {type: array, minItems: 1}
  stop_conditions: {type: array, minItems: 1}
additionalProperties: true
