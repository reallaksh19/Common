$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, id, candidate, question_set, route, answers, evaluated_by, evaluations, self_evaluation, result, conversation_context_used]
properties:
  schema_version: {const: relay-v2.5-qualification}
  id: {type: string, pattern: '^QUAL-'}
  candidate:
    type: object
    required: [agent_instance_id]
    properties:
      agent_instance_id: {type: string, minLength: 1}
  question_set:
    type: object
    required: [id, path]
    properties:
      id: {type: string, pattern: '^QSET-'}
      path: {type: string, minLength: 1}
  route:
    type: object
    required: [route_key, mode, execution_ref, ep_id, ep_path, plan_id, plan_path, lane_id, roadmap_revision, work_package, ep_contract_digest]
    properties:
      route_key: {type: string, minLength: 1}
      mode: {enum: [SERIAL, PARALLEL_LANE]}
      execution_ref: {type: string, minLength: 1}
      ep_id: {type: string, minLength: 1}
      ep_path: {type: string, minLength: 1}
      plan_id: {type: [string, 'null']}
      plan_path: {type: [string, 'null']}
      lane_id: {type: [string, 'null']}
      roadmap_revision: {type: string, minLength: 1}
      work_package: {type: string, minLength: 1}
      ep_contract_digest: {type: string, pattern: '^sha256:'}
  answers:
    type: array
    minItems: 5
    maxItems: 5
    items:
      type: object
      required: [id, response, outputs, evidence]
  evaluated_by:
    type: object
    required: [type, identity, basis]
    properties:
      type: {enum: [INDEPENDENT_AGENT, OWNER, DETERMINISTIC_VALIDATOR]}
      identity: {type: string, minLength: 1}
      basis: {type: array, minItems: 1}
  evaluations:
    type: array
    minItems: 5
    maxItems: 5
    items:
      type: object
      required: [id, status, basis]
      properties:
        status: {enum: [PASS, FAIL]}
        basis: {type: array, minItems: 1}
  self_evaluation:
    type: object
    required: [allowed]
    properties:
      allowed: {const: false}
  result: {enum: [PASS, FAIL]}
  conversation_context_used: {const: false}
additionalProperties: true
