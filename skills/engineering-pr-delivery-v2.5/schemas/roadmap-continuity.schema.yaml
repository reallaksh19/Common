$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, id, ep_id, work_package, from_revision, to_revision, revision_chain, disposition, impact_checks, basis]
properties:
  schema_version: {const: relay-v2.5-roadmap-continuity}
  id: {type: string, minLength: 1}
  ep_id: {type: string, minLength: 1}
  work_package: {type: string, minLength: 1}
  from_revision: {type: string, minLength: 1}
  to_revision: {type: string, minLength: 1}
  revision_chain:
    type: array
    minItems: 1
    items:
      type: object
      required: [path]
      properties:
        path: {type: string, minLength: 1}
  disposition: {enum: [CONTINUE_UNCHANGED, RECONCILE_REQUIRED, INVALIDATED]}
  impact_checks:
    type: object
    required: [work_package_definition_changed, dependencies_changed, acceptance_changed, scope_authority_changed, protected_invariants_changed]
    properties:
      work_package_definition_changed: {type: boolean}
      dependencies_changed: {type: boolean}
      acceptance_changed: {type: boolean}
      scope_authority_changed: {type: boolean}
      protected_invariants_changed: {type: boolean}
  basis:
    type: array
    minItems: 1
additionalProperties: true
