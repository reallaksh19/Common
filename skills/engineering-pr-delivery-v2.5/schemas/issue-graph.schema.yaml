$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, nodes, relationships]
properties:
  schema_version: {const: relay-v2.5}
  graph_revision: {type: string, minLength: 1}
  nodes:
    type: array
    items:
      type: object
      required: [state, github_state]
      properties:
        state: {enum: [OPEN, ACTIVE, COMPLETE, SUPERSEDED, CANCELLED]}
        github_state: {enum: [ABSENT, OPEN, CLOSED, UNKNOWN]}
        github:
          type: object
          properties:
            issue_number: {type: [integer, 'null']}
            issue_id: {type: [integer, string, 'null']}
            url: {type: [string, 'null']}
        child_rollup:
          type: object
          required: [graph_revision, direct_children, derived_state, all_children_terminal]
          properties:
            graph_revision: {type: string, minLength: 1}
            direct_children:
              type: array
              items:
                type: object
                required: [id, state, github_state]
            derived_state: {enum: [OPEN, ACTIVE, COMPLETE]}
            all_children_terminal: {type: boolean}
        closure_receipt:
          type: object
          properties:
            acceptance_terminal: {type: boolean}
            evidence_terminal: {type: boolean}
            acceptance: {type: array}
            evidence: {type: array}
            unresolved_items: {type: array}
            remaining_work_disposition: {enum: [NONE, TRANSFERRED_TO_SUCCESSOR, SUPERSEDED_BY_SUCCESSOR, CANCELLED_BY_OWNER]}
            successor: {type: [string, 'null']}
        supersession_receipt:
          type: object
          properties:
            successor: {type: string, minLength: 1}
            basis: {type: array, minItems: 1}
            unresolved_acceptance: {type: array}
            inputs: {type: array}
            risks: {type: array}
            decisions: {type: array}
            evidence: {type: array}
        supersession_inheritance:
          type: object
          properties:
            predecessor: {type: string, minLength: 1}
            basis: {type: array, minItems: 1}
            unresolved_acceptance: {type: array}
            inputs: {type: array}
            risks: {type: array}
            decisions: {type: array}
            evidence: {type: array}
        supersession_resolution:
          type: object
          properties:
            acceptance: {type: array}
            evidence: {type: array}
  relationships:
    type: array
    items:
      type: object
      required: [from, relation, to]
      properties:
        relation:
          enum: [PARENT_OF, DEPENDS_ON, BLOCKS, SUPERSEDES, REVISION_OF, RELATES_TO, INTEGRATED_BY, DUPLICATES]
additionalProperties: true
