$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, nodes, relationships]
properties:
  schema_version: {const: relay-v2.5}
  nodes:
    type: array
    items:
      type: object
      required: [state, github_state]
      properties:
        state: {enum: [OPEN, ACTIVE, COMPLETE, SUPERSEDED, CANCELLED]}
        github_state: {enum: [OPEN, CLOSED]}
        closure_receipt:
          type: object
          properties:
            acceptance_terminal: {type: boolean}
            evidence_terminal: {type: boolean}
            acceptance: {type: array}
            evidence: {type: array}
            unresolved_items: {type: array}
            remaining_work_disposition: {enum: [NONE, TRANSFERRED_TO_SUCCESSOR, SUPERSEDED_BY_SUCCESSOR, CANCELLED_BY_OWNER]}
            successor: {type: [string, 'null']}
        supersession_receipt:
          type: object
          properties:
            basis: {type: array, minItems: 1}
            unresolved_acceptance: {type: array}
            evidence: {type: array}
        supersession_inheritance:
          type: object
          properties:
            basis: {type: array, minItems: 1}
            unresolved_acceptance: {type: array}
            evidence: {type: array}
  relationships:
    type: array
    items:
      type: object
      required: [from, relation, to]
      properties:
        relation:
          enum: [PARENT_OF, DEPENDS_ON, BLOCKS, SUPERSEDES, REVISION_OF, RELATES_TO, INTEGRATED_BY, DUPLICATES]
additionalProperties: true
