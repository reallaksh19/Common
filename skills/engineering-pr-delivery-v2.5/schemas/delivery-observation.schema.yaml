$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, id, provider, repository, vehicle, mergeability, checks, review, description_contract, readback_basis]
properties:
  schema_version: {const: relay-v2.5-delivery-observation}
  id: {type: string, pattern: '^DOBS-'}
  provider: {const: GITHUB}
  repository: {type: string, minLength: 1}
  vehicle:
    type: object
    required: [kind, number, url, lifecycle, head, base]
    properties:
      kind: {const: PULL_REQUEST}
      number: {type: integer, minimum: 1}
      url: {type: string, minLength: 1}
      lifecycle: {enum: [DRAFT, OPEN, CLOSED, MERGED, UNKNOWN]}
      head:
        type: object
        required: [ref, sha]
        properties:
          ref: {type: [string, 'null']}
          sha: {type: [string, 'null']}
      base:
        type: object
        required: [ref, sha]
        properties:
          ref: {type: [string, 'null']}
          sha: {type: [string, 'null']}
  mergeability:
    type: object
    required: [state]
    properties:
      state: {enum: [MERGEABLE, CONFLICTING, UNKNOWN]}
  checks:
    type: object
    required: [state, head_sha, required, observations]
    properties:
      state: {enum: [PASS, FAIL, PENDING, NOT_RUN, STALE, UNKNOWN]}
      head_sha: {type: [string, 'null']}
      required: {type: array}
      observations: {type: array}
  review:
    type: object
    required: [state, unresolved_threads, change_requests]
    properties:
      state: {enum: [CLEAR, CHANGES_REQUESTED, PENDING, UNKNOWN]}
      unresolved_threads: {type: [integer, 'null'], minimum: 0}
      change_requests: {type: [integer, 'null'], minimum: 0}
  description_contract:
    type: object
    required: [marker, marker_present, body_digest, correlations]
    properties:
      marker: {const: '<!-- relay-pr-correlation:v1 -->'}
      marker_present: {const: true}
      body_digest: {type: string, pattern: '^sha256:'}
      correlations:
        type: array
        minItems: 1
        items:
          type: object
          required: [issue_node, issue_number, ep_id, ep_path, work_package, relationship, meaning]
          properties:
            issue_node: {type: string, minLength: 1}
            issue_number: {type: integer, minimum: 1}
            ep_id: {type: string, pattern: '^EP-'}
            ep_path: {type: string, minLength: 1}
            work_package: {type: string, minLength: 1}
            relationship: {enum: [IMPLEMENTS, INTEGRATES, VERIFIES, REMEDIATES]}
            meaning: {type: string, minLength: 1}
  readback_basis:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
additionalProperties: false
