$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, roadmap, objectives]
properties:
  schema_version: {const: relay-v2.5}
  roadmap:
    type: object
    required: [id, revision, title]
  objectives:
    type: array
    minItems: 1
additionalProperties: true
