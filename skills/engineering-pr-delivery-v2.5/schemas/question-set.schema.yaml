$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, id, route, boundary, questions, prepared_by]
properties:
  schema_version: {const: relay-v2.5-question-set}
  id: {type: string, pattern: '^QSET-'}
  route:
    type: object
    required: [ep_id, ep_path, roadmap_revision, work_package, ep_contract_digest]
  boundary:
    type: object
    required: [trigger, from_phase, to_phase, changed_dimensions, basis]
    properties:
      trigger: {enum: [PHASE_CHANGED, MATERIAL_QUALIFICATION_BOUNDARY_CHANGED]}
      changed_dimensions:
        type: array
        minItems: 1
        items:
          enum: [PRODUCTION_PATH, ENGINEERING_AUTHORITY, NUMERICAL_METHOD, PROTECTED_INVARIANT, INPUT_AUTHORITY, VERIFICATION_ORACLE]
      basis: {type: array, minItems: 1}
  questions:
    type: array
    minItems: 5
    maxItems: 5
  prepared_by:
    type: object
    required: [agent_instance_id]
additionalProperties: true
