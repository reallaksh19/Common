schema_version: relay-v2.5
relay_state: ACTIVE
repository:
  name: "<repo-name>"
  remote: "<owner/repo>"
relay_protocol:
  version: "2.5"
  basis_ref: "<pinned Common SHA>"
roadmap:
  id: "<roadmap-id>"
  revision: "<RM-xxxx>"
  path: agents/relay/roadmap/OVERALL_ROADMAP.yaml
current_position:
  objective: "<OBJ-id>"
  phase: "<PHASE-id>"
  work_package: "<WP-id>"
  work_packages: []
execution_policy:
  mode: SERIAL
active_ep:
  id: "<EP-id>"
  path: agents/relay/execution-packages/<EP-id>.yaml
  state: EXECUTABLE
  continuity_receipt: null
last_checkpoint:
  id: NONE
  path: null
predecessor_join:
  id: null
  path: null
predecessor_replan:
  id: null
  path: null
progress:
  overall_percent: 0
  phase_percent: 0
  ep_percent: 0
  basis_revision: "<PB-id>"
status_planes:
  execution:
    state: READY
    can_continue: true
    material_authority: WRITE
    next_action: "<exact next action>"
  quality:
    state: CLEAR
    findings: []
  evidence:
    state: PARTIAL
    summary: "<plain-language evidence summary>"
    not_run: []
  stop:
    active: false
    category: NONE
    reason: ""
    basis: []
projection:
  required: true
  state: PENDING
  # Top-level operation always represents the newest desired repository projection.
  operation_id: "<stable operation id for newest desired generation>"
  target: "<durable external projection target>"
  roadmap_revision: "<current RM-xxxx>"
  execution_ref: "<current EP-id / PLAN-id / NONE>"
  receipt: null
  basis: []
  # Required for STALE when the external surface still reflects an older generation.
  observed: null
  # Any intermediate desired generation that lost authority is retained here and
  # chained through superseded_by to the current operation. Never retry these IDs.
  superseded_operations: []
relay_readiness:
  repository_ready: true
  projection_ready: false
  handover_ready: false
  reasons:
    - Required external coordination projection is not yet synchronized.
chat_context_required: false
