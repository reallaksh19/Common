schema_version: relay-v2.5
relay_state: ACTIVE
repository:
  name: "<repo-name>"
  remote: "<owner/repo>"
relay_protocol:
  version: "2.5"
  basis_ref: "<pinned Common SHA>"
roadmap:
  id: "<roadmap-id>"
  revision: "<RM-xxxx>"
  path: agents/relay/roadmap/OVERALL_ROADMAP.yaml
current_position:
  objective: "<OBJ-id>"
  phase: "<PHASE-id>"
  work_package: "<WP-id>"
  work_packages: []
execution_policy:
  mode: SERIAL
active_ep:
  id: "<EP-id>"
  path: agents/relay/execution-packages/<EP-id>.yaml
  state: EXECUTABLE
  continuity_receipt: null
last_checkpoint:
  id: NONE
  path: null
predecessor_join:
  id: null
  path: null
predecessor_replan:
  id: null
  path: null
takeover_admissions: []

# Optional execution-custody layer. Certification proves a candidate is qualified;
# custody identifies who currently owns material execution on a route. At most one
# ACTIVE lease is allowed per route.
execution_custody:
  enforced: true
  leases: []

# Durable control obligations survive cold starts and timer wakes. These records
# must never be silently converted to PASS; lifecycle transitions require evidence.
control_obligations: []
# Examples:
# - id: PEND-0123-001
#   kind: DEFERRED_VALIDATION
#   state: OPEN
#   summary: "Reconcile route custody before PR readiness."
#   source: "ODR-0012"
#   scope: {route_key: null, ep_id: EP-0010, branch: fix/example, issues: [123], pull_requests: [456]}
#   evidence: ["workflow:12345"]
#   must_resolve_before: [PR_READY, MERGE]
#   allowed_before_resolution: [BOUNDED_PRODUCT_WRITES, TESTS, DRAFT_PR_UPDATES]
#   resolution_condition: "Current route/custody validates on the exact PR head."
#
# - id: KI-0123-001
#   kind: KNOWN_ISSUE
#   state: OPEN
#   summary: "Known non-blocking limitation."
#   source: "issue #123"
#   scope: {route_key: null, ep_id: EP-0010, branch: fix/example, issues: [123], pull_requests: [456]}
#   evidence: []
#   revisit_when: "A consumer reaches this boundary."
#
# - id: DLG-0123-001
#   kind: DELEGATION
#   state: OPEN
#   summary: "External browser verification."
#   source: "EP-0010 next_work"
#   scope: {route_key: SERIAL:EP-0010, ep_id: EP-0010, branch: fix/example, issues: [123], pull_requests: [456]}
#   evidence: []
#   success_condition: "The delegated browser evidence is posted and validated."
#   monitor_role: READ_ONLY

# Compatibility/location mirrors only. PROGRESS.yaml is authoritative and
# validate_progress.py requires these values to agree with the derived source rows.
progress:
  overall_percent: 0
  phase_percent: 0
  ep_percent: 0
  basis_revision: "<PB-id>"
status_planes:
  execution:
    state: READY
    can_continue: true
    material_authority: WRITE
    # Machine hint only; the EP next_work.steps[] contract is the detailed successor plan.
    next_action: "<short operational hint>"
  quality:
    state: CLEAR
    findings: []
  evidence:
    state: PARTIAL
    summary: "<plain-language evidence summary>"
    not_run: []
  stop:
    active: false
    category: NONE
    reason: ""
    basis: []
projection:
  required: true
  state: PENDING
  operation_id: GHGEN-0001
  target: "github:<owner/repo>:issues"
  adapter: GITHUB_ISSUES
  plan: agents/relay/projection/generations/GHGEN-0001.yaml
  roadmap_revision: "<current RM-xxxx>"
  execution_ref: "<current EP-id / PLAN-id / NONE>"
  receipt: null
  basis: []
  observed: null
  superseded_operations: []
# Optional current delivery vehicle observation. Provider facts remain evidence;
# this pointer does not grant review/merge authority.
delivery:
  required: false
  provider: null
  # Primary/current delivery vehicle for the active slice.
  observation:
    id: null
    path: null
  # All currently tracked PR observations. Non-terminal PRs here are carried
  # forward in every Owner summary until MERGED/CLOSED.
  observations: []
relay_readiness:
  baton_ready: true
  projection_ready: false
  handover_ready: false
  reasons:
    - Required external coordination projection is not yet synchronized.
chat_context_required: false
