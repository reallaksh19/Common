schema_version: relay-v2.5
id: ODR-0001
decision:
  authority: OWNER
  kind: INTENT_MUTATION
  statement: "<exact Owner decision>"
  source: "<durable source/reference>"
effects:
  requirement_disposition: NOT_APPLICABLE
  grants_material_write_authority: false
  pending_items: []
# Optional only for decision.kind: AUTHORIZATION when the Owner explicitly
# grants/revokes a delivery action. This is separate from material write authority.
delivery_authorization: null
# Optional only for decision.kind: AUTHORIZATION when the Owner explicitly
# permits bounded engineering work while named DEFERRABLE control obligations
# remain open. This does not mark those obligations PASS and cannot override a
# hard stop or protected-invariant failure.
execution_override: null
# Example:
# execution_override:
#   disposition: GRANTED
#   scope:
#     repository: "<owner/repo>"
#     branch: "fix/example"
#     base_sha: "<starting-base-sha>"
#     route_key: null
#     issues: [123]
#     pull_requests: [456]
#     allowed_write_paths: ["src/**", "tests/**"]
#   defers: [ROUTE_RECONCILIATION]
#   allows: [BOUNDED_PRODUCT_WRITES, TESTS, DRAFT_PR_UPDATES]
#   blocks: [PR_READY, MERGE, CHECKPOINT]
#   pending_obligations: [PEND-0456-001]
# Example:
# delivery_authorization:
#   action: MERGE
#   provider: GITHUB
#   repository: "<owner/repo>"
#   vehicle: PULL_REQUEST
#   number: 123
#   head_sha: "<exact-pr-head-sha>"
#   disposition: GRANTED
impact:
  class: [LOCAL]
affected:
  objectives: []
  phases: []
  work_packages: []
  execution_packages: []
  issues: []
# Required by the Owner-change projection when decision.kind is INTENT_MUTATION.
# This is part of the ODR authority; generated OWNER_CHANGE.md is derived from it.
change_intake:
  previous_concept: "<plain-language concept before this decision>"
  requested_concept: "<plain-language concept requested by the Owner>"
  retained_behavior: []
  invalidated_behavior: []
  new_scope: []
required_reconciliation: []
status: CAPTURED
