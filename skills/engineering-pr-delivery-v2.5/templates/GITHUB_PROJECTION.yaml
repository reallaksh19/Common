schema_version: relay-v2.5-github-projection
generation:
  id: GHGEN-0001
  repository: "<owner/repo>"
  roadmap_revision: RM-0001
  issue_graph_revision: IG-0001
  execution_ref: EP-0001
  state: PREPARED
  supersedes_generation: null
  basis:
    - agents/relay/roadmap/OVERALL_ROADMAP.yaml
    - agents/relay/roadmap/ISSUE_GRAPH.yaml
operations:
  - id: GHOP-0001
    kind: CREATE
    state: PREPARED
    idempotency_key: "relay:GHGEN-0001:GHOP-0001"
    depends_on: []
    subject:
      issue_node: ISSUE-001
      related_nodes: []
    preconditions:
      repository_issue_state: ABSENT
      work_state: ACTIVE
      required_relationships: []
    desired:
      title: "<issue title>"
      body_marker: "<!-- relay-operation:GHOP-0001 -->"
      body_projection: "<source-derived issue body/handover projection>"
      github_state: OPEN
      relationships: []
    publication:
      attempt_count: 0
      last_attempt_basis: []
      receipt: null
      last_error: null
    verification:
      status: NOT_RUN
      observed_issue_number: null
      observed_issue_id: null
      observed_github_state: null
      observed_relationships: []
      basis: []
    reconciliation:
      issue_graph_effects:
        - node: ISSUE-001
          set_github_state: OPEN
          set_issue_number: OBSERVED
          set_issue_id: OBSERVED
      complete_when:
        - issue identity verified
        - relay-operation marker verified
        - desired GitHub state verified
