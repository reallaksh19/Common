scope:
  performed:
    - Add immutable GHGEN-* GitHub projection generations bound to current roadmap, execution route and issue-graph revision.
    - Add ordered GHOP-* operations for CREATE, LINK, UPDATE, PUBLISH_HANDOVER, SUPERSEDE, REVISE, CLOSE and REOPEN.
    - Persist ATTEMPTED_UNCONFIRMED before any external mutation so crash recovery never assumes a missing connector response means no write occurred.
    - Add durable GITHUB_OBSERVATION readback and semantic reconciliation before ISSUE_GRAPH or projection readiness changes.
    - Add stable operation markers and idempotency keys so uncertain CREATE operations are reconciled before retry.
    - Add READBACK_RECOVERY evidence for verified external state when a connector receipt was lost.
    - Extend issue external-presence state to ABSENT, OPEN, CLOSED and UNKNOWN with locator consistency rules.
    - Add generation supersession with immutable history and no retry authority for obsolete operations.
    - Distinguish supersession before publication, after attempted/unconfirmed mutation, and after publication/unconfirmed receipt.
    - Keep publication sequential within one generation; unresolved uncertain operations must reconcile before later operations publish.
    - Reconcile verified CREATE/CLOSE/REOPEN and relationship effects into ISSUE_GRAPH only after readback.
    - Require native relationship capability/readback before claiming GitHub parent/sub-issue or similar relationship convergence.
    - Integrate GitHub projection/generation validation into aggregate relay conformance.
    - Add repository-neutral GitHub operation stress regressions and repair the closed-parent regression to assert invariant semantics rather than diagnostic wording.
  explicitly_not_performed:
    - Downstream GitHub issue adoption or mutation.
    - Treating GitHub as roadmap, lifecycle or engineering authority.
    - Treating Markdown/body links as verified native parent/sub-issue relationships.
    - QRV quality procedure implementation; owned by WP-06.
    - Plain-language Owner communication split; owned by WP-07.
    - Owner change-intake projection; owned by WP-08.
    - End-to-end A -> B -> C release certification; owned by WP-09.
    - V2 modification.
    - PR merge or ready-for-review transition.

