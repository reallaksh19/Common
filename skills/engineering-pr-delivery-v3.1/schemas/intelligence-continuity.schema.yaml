$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, authority, ready, source, projections, checks, evidence]
properties:
  schema_version: {const: relay-v3-intelligence-continuity}
  authority: {const: DERIVED_CONTINUITY_ASSESSMENT}
  ready: {type: boolean}
  source:
    type: object
    required: [protocol, legacy_tree_digest, roadmap_revision]
  projections:
    type: object
    required: [task_snapshot_digest, improvement_view_digest]
  checks:
    type: object
    required: [legacy_history_preserved, roadmap_admission, roadmap_events, checkpoint_progress, discovery, owner_delta, handover_intelligence, generated_projection_non_authority]
    additionalProperties:
      enum: [PASS, FAIL]
  evidence:
    type: array
    minItems: 1
additionalProperties: false
