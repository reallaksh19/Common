$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, authority, provider, repository, issue_number, title, url, state, observed_at, baseline, current_contract, updates, disposition, relationships]
properties:
  schema_version: {const: relay-v3.1-parent-issue-observation}
  authority: {const: DERIVED_PROVIDER_OBSERVATION}
  provider: {const: GITHUB}
  repository: {type: string, pattern: '^[^/\\s]+/[^/\\s]+$'}
  issue_number: {type: integer, minimum: 1}
  title: {type: string, minLength: 1}
  url: {type: string, format: uri}
  state: {enum: [OPEN, CLOSED, UNKNOWN]}
  observed_at: {type: string, format: date-time}
  baseline:
    type: [object, 'null']
    additionalProperties: false
    required: [observed_at, body_digest, acceptance_items]
    properties:
      observed_at: {type: string, format: date-time}
      body_digest: {type: string, pattern: '^sha256:[0-9a-fA-F]{64}$'}
      acceptance_items:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, statement]
          properties:
            id: {type: string, minLength: 1}
            statement: {type: string, minLength: 1}
  current_contract:
    type: object
    additionalProperties: false
    required: [body_digest, acceptance_items]
    properties:
      body_digest: {type: string, pattern: '^sha256:[0-9a-fA-F]{64}$'}
      acceptance_items:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, statement, state, evidence, provider_refs]
          properties:
            id: {type: string, minLength: 1}
            statement: {type: string, minLength: 1}
            state: {enum: [COMPLETE, PARTIAL, PENDING, BLOCKED, DEFERRED, NOT_APPLICABLE, UNKNOWN]}
            evidence: {type: array, items: {type: string, minLength: 1}}
            provider_refs: {type: array, items: {type: string, minLength: 1}}
  disposition:
    enum: [NO_CHANGE, UPDATE, LINK, TRANSFER, SPLIT, SUPERSEDE, CLOSE, UNKNOWN]
  relationships:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [type, target, scope, acceptance_items, provider_refs]
      properties:
        type:
          enum: [RELATED_TO, BLOCKED_BY, FOLLOW_UP, SUPERSEDES, SUPERSEDED_BY, TRANSFERS_TO, SPLIT_INTO]
        target:
          type: object
          additionalProperties: false
          required: [repository, issue_number, url]
          properties:
            repository: {type: string, pattern: '^[^/\\s]+/[^/\\s]+    type: array
    items:
      type: object
      additionalProperties: false
      required: [ref, type, summary, effect]
      properties:
        ref: {type: string, minLength: 1}
        type: {enum: [REQUIREMENT, DECISION, STATUS, DEPENDENCY, ACCEPTANCE, DELIVERY, COMMENT]}
        summary: {type: string, minLength: 1}
        effect: {type: array, items: {type: string, minLength: 1}}
additionalProperties: false
}
            issue_number: {type: integer, minimum: 1}
            url: {type: string, format: uri}
        scope:
          type: array
          items: {type: string, minLength: 1}
        acceptance_items:
          type: array
          items: {type: string, minLength: 1}
        provider_refs:
          type: array
          items: {type: string, minLength: 1}
  updates:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [ref, type, summary, effect]
      properties:
        ref: {type: string, minLength: 1}
        type: {enum: [REQUIREMENT, DECISION, STATUS, DEPENDENCY, ACCEPTANCE, DELIVERY, COMMENT]}
        summary: {type: string, minLength: 1}
        effect: {type: array, items: {type: string, minLength: 1}}
additionalProperties: false
