$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, id, work_package, outcome, basis, scope, acceptance, quality_policy, next]
properties:
  schema_version: {const: relay-v3.1-ep}
  id: {type: string, pattern: '^(?:EP-[A-Za-z0-9][A-Za-z0-9._-]*|EP\.(?:[1-9][0-9]*|REPO|INTERNAL)\.[1-9][0-9]*)$'}
  work_package: {type: string, pattern: '^(?:WP-[A-Za-z0-9][A-Za-z0-9._-]*|WP\.[1-9][0-9]*(?:\.[1-9][0-9]*)?)$'}
  outcome:
    type: object
    additionalProperties: false
    required: [statement]
    properties:
      statement: {type: string, minLength: 1}
  basis:
    type: object
    additionalProperties: false
    required: [predecessor_checkpoint, material_base, protocol_basis, semantic_dependencies]
    properties:
      predecessor_checkpoint: {type: [string, 'null'], pattern: '^(?:CP-[A-Za-z0-9][A-Za-z0-9._-]*|CP\.(?:[1-9][0-9]*|REPO|INTERNAL)\.[1-9][0-9]*)$'}
      material_base: {type: string, minLength: 7}
      protocol_basis: {type: string, minLength: 1}
      semantic_dependencies:
        type: array
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [path, reason]
          properties:
            path: {type: string, minLength: 1}
            reason: {type: string, minLength: 1}
  scope:
    type: object
    additionalProperties: false
    required: [write, read, protect, prohibit]
    properties:
      write:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      read:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      protect:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      prohibit:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
  acceptance:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, statement, evidence_requirements]
      properties:
        id: {type: string, pattern: '^(?:AC-[A-Za-z0-9][A-Za-z0-9._-]*|AC\.(?:[1-9][0-9]*|REPO|INTERNAL)\.[1-9][0-9]*)$'}
        statement: {type: string, minLength: 1}
        evidence_requirements:
          type: array
          minItems: 1
          items:
            type: object
            minProperties: 1
            maxProperties: 1
            additionalProperties: false
            properties:
              test: {type: string, minLength: 1}
              oracle: {type: string, minLength: 1}
            anyOf:
              - required: [test]
              - required: [oracle]
  quality_policy:
    type: object
    additionalProperties: false
    required: [level, independent_review]
    properties:
      level: {enum: [LOW, STANDARD, HIGH_RISK, CRITICAL]}
      independent_review: {enum: [OPTIONAL, REQUIRED]}
  parent_issue:
    type: object
    additionalProperties: false
    required: [provider, repository, number, title, url, baseline]
    properties:
      provider: {const: GITHUB}
      repository: {type: string, pattern: '^[^/\s]+/[^/\s]+$'}
      number: {type: integer, minimum: 1}
      title: {type: string, minLength: 1}
      url: {type: string, format: uri}
      baseline:
        type: object
        additionalProperties: false
        required: [observed_at, body_digest, acceptance_items]
        properties:
          observed_at: {type: string, format: date-time}
          body_digest: {type: string, pattern: '^sha256:[0-9a-fA-F]{64}$'}
          acceptance_items:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [id, statement]
              properties:
                id: {type: string, minLength: 1}
                statement: {type: string, minLength: 1}
  programme_parent:
    type: object
    additionalProperties: false
    required: [provider, repository, number, title, url]
    properties:
      provider: {const: GITHUB}
      repository: {type: string, pattern: '^[^/]+/[^/]+$'}
      number: {type: integer, minimum: 1}
      title: {type: string, minLength: 1}
      url: {type: string, format: uri}
  implementation_plan_basis:
    type: object
    additionalProperties: false
    required: [provider_ref, revision, digest, observed_at]
    properties:
      provider_ref: {type: string, minLength: 1}
      revision: {type: integer, minimum: 1}
      digest: {type: string, pattern: '^sha256:[0-9a-fA-F]{64}
    type: object
    additionalProperties: false
    required: [statement, evidence]
    properties:
      statement: {type: string, minLength: 1}
      evidence:
        type: array
        items: {type: string, minLength: 1}
  offloads:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, status, agent_type, task, allowed_writes, expected_return, trace_refs]
      properties:
        id: {type: string, pattern: '^(?:OFFLOAD-[A-Za-z0-9][A-Za-z0-9._-]*|OFFLOAD\.(?:[1-9][0-9]*|REPO|INTERNAL)\.[1-9][0-9]*)$'}
        status: {enum: [PLANNED, ACTIVE, RETURNED, ACCEPTED, CANCELLED]}
        agent_type: {enum: [LOCAL_AGENT, THIRD_PARTY_AGENT, HUMAN]}
        task: {type: string, minLength: 1}
        allowed_writes:
          type: array
          items: {type: string, minLength: 1}
        expected_return:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        trace_refs:
          type: array
          items: {type: string, minLength: 1}
  admission_policy:
    type: object
    additionalProperties: false
    required: [qualification]
    properties:
      qualification: {enum: [NOT_REQUIRED, REQUIRED]}
      question_policy: {enum: [NONE, Q1_Q5, CUSTOM]}
  next:
    type: object
    additionalProperties: false
    required: [first_action, stop_conditions]
    properties:
      first_action: {type: string, minLength: 1}
      stop_conditions:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
allOf:
  - if:
      properties:
        quality_policy:
          properties:
            level: {enum: [HIGH_RISK, CRITICAL]}
    then:
      properties:
        quality_policy:
          properties:
            independent_review: {const: REQUIRED}
additionalProperties: false
}
      observed_at: {type: string, format: date-time}
      responsibility_basis_ref: {type: [string, 'null']}
      responsibility_basis_digest: {type: [string, 'null'], pattern: '^sha256:[0-9a-fA-F]{64}
    type: object
    additionalProperties: false
    required: [statement, evidence]
    properties:
      statement: {type: string, minLength: 1}
      evidence:
        type: array
        items: {type: string, minLength: 1}
  offloads:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, status, agent_type, task, allowed_writes, expected_return, trace_refs]
      properties:
        id: {type: string, pattern: '^(?:OFFLOAD-[A-Za-z0-9][A-Za-z0-9._-]*|OFFLOAD\.(?:[1-9][0-9]*|REPO|INTERNAL)\.[1-9][0-9]*)$'}
        status: {enum: [PLANNED, ACTIVE, RETURNED, ACCEPTED, CANCELLED]}
        agent_type: {enum: [LOCAL_AGENT, THIRD_PARTY_AGENT, HUMAN]}
        task: {type: string, minLength: 1}
        allowed_writes:
          type: array
          items: {type: string, minLength: 1}
        expected_return:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        trace_refs:
          type: array
          items: {type: string, minLength: 1}
  admission_policy:
    type: object
    additionalProperties: false
    required: [qualification]
    properties:
      qualification: {enum: [NOT_REQUIRED, REQUIRED]}
      question_policy: {enum: [NONE, Q1_Q5, CUSTOM]}
  next:
    type: object
    additionalProperties: false
    required: [first_action, stop_conditions]
    properties:
      first_action: {type: string, minLength: 1}
      stop_conditions:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
allOf:
  - if:
      properties:
        quality_policy:
          properties:
            level: {enum: [HIGH_RISK, CRITICAL]}
    then:
      properties:
        quality_policy:
          properties:
            independent_review: {const: REQUIRED}
additionalProperties: false
}
  expected_next_observable:
    type: object
    additionalProperties: false
    required: [statement, evidence]
    properties:
      statement: {type: string, minLength: 1}
      evidence:
        type: array
        items: {type: string, minLength: 1}
  offloads:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, status, agent_type, task, allowed_writes, expected_return, trace_refs]
      properties:
        id: {type: string, pattern: '^(?:OFFLOAD-[A-Za-z0-9][A-Za-z0-9._-]*|OFFLOAD\.(?:[1-9][0-9]*|REPO|INTERNAL)\.[1-9][0-9]*)$'}
        status: {enum: [PLANNED, ACTIVE, RETURNED, ACCEPTED, CANCELLED]}
        agent_type: {enum: [LOCAL_AGENT, THIRD_PARTY_AGENT, HUMAN]}
        task: {type: string, minLength: 1}
        allowed_writes:
          type: array
          items: {type: string, minLength: 1}
        expected_return:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        trace_refs:
          type: array
          items: {type: string, minLength: 1}
  admission_policy:
    type: object
    additionalProperties: false
    required: [qualification]
    properties:
      qualification: {enum: [NOT_REQUIRED, REQUIRED]}
      question_policy: {enum: [NONE, Q1_Q5, CUSTOM]}
  next:
    type: object
    additionalProperties: false
    required: [first_action, stop_conditions]
    properties:
      first_action: {type: string, minLength: 1}
      stop_conditions:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
allOf:
  - if:
      properties:
        quality_policy:
          properties:
            level: {enum: [HIGH_RISK, CRITICAL]}
    then:
      properties:
        quality_policy:
          properties:
            independent_review: {const: REQUIRED}
additionalProperties: false
