$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, roadmap, execution, accepted, controls, delivery, generated]
properties:
  schema_version: {const: relay-v3.1}
  roadmap:
    type: object
    additionalProperties: false
    required: [revision, path]
    properties:
      revision: {type: string, minLength: 1}
      path: {type: string, minLength: 1}
  execution:
    type: object
    additionalProperties: false
    required: [lifecycle, ep, lease, route]
    properties:
      lifecycle: {enum: [ACTIVE, PARALLEL, IDLE, TERMINAL, INITIALIZING]}
      ep: {type: [string, 'null'], pattern: '^EP-[A-Za-z0-9][A-Za-z0-9._-]*$'}
      lease: {type: [string, 'null'], pattern: '^LEASE-[A-Za-z0-9][A-Za-z0-9._-]*$'}
      route: {type: [string, 'null'], minLength: 1}
      custody_epoch: {type: integer, minimum: 0}
  accepted:
    type: object
    additionalProperties: false
    required: [checkpoint]
    properties:
      checkpoint: {type: [string, 'null'], pattern: '^CP-[A-Za-z0-9][A-Za-z0-9._-]*$'}
  controls:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path: {type: string, minLength: 1}
  delivery:
    type: object
    additionalProperties: false
    required: [required, primary_vehicle]
    properties:
      required: {type: boolean}
      primary_vehicle:
        type: [object, 'null']
        additionalProperties: false
        required: [provider, kind, number]
        properties:
          provider: {const: GITHUB}
          kind: {enum: [PULL_REQUEST, ISSUE]}
          number: {type: integer, minimum: 1}
  generated:
    type: object
    additionalProperties: false
    required: [snapshot]
    properties:
      snapshot: {type: string, minLength: 1}
allOf:
  - if:
      properties:
        execution:
          properties:
            lifecycle: {const: ACTIVE}
    then:
      properties:
        execution:
          properties:
            ep: {type: string, pattern: '^EP-[A-Za-z0-9][A-Za-z0-9._-]*$'}
            lease: {type: string, pattern: '^LEASE-[A-Za-z0-9][A-Za-z0-9._-]*$'}
            route: {type: string, pattern: '^SERIAL:EP-[A-Za-z0-9][A-Za-z0-9._-]*$'}
  - if:
      properties:
        execution:
          properties:
            lifecycle: {enum: [IDLE, TERMINAL, INITIALIZING]}
    then:
      properties:
        execution:
          properties:
            ep: {type: 'null'}
            lease: {type: 'null'}
            route: {type: 'null'}
additionalProperties: false
