$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, authority, observed_at, marker, parent, handover]
properties:
  schema_version: {const: relay-v3.1-handover-provider-status}
  authority: {const: PROVIDER_READBACK}
  observed_at: {type: string, format: date-time}
  marker: {const: relay-v3.1}
  parent:
    $ref: '#/$defs/issue'
  handover:
    $ref: '#/$defs/issue'
$defs:
  issue:
    type: object
    additionalProperties: false
    required: [repository, issue_number, url, body_digest, updated]
    properties:
      repository: {type: string, pattern: '^[^/\\s]+/[^/\\s]+$'}
      issue_number: {type: integer, minimum: 1}
      url: {type: string, format: uri}
      body_digest: {type: string, pattern: '^sha256:[0-9a-fA-F]{64}$'}
      updated: {type: boolean}
additionalProperties: false
