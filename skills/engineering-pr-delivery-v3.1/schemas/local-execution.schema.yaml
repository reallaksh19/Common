$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, authority, generated_from, project, repository, execution, material, scope, acceptance, controls, checkpoint, next, request, provider_return, return_contract, delivery_boundary]
properties:
  schema_version: {const: relay-v3.1-local-execution}
  authority: {const: DERIVED_EXECUTION_PACKAGE}
  generated_from:
    type: object
    additionalProperties: false
    required: [state_digest, snapshot_digest]
    properties:
      state_digest: {type: string, pattern: '^sha256:[0-9a-fA-F]{64}$'}
      snapshot_digest: {type: string, pattern: '^sha256:[0-9a-fA-F]{64}$'}
  project:
    type: object
    additionalProperties: false
    required: [outcome, roadmap_revision, work_package]
    properties:
      outcome: {type: string, minLength: 1}
      roadmap_revision: {type: string, minLength: 1}
      work_package: {type: [string, 'null']}
  repository:
    type: object
    additionalProperties: false
    required: [clone_url, branch, required_head, checkout_instructions]
    properties:
      clone_url: {type: [string, 'null'], minLength: 1}
      branch: {type: string, minLength: 1}
      required_head: {type: string, minLength: 7}
      checkout_instructions:
        type: array
        minItems: 2
        items: {type: string, minLength: 1}
  execution:
    type: object
    additionalProperties: false
    required: [ep, lease, executor, branch]
    properties:
      ep: {type: [string, 'null']}
      lease: {type: [string, 'null']}
      executor: {type: [string, 'null']}
      branch: {type: string, minLength: 1}
  material:
    type: object
    additionalProperties: false
    required: [base, head, relevant_paths_digest, dependency_digest]
    properties:
      base: {type: string, minLength: 7}
      head: {type: string, minLength: 7}
      relevant_paths_digest: {type: string, pattern: '^sha256:[0-9a-fA-F]{64}$'}
      dependency_digest: {type: string, pattern: '^sha256:[0-9a-fA-F]{64}$'}
  scope:
    type: object
    additionalProperties: false
    required: [allowed_writes, protected, prohibited]
    properties:
      allowed_writes:
        type: array
        items: {type: string}
      protected:
        type: array
        items: {type: string}
      prohibited:
        type: array
        items: {type: string}
  acceptance:
    type: array
    items:
      type: object
      required: [id, statement, evidence_requirements]
  controls:
    type: object
    required: [execution_blockers, handover_blockers, delivery_blockers, informational]
  checkpoint:
    type: object
    additionalProperties: false
    required: [id, handoff]
    properties:
      id: {type: [string, 'null']}
      handoff: {type: [object, 'null']}
  next:
    type: object
    required: [first_action, stop_conditions]
  request:
    type: object
    additionalProperties: false
    required: [id, purpose, mode, exact_basis, preflight, steps, success_conditions, stop_conditions, prohibited_actions]
    properties:
      id: {type: string, pattern: '^LOCAL-[A-Za-z0-9][A-Za-z0-9._-]*$'}
      purpose: {type: string, minLength: 1}
      mode: {enum: [VALIDATE_ONLY, BOUNDED_EXECUTION]}
      exact_basis:
        type: object
        additionalProperties: false
        required: [material_head, branch, work_package, ep]
        properties:
          material_head: {type: string, minLength: 7}
          branch: {type: string, minLength: 1}
          work_package: {type: [string, 'null']}
          ep: {type: [string, 'null']}
      preflight:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      steps:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [id, instruction, command, working_directory, expected_result]
          properties:
            id: {type: string, minLength: 1}
            instruction: {type: string, minLength: 1}
            command: {type: [string, 'null']}
            working_directory: {type: string, minLength: 1}
            expected_result: {type: string, minLength: 1}
      success_conditions:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      stop_conditions:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      prohibited_actions:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
  provider_return:
    type: object
    additionalProperties: false
    required: [target_sub_issue, required_before_dispatch, update_required, required_content, instruction]
    properties:
      target_sub_issue: {type: [string, 'null'], minLength: 1}
      required_before_dispatch: {type: boolean}
      update_required: {const: true}
      required_content:
        type: array
        minItems: 5
        items: {type: string, minLength: 1}
      instruction: {type: string, minLength: 1}
  return_contract:
    type: object
    additionalProperties: false
    required: [request_id, allowed_results, required_fields, resume_owner]
    properties:
      request_id: {type: string, pattern: '^LOCAL-[A-Za-z0-9][A-Za-z0-9._-]*$'}
      allowed_results:
        type: array
        minItems: 6
        uniqueItems: true
        items:
          enum: [PASS, FAIL, BLOCKED, NOT_RUN_ENVIRONMENT, NOT_RUN_INFRASTRUCTURE, HEAD_MISMATCH]
      required_fields:
        type: array
        minItems: 5
        uniqueItems: true
        items:
          enum: [observed_head, environment, command_results, failures, artifacts]
      resume_owner:
        type: object
        additionalProperties: false
        required: [agent_id, responsibility]
        properties:
          agent_id: {type: [string, 'null']}
          responsibility: {type: string, minLength: 1}
  delivery_boundary:
    type: object
    additionalProperties: false
    required: [merge_authorized, delivery_lifecycle]
    properties:
      merge_authorized: {type: boolean}
      delivery_lifecycle: {type: string, minLength: 1}
additionalProperties: false
