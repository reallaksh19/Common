$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, id, authority, recorded_at, ep, custody, goal, activity, material, progress, next]
properties:
  schema_version: {const: relay-v3.1-continuation}
  id: {type: string, pattern: '^(?:CONT-[A-Za-z0-9][A-Za-z0-9._-]*|CONT\.(?:[1-9][0-9]*|REPO|INTERNAL)\.[1-9][0-9]*)$'}
  authority: {const: CONTINUATION_EVIDENCE}
  recorded_at: {type: string, format: date-time}
  ep:
    type: object
    additionalProperties: false
    required: [id, digest]
    properties:
      id: {type: string, pattern: '^(?:EP-[A-Za-z0-9][A-Za-z0-9._-]*|EP\.(?:[1-9][0-9]*|REPO|INTERNAL)\.[1-9][0-9]*)$'}
      digest: {type: string, pattern: '^sha256:[0-9a-fA-F]{64}$'}
  custody:
    type: object
    additionalProperties: false
    required: [lease, epoch, executor]
    properties:
      lease: {type: string, pattern: '^(?:LEASE-[A-Za-z0-9][A-Za-z0-9._-]*|LEASE\.(?:[1-9][0-9]*|REPO|INTERNAL)\.[1-9][0-9]*)$'}
      epoch: {type: integer, minimum: 1}
      executor: {type: string, minLength: 1}
  goal:
    type: object
    additionalProperties: false
    required: [issue, issue_baseline_digest, acceptance_focus]
    properties:
      issue: {type: [integer, 'null'], minimum: 1}
      issue_baseline_digest: {type: [string, 'null'], pattern: '^sha256:[0-9a-fA-F]{64}$'}
      acceptance_focus:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
  activity:
    type: object
    additionalProperties: false
    required: [current_action, why]
    properties:
      current_action: {type: string, minLength: 1}
      why: {type: string, minLength: 1}
  material:
    type: object
    additionalProperties: false
    required: [branch, head, recoverability]
    properties:
      branch: {type: string, minLength: 1}
      head: {type: string, minLength: 7}
      recoverability: {enum: [DURABLE_REMOTE, LOCAL_ONLY, UNKNOWN]}
  progress:
    type: object
    additionalProperties: false
    required: [completed_since_checkpoint, discoveries, attempted_and_rejected, unresolved]
    properties:
      completed_since_checkpoint:
        type: array
        items: {type: string, minLength: 1}
      discoveries:
        type: array
        items: {type: string, minLength: 1}
      attempted_and_rejected:
        type: array
        items: {type: string, minLength: 1}
      unresolved:
        type: array
        items: {type: string, minLength: 1}
  next:
    type: object
    additionalProperties: false
    required: [immediate_action, stop_conditions]
    properties:
      immediate_action: {type: string, minLength: 1}
      stop_conditions:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
additionalProperties: false
