$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [schema_version, event_id, type, timestamp, actor, subject, basis, details]
properties:
  schema_version: {const: relay-v3.1-event}
  event_id: {type: string, pattern: '^(?:EVT-[A-Za-z0-9][A-Za-z0-9._-]*|EVT\.(?:[1-9][0-9]*|REPO|INTERNAL)\.[1-9][0-9]*)$'}
  type:
    enum: [OWNER_TASK_ADMITTED, EP_CREATED, LEASE_GRANTED, LEASE_RENEWED, MATERIAL_WRITE_STARTED, MATERIAL_VALIDATED, CHECKPOINT_ACCEPTED, CONTINUATION_RECORDED, NEW_SCOPE_DISCOVERED, LEASE_RELEASED, LEASE_REVOKED, CONTROL_RESOLVED, ROADMAP_RECONCILED, HANDOVER_PUBLISHED, HANDOVER_PLANNED, HANDOVER_ACCEPTED, HANDOVER_LEDGER_SYNCED, RECOVERY_STARTED, RECOVERY_RECONSTRUCTED, CHANGE_HYPOTHESIS_RECORDED, CHANGE_VERIFIED, CHANGE_REJECTED, CHANGE_DELTA_PROPOSED, CHANGE_AUTHORIZED, LOCAL_EXECUTION_EXPORTED, LOCAL_EXECUTION_RETURNED, DELIVERY_SYNCED, TASK_CLOSED, MIGRATION_BOOTSTRAPPED, LEGACY_CUTOVER_FROZEN, PROTOCOL_CUTOVER_ACTIVATED, PR_OPENED, PR_MERGED]
  timestamp: {type: string, format: date-time}
  actor: {type: string, minLength: 1}
  subject: {type: string, minLength: 1}
  basis:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  details: {type: object}
additionalProperties: false
