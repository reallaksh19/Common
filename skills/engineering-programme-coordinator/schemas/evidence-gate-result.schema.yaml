$schema: https://json-schema.org/draft/2020-12/schema
$id: engineering-programme-coordinator-evidence-gate-result-v1
type: object
additionalProperties: false
required:
  - schema_version
  - authority
  - decision
  - candidate_sha
  - manifest_digest
  - reason_codes
  - blocking_obligations
  - validation_errors
properties:
  schema_version:
    const: EVIDENCE_GATE_RESULT_V1
  authority:
    const: DETERMINISTIC_EVIDENCE_GATE
  decision:
    enum:
      - REPLAY_EVIDENCE
      - REPAIR
      - ESCALATE
      - ADVANCE_ELIGIBLE
  candidate_sha:
    type: string
    pattern: '^[0-9a-f]{40}$'
  manifest_digest:
    type: string
    pattern: '^[0-9a-f]{64}$'
  reason_codes:
    type: array
    minItems: 1
    items:
      enum:
        - INVALID_REVIEW_BASIS
        - INVALID_SELF_CHECK_BASIS
        - REFUTED_OBLIGATION
        - UNKNOWN_OBLIGATION
        - CLOSED_DENOMINATOR
  blocking_obligations:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  validation_errors:
    type: array
    items: {type: string, minLength: 1}
