$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
  - schema_version
  - authority
  - programme_ref
  - observed_at
  - basis_revision
  - workstreams
  - dependencies
  - nonterminal_prs
  - pending_items
  - known_issues
  - negative_knowledge
  - recent_handoffs
  - owner_decisions_needed
  - next_coordinator_action
  - next_observation
properties:
  schema_version:
    const: engineering-coordinator-relay-handover-v1
  authority:
    const: DURABLE_OPERATIONAL_LEDGER
  programme_ref:
    type: string
    minLength: 1
  observed_at:
    type: string
    format: date-time
  basis_revision:
    type: string
    minLength: 1
  observed_main:
    type: [string, 'null']
  workstreams:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - issue_ref
        - plan
        - expected_next_observable
        - latest_evidence
        - next_consequence
      properties:
        id: {type: string, minLength: 1}
        issue_ref: {type: string, minLength: 1}
        agent_ref: {type: [string, 'null']}
        plan:
          type: object
          additionalProperties: false
          required: [state]
          properties:
            state: {enum: [PRESENT, MISSING, STALE, UNKNOWN]}
            ref: {type: [string, 'null']}
            revision: {type: [integer, 'null'], minimum: 1}
        branch: {type: [string, 'null']}
        pr: {type: [string, 'null']}
        exact_head: {type: [string, 'null']}
        expected_next_observable: {type: string}
        latest_evidence:
          type: array
          items: {type: string, minLength: 1}
        next_consequence: {type: string}
  dependencies:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [consumer, required_output, state, evidence, independent_work]
      properties:
        producer: {type: [string, 'null']}
        consumer: {type: string, minLength: 1}
        required_output: {type: string, minLength: 1}
        state:
          enum: [SATISFIED, MISSING, UNCERTAIN, DISCOVERED, SUPERSEDED]
        evidence:
          type: array
          items: {type: string, minLength: 1}
        independent_work:
          type: array
          items: {type: string, minLength: 1}
  nonterminal_prs:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [ref, workstream, lifecycle]
      properties:
        ref: {type: string, minLength: 1}
        workstream: {type: string, minLength: 1}
        lifecycle:
          enum: [DRAFT, OPEN, CHANGES_REQUESTED, CONFLICTED, REVIEWABLE, UNKNOWN]
        head: {type: [string, 'null']}
        base: {type: [string, 'null']}
        mergeability: {type: [string, 'null']}
        note: {type: [string, 'null']}
  pending_items:
    type: array
    items: {type: string, minLength: 1}
  known_issues:
    type: array
    items: {type: string, minLength: 1}
  negative_knowledge:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [statement, evidence, reopen_condition]
      properties:
        statement: {type: string, minLength: 1}
        evidence:
          type: array
          items: {type: string, minLength: 1}
        reopen_condition: {type: string}
  recent_handoffs:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [producer, consumer, output, evidence, proved, not_proved]
      properties:
        producer: {type: string, minLength: 1}
        consumer: {type: string, minLength: 1}
        output: {type: string, minLength: 1}
        evidence:
          type: array
          items: {type: string, minLength: 1}
        proved:
          type: array
          items: {type: string, minLength: 1}
        not_proved:
          type: array
          items: {type: string, minLength: 1}
        limitations:
          type: array
          items: {type: string, minLength: 1}
  local_coordination:
    type: array
    items: {type: string, minLength: 1}
  owner_decisions_needed:
    type: array
    items: {type: string, minLength: 1}
  next_coordinator_action:
    type: string
  next_observation:
    type: object
    additionalProperties: false
    required: [reason, expected_evidence]
    properties:
      reason: {type: string}
      expected_evidence:
        type: array
        items: {type: string, minLength: 1}
