$schema: https://json-schema.org/draft/2020-12/schema
$id: engineering-programme-coordinator-evidence-ledger-v1
type: object
additionalProperties: false
required:
  - schema_version
  - authority
  - manifest_ref
  - manifest_digest
  - candidate_sha
  - records
properties:
  schema_version:
    const: EVIDENCE_LEDGER_V1
  authority:
    const: EXACT_CANDIDATE_EVIDENCE_LEDGER
  manifest_ref: {type: string, minLength: 1}
  manifest_digest:
    type: string
    pattern: '^[0-9a-f]{64}$'
  candidate_sha:
    type: string
    pattern: '^[0-9a-f]{40}$'
  records:
    type: array
    items: {$ref: '#/$defs/obligation_result'}
$defs:
  obligation_result:
    type: object
    additionalProperties: false
    required:
      - obligation_id
      - state
      - evidence_candidate_sha
      - evidence_items
      - disposition_ref
    properties:
      obligation_id: {type: string, minLength: 1}
      state:
        enum: [VERIFIED, REFUTED, UNKNOWN, NOT_APPLICABLE]
      evidence_candidate_sha:
        type: string
        pattern: '^[0-9a-f]{40}$'
      evidence_items:
        type: array
        items: {$ref: '#/$defs/evidence_item'}
      disposition_ref: {type: [string, 'null']}
  evidence_item:
    type: object
    additionalProperties: false
    required:
      - requirement_id
      - method
      - refs
      - verifier_kind
      - verifier_identity
    properties:
      requirement_id: {type: [string, 'null']}
      method: {$ref: '#/$defs/evidence_method'}
      refs:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      verifier_kind:
        enum:
          - DETERMINISTIC_TOOL
          - FRESH_REVIEWER
          - SAME_PRINCIPAL_REVIEWER
          - EXTERNAL_REVIEWER
          - HUMAN_REVIEWER
      verifier_identity: {type: string, minLength: 1}
  evidence_method:
    enum:
      - UNIT_TEST
      - INTEGRATION_TEST
      - PROPERTY_TEST
      - CONTRACT_TEST
      - STATIC_ANALYSIS
      - RUNTIME_TRACE
      - SCHEMA_CHECK
      - FAULT_INJECTION
      - MANUAL_REVIEW
      - OTHER
