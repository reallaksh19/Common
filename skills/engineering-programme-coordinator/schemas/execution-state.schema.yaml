$schema: https://json-schema.org/draft/2020-12/schema
$id: engineering-programme-coordinator-execution-state-v1
type: object
additionalProperties: false
required:
  - schema_version
  - authority
  - identity
  - repository
  - protocol
  - capability
  - lifecycle
  - dependencies
  - verification
  - contradictions
  - next_action
properties:
  schema_version:
    const: EXECUTION_STATE_V1
  authority:
    const: CANONICAL_EXECUTION_STATE
  identity:
    type: object
    additionalProperties: false
    required: [parent, responsibility, attempt]
    properties:
      parent: {type: string, minLength: 1}
      responsibility: {type: string, minLength: 1}
      attempt: {type: integer, minimum: 1}
  repository:
    type: object
    additionalProperties: false
    required: [target_ref, target_sha, branch, pr, candidate_sha]
    properties:
      target_ref: {type: string, minLength: 1}
      target_sha:
        type: string
        pattern: '^[0-9a-f]{40}$'
      branch: {type: string, minLength: 1}
      pr: {type: [integer, 'null'], minimum: 1}
      candidate_sha:
        anyOf:
          - {type: 'null'}
          - {type: string, pattern: '^[0-9a-f]{40}$'}
  protocol:
    type: object
    additionalProperties: false
    required: [local_ref, local_digest, v35_ref, v35_digest]
    properties:
      local_ref:
        type: string
        pattern: '^[^@\s]+@[0-9a-f]{40}:.+$'
      local_digest:
        type: string
        pattern: '^[0-9a-f]{64}$'
      v35_ref:
        type: string
        pattern: '^[^@\s]+@[0-9a-f]{40}:.+$'
      v35_digest:
        type: string
        pattern: '^[0-9a-f]{64}$'
  capability:
    type: object
    additionalProperties: false
    required: [active_role, capability_basis, allowed_actions, forbidden_actions]
    properties:
      active_role:
        enum: [CODER, REVIEWER, COORDINATOR, NONE]
      capability_basis:
        type: array
        items: {type: string, minLength: 1}
      allowed_actions:
        type: array
        uniqueItems: true
        items: {$ref: '#/$defs/capability_action'}
      forbidden_actions:
        type: array
        uniqueItems: true
        items: {$ref: '#/$defs/capability_action'}
  lifecycle:
    type: object
    additionalProperties: false
    required: [stage, last_completed_checkpoint]
    properties:
      stage:
        enum: [PLANNING, CODING, REVIEW, REPAIR, READY, STOPPED]
      last_completed_checkpoint: {type: [string, 'null']}
  dependencies:
    type: object
    additionalProperties: false
    required: [satisfied, blocked]
    properties:
      satisfied:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      blocked:
        type: array
        items: {$ref: '#/$defs/dependency_blocker'}
  verification:
    type: object
    additionalProperties: false
    required:
      - expectation_manifest_ref
      - evidence_ledger_ref
      - evidence_state
      - evidence_candidate_sha
      - unresolved_critical
    properties:
      expectation_manifest_ref: {type: [string, 'null']}
      evidence_ledger_ref: {type: [string, 'null']}
      evidence_state:
        enum: [MISSING, UNKNOWN, STALE, CURRENT]
      evidence_candidate_sha:
        anyOf:
          - {type: 'null'}
          - {type: string, pattern: '^[0-9a-f]{40}$'}
      unresolved_critical:
        type: array
        items: {$ref: '#/$defs/critical_obligation'}
  contradictions:
    type: array
    items: {type: string, minLength: 1}
  next_action:
    type: object
    additionalProperties: false
    required: [type, reason_code, basis_refs]
    properties:
      type:
        enum:
          - STOPPED
          - RECONCILE
          - WAIT_DEPENDENCY
          - IMPLEMENT
          - VERIFY_CANDIDATE
          - REPAIR_CANDIDATE
          - ADVANCE_STAGE
      reason_code:
        enum:
          - LIFECYCLE_STOPPED
          - STATE_CONTRADICTION
          - BLOCKED_DEPENDENCY
          - ACTIVE_ROLE_MISSING
          - IMPLEMENTATION_REQUIRED
          - VERIFICATION_REQUIRED
          - REPAIR_REQUIRED
          - CRITICAL_UNKNOWN
          - ADVANCEMENT_READY
          - CAPABILITY_MISSING
      basis_refs:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
$defs:
  capability_action:
    enum:
      - WRITE_CANDIDATE
      - RUN_VERIFICATION
      - REPAIR_CANDIDATE
      - PUBLISH_EVIDENCE
      - ADVANCE_STAGE
      - ESCALATE
  dependency_blocker:
    type: object
    additionalProperties: false
    required: [id, reason, evidence_refs]
    properties:
      id: {type: string, minLength: 1}
      reason: {type: string, minLength: 1}
      evidence_refs:
        type: array
        items: {type: string, minLength: 1}
  critical_obligation:
    type: object
    additionalProperties: false
    required: [id, state, evidence_refs]
    properties:
      id: {type: string, minLength: 1}
      state: {enum: [REFUTED, UNKNOWN]}
      evidence_refs:
        type: array
        items: {type: string, minLength: 1}
