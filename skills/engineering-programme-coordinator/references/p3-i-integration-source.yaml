impact_rules:
  - id: L2-RULE-P3I-SCHEMA
    path_glob: skills/engineering-programme-coordinator/schemas/*
    severity: CRITICAL
    impact_statement: P3-I schema changes may alter integration input or result truth.
    expected_observation: Exact-head contract tests cover every new or changed P3-I schema surface.
    plausible_green_but_wrong: A schema accepts an authority-expanding result while runtime tests remain green.
    evidence_method: SCHEMA_CHECK
  - id: L2-RULE-P3I-RUNTIME
    path_glob: skills/engineering-programme-coordinator/scripts/*
    severity: CRITICAL
    impact_statement: P3-I runtime changes may alter integration replay or qualification decisions.
    expected_observation: Exact-head integration tests exercise clean and adversarial lanes through owning runtimes.
    plausible_green_but_wrong: The integration wrapper bypasses an owning validator while reporting a green result.
    evidence_method: INTEGRATION_TEST
  - id: L2-RULE-P3I-TEST
    path_glob: skills/engineering-programme-coordinator/tests/*
    severity: HIGH
    impact_statement: P3-I test changes may weaken or strengthen the qualification oracle.
    expected_observation: Test review preserves P3I-01 through P3I-20 and explicit negative controls.
    plausible_green_but_wrong: Tests are weakened to assert only shallow shape success.
    evidence_method: MANUAL_REVIEW
  - id: L2-RULE-P3I-REFERENCE
    path_glob: skills/engineering-programme-coordinator/references/*
    severity: HIGH
    impact_statement: P3-I retained source changes may alter the frozen integration basis.
    expected_observation: Source and manifest digests are revalidated at the exact candidate.
    plausible_green_but_wrong: A stale retained source is accepted because its YAML remains valid.
    evidence_method: CONTRACT_TEST
  - id: L2-RULE-P3I-WORKFLOW
    path_glob: .github/workflows/engineering-programme-coordinator-integrated.yml
    severity: HIGH
    impact_statement: Hosted qualification wiring changes may omit the exact P3-I replay.
    expected_observation: The hosted workflow executes the P3-I qualification on the exact PR head.
    plausible_green_but_wrong: Unit tests are green while the hosted integration qualifier is never invoked.
    evidence_method: INTEGRATION_TEST
unknown_impact_policy:
  severity: CRITICAL
  expected_observation: Any unmatched changed path remains explicit and blocks a clean closed denominator until reviewed.
  plausible_green_but_wrong: An unclassified path silently disappears from P3-I impact coverage.
  evidence_method: MANUAL_REVIEW
