contract_obligations:
  - id: P3I-EXACT-CANDIDATE
    severity: CRITICAL
    claim_type: INVARIANT
    statement: Every Phase-3 integration object binds the exact current candidate or fails closed.
    subject_refs:
      - skills/engineering-programme-coordinator/scripts/evidence_gate.py
      - skills/engineering-programme-coordinator/scripts/execution_kernel.py
    expected_observation: A candidate mismatch cannot reach ADVANCE_ELIGIBLE or REQUEST_STAGE_ADVANCE.
    plausible_green_but_wrong: Individually valid artifacts from different candidate heads are assembled into a seemingly green integration result.
    method: INTEGRATION_TEST
    oracle_ref: qualification://P3-I/exact-candidate
  - id: P3I-SAME-PRINCIPAL
    severity: CRITICAL
    claim_type: AUTHORITY
    statement: Fresh same-principal reconstruction remains principal_independence NONE.
    subject_refs:
      - skills/engineering-programme-coordinator/scripts/principal_independence.py
    expected_observation: Same-principal self-review compiles canonical independence NONE and rejects inflated source claims.
    plausible_green_but_wrong: Fresh context is mislabeled as partial or full principal independence.
    method: CONTRACT_TEST
    oracle_ref: qualification://P3-I/principal-truth
  - id: P3I-SOURCE-REPLAY
    severity: CRITICAL
    claim_type: NEGATIVE_OUTCOME
    statement: Shape-valid or self-digest-consistent stale Phase-3 objects cannot self-certify.
    subject_refs:
      - skills/engineering-programme-coordinator/scripts/review_basis.py
      - skills/engineering-programme-coordinator/scripts/self_review_expectation_freeze.py
      - skills/engineering-programme-coordinator/scripts/evidence_gate.py
    expected_observation: A stale source binding routes to rejection or REPLAY before advancement.
    plausible_green_but_wrong: A stored green result is accepted without fresh replay against its owning sources.
    method: FAULT_INJECTION
    oracle_ref: qualification://P3-I/source-replay
  - id: P3I-AUTHORITY-SEPARATION
    severity: CRITICAL
    claim_type: AUTHORITY
    statement: Phase-3 review and gate evidence never performs lifecycle, merge, or production transition.
    subject_refs:
      - skills/engineering-programme-coordinator/scripts/evidence_gate.py
      - skills/engineering-programme-coordinator/scripts/execution_kernel.py
    expected_observation: ADVANCE_ELIGIBLE yields REQUEST_STAGE_ADVANCE only and capability may deny that request.
    plausible_green_but_wrong: A clean gate result is interpreted as engineering PASS or direct lifecycle authority.
    method: CONTRACT_TEST
    oracle_ref: qualification://P3-I/authority-separation
