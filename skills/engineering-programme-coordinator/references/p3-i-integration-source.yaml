retained_p2i:
  source_path: skills/engineering-programme-coordinator/references/p2-i-self-review-qualification-source.yaml
forbidden_outcomes:
  - external Reviewer or Super Reviewer becomes mandatory
  - same-principal freshness is labelled independent
  - NOT_FALSIFIED is relabelled PASS
  - stale or contradictory evidence reaches ADVANCE_ELIGIBLE
  - ADVANCE_ELIGIBLE performs a Local lifecycle transition
  - integration result grants merge authority or production cutover
non_goals:
  - new review role
  - new Common Reviewer protocol
  - new evidence gate
  - Local lifecycle redesign
  - v3.2 modification
  - v3.5 authority expansion
  - Common #570 implementation
  - Phase-4 shadow or promotion work
authority_boundaries:
  emits_engineering_pass: false
  emits_project_acceptance_pass: false
  emits_independent_review_verdict: false
  performs_lifecycle_advance: false
  grants_merge_authority: false
  grants_production_cutover: false
