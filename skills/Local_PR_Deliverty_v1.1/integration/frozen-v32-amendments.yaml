schema: frozen-v32-amendments
policy: >-
  skills/engineering-pr-delivery-v3.2/** is frozen (#492/#494). A change to it is permitted only for the exact paths
  listed by an owner_authorized amendment below, and only when this manifest is already present at the pull-request
  base (scripts/frozen_tree_guard.py reads it from the base commit, never from the PR head): a pull request cannot
  authorise its own edits to the frozen tree. Anything not listed, including deletions and renames, still fails.
amendments:
