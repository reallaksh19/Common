schema: local-pr-deliverty-stack/v1
stack_id: LOCAL_V1_1_V35
outer_protocol:
  name: Local_PR_Deliverty_v1.1
  path: skills/Local_PR_Deliverty_v1.1
  role: PRODUCTION_CONTROL_PLANE
nested_protocols:
  CODER:
    name: engineering-pr-delivery-v3.5
    path: skills/engineering-pr-delivery-v3.5
    role: ENGINEERING_CONTINUITY_RECOVERY
review_stack:
  common_floor:
    name: common-reviewer-protocol-v1.0
    path: skills/common-reviewer-protocol-v1.0
    role: GENERIC_ENGINEERING_REVIEW_FLOOR
    exact_ref_and_digest_required: true
  project_overlay:
    source: PINNED_PROJECT_REVIEW_ACCEPTANCE_PROTOCOL
    required: true
    may_strengthen_common_floor: true
    may_silently_weaken_common_floor: false
  role_consumers:
    REVIEWER:
      common_floor_required: true
      project_methods: reviewer_check_required
    COORDINATOR_SUPER_REVIEWER:
      common_floor_required: true
      project_methods: super_review_required
coordinator_adapter:
  name: engineering-programme-coordinator
  mode: LOCAL_V1_1_INTEGRATED
  role: OBSERVATION_ONLY
forbidden_active_relay_versions:
  - engineering-pr-delivery-v2
  - engineering-pr-delivery-v2.5
  - engineering-pr-delivery-v3
  - engineering-pr-delivery-v3.1
  - engineering-pr-delivery-v3.2
allowed_legacy_reads:
  - HISTORICAL
  - MIGRATION
  - COMPATIBILITY
upgrade_policy:
  automatic_switch: false
  notify_owner_on_successor: true
  notify_owner_on_same_version_digest_change: true
  common_review_revision_notice: true
activation:
  material_work_requires:
    - EXACT_PROTOCOL_PINS
    - ROLE_RESOLVED
    - PROJECT_REVIEW_PROTOCOL_PINNED
    - COMMON_REVIEW_PROTOCOL_PINNED
    - TIMER_ACCOUNTING_ARMED
    - TASK_EVIDENCE_START_PUBLISHED
    - TASK_EVIDENCE_START_READ_BACK
