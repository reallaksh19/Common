interface:
  display_name: "Publication"
  short_description: "Rebuild source PDFs with zero-loss, student-usable integrity"
  default_prompt: "Use $grade9-publication as a strict source-preserving control skill. Freeze the source and core/question denominators before layout; classify source obligations, representation dependencies, answer-choice dependencies, and stable links before scaling. For long or multi-batch builds, read references/batch-production.md. For long question banks, transfer books, worksheets, or question-plus-solution products, you MUST read references/student-first-question-bank-layout.md, references/question-bank-assimilation-integrity.md, references/student-page-qa.md, and references/audit-manifest-spec.md. Enforce bounded study sets; QUESTION -> WORK HERE -> optional stacked H1 NOTICE -> H2 MODEL -> H3 START; true math/science typography; visible/recoverable options; and representation-dependency closure so every required graph/diagram/table/statement set is present and legible on the student page and repeated in a standalone solution recap when needed. Solutions must be self-contained and concept-assimilating: QUESTION RECAP -> required representation -> WHY THIS WORKS -> METHOD -> ANSWER/CHECK -> CONCEPT TO KEEP -> return link. METHOD must not equal or merely restate ANSWER. Use specialized publication QA when the content family appears: references/graph-semantic-qa.md for graph-heavy pages; references/derivation-coefficient-qa.md for derivations/coefficient-reading; references/interval-pattern-qa.md for nth-second or cumulative-to-interval patterns; references/multi-object-time-geometry-qa.md for delayed-start/multi-object/meeting/braking/geometry problems; references/short-route-gravity-sign-qa.md for definitions-first or gravity/sign-convention pages; references/gravity-freefall-interval-qa.md for free-fall scaling, multiple-drop clocks, last-distance, between-point, and droplet-spacing intervals; and references/artifact-audience-qa.md when learner/audit artifacts are separated. After every 5-10 questions/pages or one set, stop and audit the current batch; do not generate the next batch while any question is unattemptable, has a missing representation/invisible choice, weak hint progression, answer-only method, copy-paste drift, broken notation/link, overlap, clipping, or bounds failure. Use subject-specific skills such as grade9-physics-subtopic-book-builder or chemistry skills for concept correctness. Run scripts/check_publication_manifest.py, scripts/check_text_overlaps.py, scripts/check_math_typography.py, and for supported solution layouts scripts/check_question_bank_assimilation.py; then inspect rendered pages/contact sheets. Never invent missing source semantics or silently correct source errors; mark REVIEW_REQUIRED. Do not claim publisher-ready until all blocking counters are zero and every question record is PASS."
