interface:
  display_name: "Publication"
  short_description: "Rebuild source PDFs without losing core content"
  default_prompt: "Use $grade9-publication to reconstruct this Grade 9-11 educational PDF as a publisher-grade, source-faithful edition with teacher-value additions, stable cross-links, anti-drift checkpoints, and zero-loss audit. For long question banks or practice books, also apply references/student-first-question-bank-layout.md: chunk work into bounded study sets, place WORK HERE before stacked H1-H3, make hints progressively more concrete (including numeric detail when useful), prevent overlap by reserving dynamic hint height, and make every solution question-aware with a recap and return link."
