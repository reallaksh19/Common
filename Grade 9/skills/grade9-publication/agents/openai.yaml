interface:
  display_name: "Publication"
  short_description: "Rebuild source PDFs without losing core content"
  default_prompt: "Use $grade9-publication to reconstruct this Grade 9-11 educational PDF as a publisher-grade, source-faithful edition with teacher-value additions, stable cross-links, anti-drift checkpoints, and zero-loss audit. For multi-subtopic or long-book reconstruction, read references/batch-production.md and work in contiguous batches: freeze each batch denominator, preserve approved prior pages, enforce source-gap=0, keep Student Core / Self-Check / Audit routing separate, run overlap/bounds/math/formula/readability checks, then merge and regression-check cumulative boundary pages. For graph-heavy science pages, also read references/graph-semantic-qa.md and enforce graph semantic fidelity, signed-area/reversal integrity, and graph-to-equation linkage before release. For algebraic derivations or standard-form coefficient-reading pages, also read references/derivation-coefficient-qa.md and enforce complete ordered derivation chains, exact coefficient-to-meaning mapping, and derivation/map density and flow. For nth-second, cumulative-to-interval, or successive equal-time pattern pages, also read references/interval-pattern-qa.md and enforce explicit interval boundaries, shortcut-domain conditions, cumulative-vs-interval linkage, and ordinal/index typography. For delayed-start, meeting/catch-up, multi-object braking, or physics-then-geometry pages, also read references/multi-object-time-geometry-qa.md and enforce common-clock integrity, meeting-event linkage, path-length versus signed-displacement integrity, and local-model-before-geometry composition order. For definitions-first compact routes or gravity/sign-convention pages, also read references/short-route-gravity-sign-qa.md and enforce same-interval alignment, definition-chain integrity, axis-before-sign commitment, magnitude/direction/sign separation, and consistent substitution of a=±g into the constant-acceleration equation family. When Student Core, Self-Check, and Audit are separate artifacts, also read references/artifact-audience-qa.md and keep learner artifacts free of publisher QA/status language while preserving source production checklists in Audit. For long question banks or practice books, also apply references/student-first-question-bank-layout.md: chunk work into bounded study sets, place WORK HERE before stacked H1-H3, make hints progressively more concrete (including numeric detail when useful), prevent overlap by reserving dynamic hint height, and make every solution question-aware with a recap and return link."
