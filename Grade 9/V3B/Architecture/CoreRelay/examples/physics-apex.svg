<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="title desc">
<title id="title">Velocity and acceleration at a projectile apex</title>
<desc id="desc">Three points on a schematic projectile path. Blue velocity arrows point upward and right before the apex, right at the apex, and downward and right after it. Orange acceleration arrows point down at all three points. Velocity and acceleration have different units and their arrow lengths are not comparable.</desc>
<defs>
<marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#145bb5"/></marker>
<marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b34b00"/></marker>
<marker id="gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#475569"/></marker>
</defs>
<rect width="800" height="470" fill="white"/>
<g font-family="Arial, sans-serif" fill="#15283b">
<text x="35" y="38" font-size="23" font-weight="bold">At the apex, gravity has not switched off</text>
<text x="35" y="65" font-size="15">Ideal projectile: no air resistance; constant downward acceleration</text>
<path d="M120 265 Q380 -15 640 265" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 6"/>
<path d="M65 295V180" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#gray)"/>
<text x="45" y="163" font-size="16">+y</text>
<path d="M120 265L185 195M380 125L468 125M640 265L699 329" fill="none" stroke="#145bb5" stroke-width="3.5" marker-end="url(#blue)"/>
<path d="M120 265V335M380 125V195M640 265V335" fill="none" stroke="#b34b00" stroke-width="3.5" marker-end="url(#orange)"/>
<circle cx="120" cy="265" r="5" fill="#15283b"/><circle cx="380" cy="125" r="5" fill="#15283b"/><circle cx="640" cy="265" r="5" fill="#15283b"/>
<text x="157" y="182" font-size="16" fill="#145bb5">rising velocity</text>
<text x="357" y="99" font-size="16" fill="#145bb5">horizontal velocity</text>
<text x="640" y="242" font-size="16" fill="#145bb5">falling velocity</text>
<text x="135" y="319" font-size="16" fill="#b34b00">a downward</text>
<text x="393" y="189" font-size="16" fill="#b34b00">a downward</text>
<text x="517" y="341" font-size="16" fill="#b34b00">a downward</text>
<text x="346" y="225" font-size="17" font-weight="bold">APEX</text>
<text x="307" y="250" font-size="16">v_y = 0, v_x &gt; 0</text>
<text x="337" y="275" font-size="16">a_y = -g</text>
<line x1="36" y1="382" x2="78" y2="382" stroke="#145bb5" stroke-width="3.5" marker-end="url(#blue)"/>
<text x="91" y="387" font-size="16">Velocity</text>
<line x1="244" y1="382" x2="286" y2="382" stroke="#b34b00" stroke-width="3.5" marker-end="url(#orange)"/>
<text x="300" y="387" font-size="16">Acceleration</text>
<text x="35" y="424" font-size="14">Schematic arrows: velocity and acceleration have different units.</text>
<text x="35" y="445" font-size="14">Do not compare their arrow lengths as magnitudes. Dashed curve = path.</text>
</g>
</svg>
