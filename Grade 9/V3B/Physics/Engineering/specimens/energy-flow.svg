<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img"><title>Signed energy transfer into and out of a closed gas system</title><rect width="900" height="430" fill="#fff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#174d74"/></marker></defs><g font-family="sans-serif" fill="#162f43"><text x="40" y="45" font-size="26">Choose the gas as the system</text><rect x="325" y="115" width="260" height="190" rx="12" fill="#edf5fa" stroke="#174d74" stroke-width="3"/><text x="455" y="174" font-size="24" text-anchor="middle">Closed gas system</text><text x="455" y="215" font-size="22" text-anchor="middle">Internal-energy change</text><text x="455" y="254" font-size="26" text-anchor="middle">ΔU = +320 J</text><path d="M60 210 H305" fill="none" stroke="#174d74" stroke-width="4" marker-end="url(#arrow)"/><text x="80" y="173" font-size="22">Heat entering</text><text x="90" y="255" font-size="22">Q = +500 J</text><path d="M603 210 H835" fill="none" stroke="#174d74" stroke-width="4" marker-end="url(#arrow)"/><text x="615" y="173" font-size="22">Work leaving</text><text x="615" y="255" font-size="22">W by = +180 J</text><text x="40" y="358" font-size="23">Arrow-to-equation map: ΔU = Q − W by = 500 − 180 = 320 J</text><text x="40" y="396" font-size="18">No mass transfer; no change in bulk kinetic or potential energy.</text></g></svg>