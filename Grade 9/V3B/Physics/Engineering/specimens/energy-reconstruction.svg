<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img"><title>Expected energy-flow reconstruction for insulated compression</title><rect width="900" height="340" fill="white"/><defs><marker id="in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#174d74"/></marker></defs><g font-family="sans-serif" fill="#183349"><text x="35" y="42" font-size="24">Expected reconstruction — reveal after your attempt</text><rect x="290" y="100" width="290" height="155" rx="10" stroke="#174d74" stroke-width="3" fill="#edf5fa"/><text x="435" y="148" font-size="24" text-anchor="middle">Gas system</text><text x="435" y="187" font-size="21" text-anchor="middle">Insulated boundary: Q = 0</text><text x="435" y="226" font-size="23" text-anchor="middle">ΔU &gt; 0</text><path d="M820 179 H601" fill="none" stroke="#174d74" stroke-width="4" marker-end="url(#in)"/><text x="620" y="142" font-size="22">Work enters</text><text x="623" y="224" font-size="22">W by &lt; 0</text><text x="36" y="300" font-size="21">The inward work arrow maps to ΔU = −W by, which is positive.</text></g></svg>