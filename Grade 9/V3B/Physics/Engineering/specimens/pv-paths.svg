<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img"><title>Two quasistatic paths between the same thermodynamic states</title><rect width="900" height="430" fill="white"/><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#176596"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#a84712"/></marker></defs><g font-family="sans-serif" fill="#172e40"><text x="35" y="35" font-size="24">Same endpoints; different boundary work</text><path d="M110 345 H630 M110 345 V60" fill="none" stroke="#172e40" stroke-width="2"/><text x="36" y="72" font-size="21">p / kPa</text><text x="550" y="389" font-size="21">V / L</text><text x="63" y="274" font-size="18">100</text><text x="63" y="121" font-size="18">300</text><text x="246" y="373" font-size="18">1</text><text x="546" y="373" font-size="18">3</text><path d="M250 270 H550 V115" stroke="#176596" stroke-width="4" fill="none"/><path d="M250 270 V115 H550" stroke="#a84712" stroke-width="4" stroke-dasharray="10 6" fill="none"/><path d="M330 270 H415 M550 235 V183" stroke="#176596" stroke-width="3" marker-end="url(#blue)" fill="none"/><path d="M250 230 V180 M330 115 H415" stroke="#a84712" stroke-width="3" marker-end="url(#orange)" fill="none"/><circle cx="250" cy="270" r="5"/><circle cx="550" cy="115" r="5"/><text x="218" y="301" font-size="19">A</text><text x="565" y="105" font-size="19">B</text><text x="643" y="146" font-size="20" fill="#a84712">Upper path:</text><text x="643" y="177" font-size="18">pressure rises first</text><text x="643" y="241" font-size="20" fill="#176596">Lower path:</text><text x="643" y="272" font-size="18">expansion first</text><text x="110" y="420" font-size="18">Only horizontal segments contribute area; arrows give process direction.</text></g></svg>