<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img"><title>Constant-pressure piston expansion</title><rect width="900" height="430" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#174d74"/></marker></defs><g font-family="sans-serif" fill="#173449"><text x="35" y="40" font-size="25">A moving boundary transfers energy as work</text><path d="M115 95 V310 H730 V95" stroke="#173449" stroke-width="4" fill="none"/><rect x="119" y="140" width="380" height="166" fill="#e9f3fa"/><path d="M345 95 V307" stroke="#6b8191" stroke-width="4" stroke-dasharray="10 6"/><rect x="499" y="95" width="15" height="212" fill="#436d88"/><path d="M380 84 H490" stroke="#174d74" stroke-width="3" marker-end="url(#a)"/><text x="195" y="218" font-size="24">Gas expands</text><text x="546" y="175" font-size="22">Opposing pressure</text><text x="575" y="211" font-size="24">180 kPa</text><text x="240" y="349" font-size="21">V initial = 1.5 L</text><text x="475" y="381" font-size="21">V final = 3.5 L</text><text x="35" y="416" font-size="18">Schematic; piston positions indicate expansion, not a calibrated volume scale.</text></g></svg>