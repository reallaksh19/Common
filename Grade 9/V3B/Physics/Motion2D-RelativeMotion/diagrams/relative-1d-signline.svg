<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">One-dimensional relative velocity sign line</title><desc id="desc">East is positive. A moves east at eight metres per second, B east at five, so A relative to B is plus three east and B relative to A is minus three west.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z"/></marker></defs><line x1="90" y1="210" x2="820" y2="210" stroke="black" marker-end="url(#a)"/><text x="740" y="240">+ east</text><line x1="170" y1="150" x2="650" y2="150" stroke="black" stroke-width="4" marker-end="url(#a)"/><text x="320" y="130">A/G = +8 m/s</text><line x1="170" y1="275" x2="470" y2="275" stroke="black" stroke-width="4" marker-end="url(#a)"/><text x="265" y="315">B/G = +5 m/s</text><text x="90" y="65">A/B = +3 m/s east. Reverse observer: B/A = −3 m/s west.</text></svg>