<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Time-labelled planar path for the tracked object</title><desc id="desc">The object is at zero zero at zero seconds, six eight at two seconds, twelve sixteen at four seconds, and remains at twelve sixteen at six seconds.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z"/></marker></defs><line x1="90" y1="420" x2="730" y2="420" stroke="black" marker-end="url(#a)"/><text x="680" y="455">x (m)</text><line x1="90" y1="420" x2="90" y2="45" stroke="black" marker-end="url(#a)"/><text x="35" y="70">y (m)</text><line x1="120" y1="390" x2="600" y2="110" stroke="black" stroke-width="4" marker-end="url(#a)"/><circle cx="120" cy="390" r="7"/><text x="120" y="415">t=0, (0,0)</text><circle cx="360" cy="250" r="7"/><text x="365" y="245">t=2, (6,8)</text><circle cx="600" cy="110" r="8"/><text x="610" y="105">t=4 and t=6, (12,16)</text><path d="M620 130 q45 35 0 70" fill="none" stroke="black" stroke-width="2" marker-end="url(#a)"/><text x="620" y="220">same position 4–6 s</text></svg>