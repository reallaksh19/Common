<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Observer, frame, axes, origin and common clock</title><desc id="desc">A ground frame and a moving bus frame are shown with origins, positive east axes, and one common comparison clock beginning at t equals zero.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z"/></marker></defs><line x1="80" y1="350" x2="820" y2="350" stroke="black" stroke-width="2" marker-end="url(#a)"/><text x="700" y="382">ground +x east</text><circle cx="170" cy="350" r="7"/><text x="115" y="410">ground origin O</text><rect x="340" y="210" width="300" height="100" fill="none" stroke="black" stroke-width="3"/><text x="430" y="260">moving bus frame</text><line x1="390" y1="300" x2="610" y2="300" stroke="black" stroke-width="2" marker-end="url(#a)"/><circle cx="390" cy="300" r="6"/><text x="520" y="330">bus +x′ east</text><text x="340" y="190">bus origin O′</text><text x="80" y="80">Common comparison clock: t = 0 s at the stated simultaneous start</text><text x="80" y="115">A bag can be at rest in the bus frame while moving in the ground frame.</text></svg>