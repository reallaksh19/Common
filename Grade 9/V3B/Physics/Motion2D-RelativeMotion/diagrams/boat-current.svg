<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title desc"><title id="title">Boat current frame composition</title><desc id="desc">Water moves four metres per second east relative to ground. Boat moves three metres per second north relative to water. Their vector sum is boat relative to ground, four east and three north, magnitude five.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z"/></marker></defs><line x1="120" y1="390" x2="440" y2="390" stroke="black" stroke-width="4" marker-end="url(#a)"/><text x="205" y="420">vW/G = 4 m/s east</text><line x1="440" y1="390" x2="440" y2="150" stroke="black" stroke-width="4" marker-end="url(#a)"/><text x="455" y="285">vB/W = 3 m/s north</text><line x1="120" y1="390" x2="440" y2="150" stroke="black" stroke-width="4" stroke-dasharray="8,6" marker-end="url(#a)"/><text x="210" y="245">vB/G = (4,3) m/s; speed 5 m/s</text><line x1="60" y1="410" x2="820" y2="410" stroke="black"/><text x="60" y="455">south bank</text><line x1="60" y1="90" x2="820" y2="90" stroke="black"/><text x="60" y="75">north bank — width is across-river direction</text></svg>