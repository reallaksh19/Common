<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">x of t and y of t graphs with the same time convention</title><desc id="desc">Both coordinate-time graphs rise linearly until four seconds and are flat from four to six seconds. Time is horizontal on both graphs so coordinates at one event use the same time.</desc><g font-family="sans-serif" font-size="16"><line x1="90" y1="220" x2="390" y2="220" stroke="black"/><line x1="90" y1="220" x2="90" y2="50" stroke="black"/><polyline points="90,220 290,80 390,80" fill="none" stroke="black" stroke-width="4"/><text x="70" y="40">x (m)</text><text x="350" y="250">t (s)</text><text x="280" y="245">4</text><text x="380" y="245">6</text><text x="60" y="85">12</text><text x="110" y="285">x(t): slope 3 m/s to 4 s, then 0</text><line x1="510" y1="220" x2="810" y2="220" stroke="black"/><line x1="510" y1="220" x2="510" y2="50" stroke="black"/><polyline points="510,220 710,60 810,60" fill="none" stroke="black" stroke-width="4"/><text x="490" y="40">y (m)</text><text x="770" y="250">t (s)</text><text x="700" y="245">4</text><text x="800" y="245">6</text><text x="475" y="65">16</text><text x="530" y="285">y(t): slope 4 m/s to 4 s, then 0</text><text x="185" y="355">Shared rule: at one physical event, read x and y at the same t.</text></g></svg>