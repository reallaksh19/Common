<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">Signed rectangular components and a resultant vector</title><desc id="desc">Horizontal and vertical signed component changes form perpendicular legs. Their vector resultant is the diagonal and its magnitude follows Pythagoras.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z"/></marker></defs><line x1="120" y1="330" x2="530" y2="330" stroke="black" stroke-width="4" marker-end="url(#a)"/><line x1="530" y1="330" x2="530" y2="90" stroke="black" stroke-width="4" marker-end="url(#a)"/><line x1="120" y1="330" x2="530" y2="90" stroke="black" stroke-width="4" stroke-dasharray="8,6" marker-end="url(#a)"/><path d="M505 330 L505 305 L530 305" fill="none" stroke="black" stroke-width="2"/><text x="280" y="365">Δx signed component</text><text x="545" y="220">Δy signed component</text><text x="255" y="185">|Δr| = √(Δx²+Δy²)</text><text x="85" y="355">start</text><text x="535" y="82">finish</text></svg>