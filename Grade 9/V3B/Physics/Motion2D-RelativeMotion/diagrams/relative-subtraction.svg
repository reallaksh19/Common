<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="title desc"><title id="title">Relative velocity subtraction construction</title><desc id="desc">For A moving three east and B four north relative to ground, A relative to B is three east and four south. The triangle also shows A ground equals A relative B plus B ground.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z"/></marker></defs><line x1="150" y1="320" x2="390" y2="320" stroke="black" stroke-width="4" marker-end="url(#a)"/><text x="205" y="350">vA/G = (3,0)</text><line x1="150" y1="320" x2="150" y2="90" stroke="black" stroke-width="4" marker-end="url(#a)"/><text x="35" y="205">vB/G = (0,4)</text><line x1="150" y1="90" x2="390" y2="320" stroke="black" stroke-width="4" stroke-dasharray="8,6" marker-end="url(#a)"/><text x="405" y="215">vA/B = (3,−4)</text><text x="150" y="410">Equivalent: vA/G = vA/B + vB/G.</text></svg>