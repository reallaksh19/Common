<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">Rain and moving observer frames</title><desc id="desc">Rain falls south at six metres per second in the ground frame while an observer moves east at eight. Rain relative to the observer is eight west and six south, magnitude ten.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z"/></marker></defs><circle cx="450" cy="220" r="6"/><text x="465" y="220">common tail</text><line x1="450" y1="220" x2="450" y2="400" stroke="black" stroke-width="4" marker-end="url(#a)"/><text x="465" y="330">vR/G=(0,−6)</text><line x1="450" y1="220" x2="700" y2="220" stroke="black" stroke-width="4" marker-end="url(#a)"/><text x="520" y="200">vO/G=(8,0)</text><line x1="450" y1="220" x2="200" y2="400" stroke="black" stroke-width="4" stroke-dasharray="8,6" marker-end="url(#a)"/><text x="80" y="340">vR/O=(−8,−6), magnitude 10</text><text x="90" y="455">Observer subtraction creates a westward apparent component.</text></svg>