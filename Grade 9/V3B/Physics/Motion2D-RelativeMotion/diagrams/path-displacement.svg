<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">Path and displacement for six metres east then eight metres north</title><desc id="desc">The path has a six metre east leg followed by an eight metre north leg. The direct start-to-finish displacement is ten metres.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z"/></marker></defs><line x1="90" y1="390" x2="700" y2="390" stroke="black" marker-end="url(#a)"/><text x="650" y="425">+x east</text><line x1="90" y1="390" x2="90" y2="45" stroke="black" marker-end="url(#a)"/><text x="20" y="70">+y north</text><polyline points="120,350 390,350 390,90" fill="none" stroke="black" stroke-width="5" marker-end="url(#a)"/><line x1="120" y1="350" x2="390" y2="90" stroke="black" stroke-width="3" stroke-dasharray="10,8" marker-end="url(#a)"/><circle cx="120" cy="350" r="6"/><circle cx="390" cy="350" r="6"/><circle cx="390" cy="90" r="6"/><text x="90" y="380">O start</text><text x="405" y="365">turn</text><text x="405" y="90">F finish</text><text x="225" y="338">6 m path</text><text x="405" y="225">8 m path</text><text x="195" y="205">displacement O→F = 10 m</text></svg>